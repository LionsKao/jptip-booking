<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking</title>
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .entry-view {
    width: 100%;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }
  .entry-cards {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
    margin-top: 0;
    width: 100%;
  }
  .entry-card {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    text-decoration: none;
    color: var(--text-main);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease, opacity .5s ease;
  }
  .entry-card:hover {
    border-color: var(--color-blue);
    box-shadow: var(--shadow-md);
  }
  .entry-card[hidden] {
    display: none !important;
  }
  .entry-card.leaving {
    opacity: 0;
    pointer-events: none;
  }
  .entry-card.role-locked {
    cursor: default;
  }
  .entry-card.role-locked:hover {
    border-color: var(--line);
    box-shadow: var(--shadow-sm);
  }
  .entry-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .entry-card-icon img { width: 100%; height: 100%; object-fit: contain; }
  .entry-card-primary {
    padding: var(--space-5) 40px;
  }
  .entry-card-primary .entry-card-icon {
    width: 64px; height: 64px;
  }
  .entry-card-primary h3 { margin: 0 0 4px; font-size: 1.375rem; }
  .entry-card-primary p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); }

  body.home {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.home .page {
    width: 100%;
    padding-top: 0;
    padding-bottom: 0;
  }

  .login-form-area {
    margin-top: var(--space-5);
    opacity: 0;
    transition: opacity .32s ease;
  }
  .login-form-area.active {
    opacity: 1;
  }
  .login-form-area .login-card {
    position: relative;
    max-width: none;
    width: 100%;
    margin: 0;
    min-height: 370px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 3px solid var(--line);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    box-shadow: var(--shadow-sm);
  }
  .login-form-area .login-card-body {
    flex: 1;
    width: 100%;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .login-form-area #login-email {
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .login-form-area .field,
  .login-form-area .otp-row {
    margin-bottom: var(--space-4);
  }
  /* .otp-row lives inside .login-step-2, which has overflow:hidden for its
     collapse/expand animation — so the "day-select" pop (translateY up to
     -7px) gets clipped the instant it rises past .login-step-2's own top
     edge. A gap as margin-bottom on the resend button (outside
     .login-step-2) doesn't move that edge at all; padding-top on .otp-row
     itself does, giving the lift real room before it hits the clip. */
  .login-form-area [data-login-send] {
    margin-bottom: 0;
  }
  .login-form-area .otp-row {
    padding-top: var(--space-4);
  }
  /* The OTP boxes' default size (48px + 8px gaps) adds up to 328px, wider
     than this card's 300px content column — shrink them so all 6 fit
     without being clipped by .login-step-2's overflow:hidden (needed for
     its collapse/expand animation). */
  .login-form-area .otp-box {
    width: 40px;
  }
  .back-link {
    position: fixed;
    top: var(--space-6);
    left: var(--space-6);
    z-index: 10;
  }

  /* Dev-only quick-fill: pick a test account's avatar to fill the Email
     field instead of typing it out every time. Sits below the login card
     as its own block so it never affects the card's own size. */
  .test-quick-fill {
    margin-top: var(--space-5);
    display: flex;
    justify-content: center;
    gap: var(--space-3);
    flex-wrap: wrap;
  }
  .test-quick-fill button {
    position: relative;
    width: 64px;
    height: 64px;
    padding: 0;
    border-radius: 50%;
    border: 3px solid var(--line);
    background: var(--bg-card-alt);
    cursor: pointer;
    transition: border-color .2s ease;
  }
  /* The circular crop lives on this inner wrapper, not the button itself —
     the button needs overflow visible so the .selected checkmark badge
     (positioned outside its box, top-right) doesn't get clipped. */
  .test-quick-fill button .avatar-crop {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
  }
  .test-quick-fill button:hover {
    border-color: var(--color-blue);
  }
  .test-quick-fill button.pop {
    animation: day-select .35s ease;
  }
  .test-quick-fill button.selected {
    border-color: var(--color-blue);
  }
  .test-quick-fill button.selected::after {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    top: -4px; right: -4px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--color-green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .65rem;
    box-shadow: var(--shadow-sm);
  }
  /* Once the OTP step is showing it's no longer useful anyway (the Email
     field is already filled in) — hide it so it doesn't clutter the view. */
  .login-card[data-step="2"] ~ .test-quick-fill {
    display: none;
  }
  .test-quick-fill button img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (max-width: 640px) {
    .entry-card-primary {
      padding: var(--space-4);
      gap: var(--space-3);
    }
    .login-form-area .login-card {
      padding: var(--space-4);
    }
    .back-link {
      top: var(--space-3);
      left: var(--space-3);
    }
  }
</style>
</head>
<body class="home">

<div id="lang-switch"></div>

<div class="page">

  <div class="entry-view" id="entry-view">
    <div class="entry-cards" id="entry-cards">
      <button type="button" class="entry-card entry-card-primary" data-role="student">
        <span class="entry-card-icon"><img src="assets/icons/student.png" alt=""></span>
        <span>
          <h3 data-i18n="login.role.student.title">學生登入</h3>
          <p data-i18n="login.role.student.desc">立即預約課程，開始學習之旅</p>
        </span>
      </button>
      <button type="button" class="entry-card entry-card-primary" data-role="teacher">
        <span class="entry-card-icon"><img src="assets/icons/laptop.png" alt=""></span>
        <span>
          <h3 data-i18n="login.role.teacher.title">老師登入</h3>
          <p data-i18n="login.role.teacher.desc">管理你的課程與預約時段</p>
        </span>
      </button>
      <button type="button" class="entry-card entry-card-primary" data-role="admin">
        <span class="entry-card-icon"><img src="assets/icons/admin.png" alt=""></span>
        <span>
          <h3 data-i18n="login.role.admin.title">管理者登入</h3>
          <p data-i18n="login.role.admin.desc">管理老師、課程與系統設定</p>
        </span>
      </button>
    </div>

    <div class="login-form-area" id="login-view" hidden>

      <div class="login-card" data-login data-role="">

        <button type="button" class="back-link back-btn" data-login-back data-i18n-aria-label="login.back" aria-label="返回"><i class="fa-solid fa-fw fa-arrow-left"></i></button>

        <div class="login-card-body">
          <div class="row" style="align-items:flex-start;">
            <div class="field" data-login-email-field>
              <div class="field-float">
                <input type="email" id="login-email" data-i18n-placeholder="login.emailPlaceholder" placeholder="Email" autocomplete="email">
              </div>
            </div>
          </div>
          <button type="button" class="btn blue" data-login-send><i class="fa-solid fa-fw fa-paper-plane"></i> <span data-i18n="login.sendCode">取得驗證碼</span></button>

          <div class="login-step-2">

            <div class="otp-row" role="group" data-i18n-aria-label="login.otpGroupLabel" aria-label="6 位數驗證碼">
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 1 碼" disabled>
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 2 碼" disabled>
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 3 碼" disabled>
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 4 碼" disabled>
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 5 碼" disabled>
              <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="第 6 碼" disabled>
            </div>

            <button type="button" class="btn green" data-login-submit disabled><i class="fa-solid fa-fw fa-right-to-bracket"></i> <span data-i18n="login.submit">登入</span></button>
          </div>
        </div>

      </div>

      <div class="test-quick-fill" data-test-quick-fill></div>

    </div>
  </div>

</div>

<div class="modal-overlay" id="loginAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon" id="login-alert-icon"><i class="fa-solid fa-fw" id="login-alert-icon-inner"></i></div>
    <h3 id="login-alert-text"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
(async () => {
  const lang = getCurrentLang();
  await initI18n(lang);
  document.querySelectorAll('.otp-box').forEach((box, i) => {
    box.setAttribute('aria-label', t('login.otpDigitLabel', { n: i + 1 }));
  });

  // 登入頁還沒有帳號可以存語言設定，只能先存 localStorage；帳號真正的
  // language 欄位要等登入成功、進到學生/老師/管理主頁後才會同步。
  renderLangSwitch(document.getElementById('lang-switch'), lang);
})();
</script>
</body>
</html>
