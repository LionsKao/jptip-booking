<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — Email 範本</title>
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  body.email-page .page {
    max-width: 900px;
    padding-top: calc(var(--space-6) + var(--space-5));
    padding-bottom: var(--space-7);
  }

  .email-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
    margin-bottom: var(--space-5);
  }
  .email-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 3px solid var(--line);
    background: var(--bg-card);
    color: var(--text-muted);
    border-radius: var(--radius-lg);
    padding: 10px 18px;
    font-family: inherit;
    font-weight: 700;
    font-size: var(--fs-small);
    cursor: pointer;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
  }
  .email-tab:hover { border-color: var(--color-blue); color: var(--text-main); }
  .email-tab.active {
    border-color: var(--color-blue);
    background: var(--color-blue);
    color: #fff;
  }

  .email-client {
    border: 3px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .email-client-header {
    padding: var(--space-5);
    border-bottom: 3px solid var(--line);
    background: var(--bg-card-alt);
  }
  .email-client-header h3 {
    margin: 0 0 var(--space-3);
    font-size: 1.1rem;
  }
  .email-meta-row {
    display: flex;
    gap: 8px;
    font-size: var(--fs-small);
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .email-meta-row span:first-child { flex: none; width: 60px; font-weight: 700; color: var(--text-main); }

  .email-frame-wrap { background: #EDE7DA; padding: var(--space-5); }
  iframe.email-frame {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
  }

  @media (max-width: 640px) {
    body.email-page .page { padding-top: calc(var(--space-3) + var(--space-3)); }
  }
</style>
</head>
<body class="email-page">

<div class="page">

  <div class="section-title"><img class="title-icon" src="assets/icons/clock.png" alt=""><h2>Email 範本預覽</h2></div>

  <div class="email-tabs" id="email-tabs">
    <button type="button" class="email-tab" data-template="otp"><i class="fa-solid fa-fw fa-key"></i> 登入驗證碼信</button>
    <button type="button" class="email-tab" data-template="booking-student"><i class="fa-solid fa-fw fa-graduation-cap"></i> 預約成功（學生）</button>
    <button type="button" class="email-tab" data-template="booking-teacher"><i class="fa-solid fa-fw fa-chalkboard-user"></i> 預約成功（老師）</button>
    <button type="button" class="email-tab" data-template="booking-admin"><i class="fa-solid fa-fw fa-clipboard-list"></i> 預約成功（管理者）</button>
    <button type="button" class="email-tab" data-template="cancel-student"><i class="fa-solid fa-fw fa-calendar-xmark"></i> 取消預約（學生）</button>
    <button type="button" class="email-tab" data-template="cancel-teacher"><i class="fa-solid fa-fw fa-calendar-xmark"></i> 取消預約（老師）</button>
    <button type="button" class="email-tab" data-template="cancel-admin"><i class="fa-solid fa-fw fa-calendar-xmark"></i> 取消預約（管理者）</button>
  </div>

  <div class="email-client">
    <div class="email-client-header">
      <h3 id="email-subject">—</h3>
      <div class="email-meta-row"><span>寄件人</span><span id="email-from">—</span></div>
      <div class="email-meta-row"><span>收件人</span><span id="email-to">—</span></div>
    </div>
    <div class="email-frame-wrap">
      <iframe class="email-frame" id="email-frame" title="email preview"></iframe>
    </div>
  </div>

</div>

<script src="script.js"></script>
<script>
  // ==========================================================================
  // Email 範本（純前端預覽用，實際寄送邏輯之後由 Worker/Email API 串接）
  // 共用的 email 外框（table-based + inline style，確保 email 客戶端相容性）
  // ==========================================================================
  // iconSrc 需為完整網址（部署後改成 https://lionbooking.xxx.workers.dev/assets/icons/...），
  // 這裡先用相對路徑在本機預覽（email.html 跟 assets/ 同層，iframe srcdoc 會沿用外層網址解析）。
  // 頂部橫幅顏色依信件「性質」區分，不再全部都是紅色，一眼就能分辨這是驗證信、
  // 預約成功、還是取消——跟站內其他地方（預約狀態 pill）用的顏色語意一致：
  // 藍＝中性通知、綠＝成功、珊瑚紅＝取消。
  function emailShell(iconSrc, bodyHtml, bannerColor = '#3AA0C9') {
    return `<!doctype html>
<html><head><meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; }
  a { color: inherit; }
</style>
</head>
<body style="margin:0;padding:0;background:#FFF8EC;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF8EC;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:24px;border:3px solid #F0E6D8;overflow:hidden;font-family:'Manrope','Noto Sans TC',sans-serif;">
        <tr><td style="background:${bannerColor};padding:28px 32px;text-align:center;">
          <table role="presentation" align="center" cellpadding="0" cellspacing="0" style="margin:0 auto 10px;">
            <tr><td width="56" height="56" style="background:#ffffff;border-radius:50%;text-align:center;vertical-align:middle;">
              <img src="${iconSrc}" width="32" height="32" alt="" style="display:inline-block;vertical-align:middle;">
            </td></tr>
          </table>
          <div style="font-size:18px;font-weight:800;color:#ffffff;letter-spacing:.02em;">JPTIP 線上一對一</div>
        </td></tr>
        <tr><td style="padding:32px;">
          ${bodyHtml}
        </td></tr>
        <tr><td style="padding:20px 32px;background:#FFF8EC;text-align:center;border-top:3px solid #F0E6D8;">
          <div style="font-size:12px;color:#8f8a87;line-height:1.6;">此為系統自動寄送信件，請勿直接回覆。<br>© JPTIP</div>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>`;
  }

  function infoRow(label, value) {
    return `<tr>
      <td style="padding:10px 0;font-size:13px;color:#8f8a87;width:88px;vertical-align:top;">${label}</td>
      <td style="padding:10px 0;font-size:15px;color:#454545;font-weight:700;">${value}</td>
    </tr>`;
  }

  const TEMPLATES = {
    otp: {
      subject: '【JPTIP】您的登入驗證碼',
      from: 'JPTIP 系統通知 <one-on-one@jptip.co.jp>',
      to: 'student1@jptip.co.jp',
      html: emailShell('assets/icons/key.png', `
        <div style="font-size:15px;color:#454545;margin-bottom:20px;">您好，</div>
        <div style="font-size:15px;color:#454545;line-height:1.8;margin-bottom:24px;">
          您正在登入 JPTIP 預約系統，請於 <strong>5 分鐘內</strong>輸入以下驗證碼完成登入：
        </div>
        <div style="text-align:center;margin-bottom:28px;">
          <span style="display:inline-block;font-size:32px;font-weight:800;letter-spacing:.3em;color:#1F6E8C;background:#E3F4FA;border-radius:16px;padding:16px 28px;">123456</span>
        </div>
        <div style="font-size:13px;color:#8f8a87;line-height:1.7;border-top:3px solid #F0E6D8;padding-top:16px;">
          驗證碼將於 5 分鐘後失效，請勿將驗證碼提供給任何人。<br>
          如果這不是您本人的操作，請忽略這封信件即可，不會影響您的帳號安全。
        </div>
      `, '#3AA0C9'),
    },
    'booking-student': {
      subject: '【JPTIP】預約成功通知',
      from: 'JPTIP 預約系統 <one-on-one@jptip.co.jp>',
      to: 'student3@jptip.co.jp',
      html: emailShell('assets/icons/thumbs-up.png', `
        <div style="font-size:15px;color:#454545;margin-bottom:8px;">李美芳 同學，您好：</div>
        <div style="font-size:15px;color:#454545;line-height:1.8;margin-bottom:24px;">
          您已成功預約以下課程，請準時上線上課：
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
          ${infoRow('課程', 'N5 綜合日本語 J1')}
          ${infoRow('老師', '田中老師')}
          ${infoRow('時間', '2026 年 09 月 20 日 星期日 15:00（UTC+8 台北）')}
        </table>
        <div style="text-align:center;margin-bottom:24px;">
          <a href="#" style="display:inline-block;background:#5FA346;color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;border-radius:14px;padding:14px 32px;">加入會議室</a>
        </div>
        <div style="font-size:13px;color:#8f8a87;line-height:1.7;border-top:3px solid #F0E6D8;padding-top:16px;">
          如需取消或更改預約，請於課程開始前 48 小時完成操作，逾時將視同完成該堂課程。
        </div>
      `, '#5FA346'),
    },
    'booking-teacher': {
      subject: '【JPTIP】新課程預約通知',
      from: 'JPTIP 預約系統 <one-on-one@jptip.co.jp>',
      to: 'teacher1@example.com',
      html: emailShell('assets/icons/teacher.png', `
        <div style="font-size:15px;color:#454545;margin-bottom:8px;">田中 老師，您好：</div>
        <div style="font-size:15px;color:#454545;line-height:1.8;margin-bottom:24px;">
          您有一堂新的課程預約，詳細資訊如下：
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
          ${infoRow('學生', '李美芳')}
          ${infoRow('課程', 'N5 綜合日本語 J1')}
          ${infoRow('時間', '2026 年 09 月 20 日 星期日 15:00（UTC+8 台北）')}
        </table>
        <div style="text-align:center;margin-bottom:24px;">
          <a href="#" style="display:inline-block;background:#5FA346;color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;border-radius:14px;padding:14px 32px;">查看我的課程</a>
        </div>
        <div style="font-size:13px;color:#8f8a87;line-height:1.7;border-top:3px solid #F0E6D8;padding-top:16px;">
          請於課程開始前 10 分鐘進入會議室，並確認麥克風與鏡頭運作正常。
        </div>
      `, '#5FA346'),
    },
    'booking-admin': {
      subject: '【JPTIP】新預約通知（管理者）',
      from: 'JPTIP 系統通知 <one-on-one@jptip.co.jp>',
      to: 'admin@jptip.co.jp',
      html: emailShell('assets/icons/clipboard.png', `
        <div style="font-size:15px;color:#454545;line-height:1.8;margin-bottom:24px;">
          系統偵測到一筆新的預約，摘要如下：
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:8px;">
          ${infoRow('學生', '李美芳（student3@jptip.co.jp）')}
          ${infoRow('老師', '田中老師（teacher1@example.com）')}
          ${infoRow('課程', 'N5 綜合日本語 J1')}
          ${infoRow('時間', '2026 年 09 月 20 日 星期日 15:00（UTC+8）')}
          ${infoRow('預約編號', '#20260920-1500-13')}
          ${infoRow('建立時間', '2026 年 09 月 07 日 10:24（UTC+8）')}
        </table>
        <div style="font-size:13px;color:#8f8a87;line-height:1.7;border-top:3px solid #F0E6D8;padding-top:16px;">
          此信件僅供紀錄與通知，無需回覆。
        </div>
      `, '#5FA346'),
    },
    'cancel-student': {
      subject: '【JPTIP】預約取消通知',
      from: 'JPTIP 預約系統 <one-on-one@jptip.co.jp>',
      to: 'student3@jptip.co.jp',
      html: emailShell('assets/icons/close.png', `
        <div style="font-size:15px;color:#454545;margin-bottom:8px;">李美芳 同學，您好：</div>
        <div style="font-size:15px;color:#454545;line-height:1.8;margin-bottom:24px;">
          您的以下課程預約已取消：
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
          ${infoRow('課程', 'N5 綜合日本語 J1')}
          ${infoRow('老師', '田中老師')}
          ${infoRow('原時間', '2026 年 09 月 20 日 星期日 15:00（UTC+8 台北）')}
        </table>
        <div style="text-align:center;margin-bottom:24px;">
          <a href="#" style="display:inline-block;background:#E0526C;color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;border-radius:14px;padding:14px 32px;">重新預約課程</a>
        </div>
        <div style="font-size:13px;color:#8f8a87;line-height:1.7;border-top:3px solid #F0E6D8;padding-top:16px;">
          若此次取消非您本人操作，或有任何疑問，請聯繫客服協助處理。
        </div>
      `, '#E0526C'),
    },
    'cancel-teacher': {
      subject: '【JPTIP】課程預約已取消',
      from: 'JPTIP 預約系統 <one-on-one@jptip.co.jp>',
      to: 'teacher1@example.com',
      html: emailShell('assets/icons/close.png', `
        <div style="font-size:15px;color:#454545;margin-bottom:8px;">田中 老師，您好：</div>
        <div style="font-size:15px;color:#454545;line-height:1.8;margin-bottom:24px;">
          以下課程預約已被取消，這個時段將重新開放給其他學生預約：
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
          ${infoRow('學生', '李美芳')}
          ${infoRow('課程', 'N5 綜合日本語 J1')}
          ${infoRow('原時間', '2026 年 09 月 20 日 星期日 15:00（UTC+8 台北）')}
        </table>
        <div style="font-size:13px;color:#8f8a87;line-height:1.7;border-top:3px solid #F0E6D8;padding-top:16px;">
          您無需採取任何動作，這個時段已自動恢復為可預約狀態。
        </div>
      `, '#E0526C'),
    },
    'cancel-admin': {
      subject: '【JPTIP】預約取消通知（管理者）',
      from: 'JPTIP 系統通知 <one-on-one@jptip.co.jp>',
      to: 'admin@jptip.co.jp',
      html: emailShell('assets/icons/close.png', `
        <div style="font-size:15px;color:#454545;line-height:1.8;margin-bottom:24px;">
          系統偵測到一筆預約取消，摘要如下：
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:8px;">
          ${infoRow('學生', '李美芳（student3@jptip.co.jp）')}
          ${infoRow('老師', '田中老師（teacher1@example.com）')}
          ${infoRow('課程', 'N5 綜合日本語 J1')}
          ${infoRow('原時間', '2026 年 09 月 20 日 星期日 15:00（UTC+8）')}
          ${infoRow('預約編號', '#20260920-1500-13')}
          ${infoRow('取消時間', '2026 年 09 月 07 日 11:02（UTC+8）')}
        </table>
        <div style="font-size:13px;color:#8f8a87;line-height:1.7;border-top:3px solid #F0E6D8;padding-top:16px;">
          此信件僅供紀錄與通知，無需回覆。
        </div>
      `, '#E0526C'),
    },
  };

  function renderTemplate(key) {
    const t = TEMPLATES[key];
    document.getElementById('email-subject').textContent = t.subject;
    document.getElementById('email-from').textContent = t.from;
    document.getElementById('email-to').textContent = t.to;

    const frame = document.getElementById('email-frame');
    // 高度撐開成內容實際高度，不要在 iframe 裡面出現自己的捲軸——srcdoc 是同源，
    // 讀得到裡面的 document 高度。
    frame.addEventListener('load', () => {
      frame.style.height = `${frame.contentDocument.documentElement.scrollHeight}px`;
    }, { once: true });
    frame.srcdoc = t.html;

    document.querySelectorAll('.email-tab').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.template === key);
    });
  }

  document.querySelectorAll('.email-tab').forEach((btn) => {
    btn.addEventListener('click', () => renderTemplate(btn.dataset.template));
  });

  renderTemplate('otp');
</script>

</body>
</html>
