<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 休假申請</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.teacher-page .page {
    max-width: 860px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  .section-narrow {
    max-width: 800px;
  }

  /* 已經有學生預約的日子用淡黃色底標出來（這天不能請假，要先請管理者處理那幾堂課）；
     選取中的日子還是藍色，今天以前的日子本來就不能選，不標 */
  .datepicker-grid button.has-booking:not(.selected):not(.disabled) {
    background: color-mix(in srgb, var(--color-butter) 55%, #fff);
  }

  .leave-datepicker-row {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
  }

  .date-popover {
    position: relative;
  }
  .date-popover-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    min-width: 300px;
    font-family: var(--font-cn);
    font-size: var(--fs-body);
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    color: var(--text-main);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .date-popover-trigger:hover {
    border-color: var(--color-blue);
  }
  .date-popover.open .date-popover-trigger {
    border-color: var(--color-blue);
    box-shadow: 0 0 0 4px rgba(111, 200, 232, .14);
  }
  .date-popover-trigger i {
    color: var(--text-muted);
  }
  .date-popover-panel {
    position: absolute;
    top: calc(100% + var(--space-2));
    left: 0;
    z-index: 20;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .date-popover.open .date-popover-panel {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  .leave-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    min-height: 80px;
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .leave-card:hover {
    border-color: var(--color-blue);
  }
  .leave-card-empty { min-height: 80px; }
  .leave-card-date {
    font-weight: 700;
    font-size: 1.0625rem;
    font-variant-numeric: tabular-nums;
  }

  #leave-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
  }

  @media (max-width: 1048px) {
    body.teacher-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.teacher-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    .leave-datepicker-row {
      flex-direction: column;
      align-items: stretch;
    }
    .date-popover {
      width: 100%;
    }
    .date-popover-trigger {
      min-width: 0;
      width: 100%;
    }
    #leave-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="teacher-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house"></i></button>
</div>

<div class="page">

  <section class="section section-narrow">
    <div class="section-title"><img class="title-icon" src="../assets/icons/summer-holidays.png" alt=""><h2 data-i18n="leave.addTitle">新增休假</h2></div>
    <div class="leave-datepicker-row">
      <div class="date-popover" id="leave-date-popover">
        <button type="button" class="date-popover-trigger" id="leave-date-trigger">
          <span id="leave-date-label" data-i18n="leave.selectDatePlaceholder">請選擇日期</span>
          <i class="fa-solid fa-fw fa-calendar-days"></i>
        </button>
        <div class="date-popover-panel">
          <div class="datepicker" data-datepicker>
            <div class="datepicker-header">
              <button type="button" data-prev><i class="fa-solid fa-fw fa-chevron-left"></i></button>
              <span data-month-label>2026 年 08 月</span>
              <button type="button" data-next><i class="fa-solid fa-fw fa-chevron-right"></i></button>
            </div>
            <div class="datepicker-weekdays">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="datepicker-grid-wrap"><div class="datepicker-grid" data-grid></div></div>
          </div>
        </div>
      </div>
      <button type="button" class="btn butter" id="leave-add-btn" disabled><i class="fa-solid fa-fw fa-plus"></i> <span data-i18n="leave.addTitle">新增休假</span></button>
    </div>
  </section>

  <section class="section">
    <div class="section-title">
      <img class="title-icon" src="../assets/icons/invoice.png" alt="">
      <h2 data-i18n="leave.recordsTitle">休假紀錄</h2>
      <button type="button" class="info-btn" id="leave-record-info-btn" data-i18n-aria-label="common.info" aria-label="說明"><i class="fa-solid fa-fw fa-circle-question"></i></button>
    </div>
    <div class="booking-cards" id="leave-cards"></div>
  </section>

  <div class="page-nav">
    <div class="pagination" id="leave-pagination"></div>
  </div>

</div>

<div class="modal-overlay" id="leaveInfoModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-calendar-days"></i></div>
    <h3 id="leaveInfoModalTitle" data-i18n="leave.selectDateFirst">請先選擇日期</h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveRecordInfoModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-clock-rotate-left"></i></div>
    <h3 data-i18n="leave.recordInfo.title">休假紀錄只顯示 60 天內</h3>
    <p class="text-small" data-i18n="leave.recordInfo.desc">從今天往回算 60 天，超過的休假紀錄就不會再顯示囉。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveAddConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-umbrella-beach"></i></div>
    <h3 data-i18n="leave.addConfirm.title">確定要新增這天休假嗎？</h3>
    <p class="text-small" id="leaveAddConfirmDate"></p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn green" id="leave-add-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="leave.addConfirm.confirm">確定</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveHasBookingsModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="leaveHasBookingsTitle"></h3>
    <p class="text-small" id="leaveHasBookingsDesc"></p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveDeleteConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-trash"></i></div>
    <h3 data-i18n="leave.deleteConfirm.title">確定要刪除這天休假嗎？</h3>
    <p class="text-small" id="leaveDeleteConfirmDate"></p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="leave-delete-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-trash"></i> <span data-i18n="hours.delete">刪除</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3 data-i18n="booking.leaveConfirm.title">確定要離開嗎？</h3>
    <p class="text-small" data-i18n="leave.leaveConfirm.desc">選擇的日期尚未新增，離開後將不會保留。</p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="confirm-leave-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="booking.leaveConfirm.confirm">確定離開</span></button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 資料庫對應：teacher_leave(teacher_id, date)，經 /api/teachers/leave 讀寫

  // 同一份頁面有兩個網址，靠網址區分是誰在看（後端也依網址分開擋權限）：
  //   /admin/teacher-leave?id=…  管理者代管某位老師，只有管理者進得來
  //   /teacher/leave             老師本人，只有老師進得來；一律以登入身分反查自己的資料
  const viewingAsAdmin = window.location.pathname.startsWith('/admin/');
  const teacherIdParam = viewingAsAdmin ? new URLSearchParams(window.location.search).get('id') : null;
  const currentTeacherRecord = await loadCurrentTeacher(viewingAsAdmin, teacherIdParam);
  const currentTeacherId = viewingAsAdmin ? Number(teacherIdParam) : (currentTeacherRecord ? currentTeacherRecord.id : undefined);

  // 這頁沒有語言切換鈕：管理者套用管理者自己的語言（跟其他管理端頁面一致），老師本人套用老師帳號的語言。
  const adminMe = viewingAsAdmin ? await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null) : null;
  await initI18n(viewingAsAdmin
    ? ((adminMe && adminMe.language) || getCurrentLang())
    : ((currentTeacherRecord && currentTeacherRecord.language) || getCurrentLang()));

  function showInfoModal(title) {
    document.getElementById('leaveInfoModalTitle').textContent = title;
    document.getElementById('leaveInfoModal').classList.add('open');
  }

  let leaveDays = [];
  try {
    const res = await fetch(`/api/teachers/leave?teacherId=${currentTeacherId}`);
    if (!res.ok) throw new Error('load failed');
    leaveDays = await res.json();
  } catch {
    showInfoModal(t('leave.error.loadFailed'));
  }

  const leavePageState = { page: 1 };

  // 休假紀錄只保留 60 天內的（從今天往回算），太久以前的不再顯示
  const RECORD_WINDOW_DAYS = 60;
  const leaveCutoffDate = new Date();
  leaveCutoffDate.setHours(0, 0, 0, 0);
  leaveCutoffDate.setDate(leaveCutoffDate.getDate() - RECORD_WINDOW_DAYS);

  function formatLeaveDate(dateISO) {
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    return isMobile ? formatDateShort(dateISO) : formatDateLong(dateISO);
  }

  function isPastDate(dateISO) {
    const d = new Date(dateISO);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return d < today;
  }

  function renderLeaveTable() {
    const cardsEl = document.getElementById('leave-cards');
    const sortedLeaveDays = leaveDays
      .filter((l) => new Date(l.date) >= leaveCutoffDate)
      .sort((a, b) => b.date.localeCompare(a.date));
    paginate(sortedLeaveDays, 10, (l) => `<div class="leave-card">
        <span class="leave-card-date">${formatLeaveDate(l.date)}</span>
        ${isPastDate(l.date) ? '' : `<button type="button" class="btn sm red" data-id="${l.id}"><i class="fa-solid fa-fw fa-trash"></i> ${t('hours.delete')}</button>`}
      </div>`, cardsEl, document.getElementById('leave-pagination'), leavePageState,
      `<div class="leave-card-empty">${t('leave.noRecords')}</div>`,
      (el) => {
        el.querySelectorAll('.leave-card, .leave-card-empty').forEach((card) => applyTiltEffect(card));
        el.querySelectorAll('button[data-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            pendingDeleteId = Number(btn.dataset.id);
            const lesson = leaveDays.find((l) => l.id === pendingDeleteId);
            document.getElementById('leaveDeleteConfirmDate').textContent = lesson ? formatLeaveDate(lesson.date) : '';
            document.getElementById('leaveDeleteConfirmModal').classList.add('open');
          });
        });
      });
  }

  renderLeaveTable();

  function getSelectedDateISO() {
    // 月曆標題文字現在是依語言在地化的，不能再靠 regex 反推年月——直接讀
    // script.js 的 datepicker 寫在元素上的 data-year / data-month 就好。
    const picker = document.querySelector('[data-datepicker]');
    const selectedDay = document.querySelector('.datepicker-grid button.selected');
    if (!picker || picker.dataset.year === undefined || !selectedDay) return null;
    const year = picker.dataset.year;
    const month = String(Number(picker.dataset.month) + 1).padStart(2, '0');
    const day = selectedDay.textContent.trim().padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function resetDateLabel() {
    document.getElementById('leave-date-label').textContent = t('leave.selectDatePlaceholder');
  }

  let pendingAddDate = null;
  let pendingDeleteId = null;

  // 選了日期「新增休假」才能按（從停用變成可按時跳一下）
  function refreshLeaveAddBtn() {
    setButtonEnabled(document.getElementById('leave-add-btn'), !!getSelectedDateISO());
  }

  // 這天已經有學生預約（還沒上、也沒取消的課）就不能請假：老師要先聯絡管理者處理那幾堂課，
  // 管理者代為新增時則是先到預約紀錄處理，這天沒有預約之後才能新增休假（後端也會擋）
  function showHasBookingsModal(count) {
    document.getElementById('leaveHasBookingsTitle').textContent = t('leave.hasBookings.title', { count });
    document.getElementById('leaveHasBookingsDesc').textContent = t(viewingAsAdmin ? 'leave.hasBookings.adminDesc' : 'leave.hasBookings.desc');
    document.getElementById('leaveHasBookingsModal').classList.add('open');
  }
  async function countBookingsOn(dateISO) {
    const bookings = await fetch(`/api/bookings?teacherId=${currentTeacherId}&date=${dateISO}`).then((res) => (res.ok ? res.json() : [])).catch(() => []);
    return bookings.filter((b) => b.date === dateISO && (b.status === 'upcoming' || b.status === 'pending')).length;
  }

  document.getElementById('leave-add-btn').addEventListener('click', async () => {
    const dateISO = getSelectedDateISO();
    if (!dateISO) {
      showInfoModal(t('leave.selectDateFirst'));
      return;
    }
    if (leaveDays.some((l) => l.date === dateISO)) {
      showInfoModal(t('leave.error.alreadyExists'));
      return;
    }
    const bookedCount = await countBookingsOn(dateISO);
    if (bookedCount > 0) {
      showHasBookingsModal(bookedCount);
      return;
    }
    pendingAddDate = dateISO;
    document.getElementById('leaveAddConfirmDate').textContent = formatLeaveDate(dateISO);
    document.getElementById('leaveAddConfirmModal').classList.add('open');
  });

  document.getElementById('leave-add-confirm-btn').addEventListener('click', async () => {
    if (!pendingAddDate) return;
    const dateToAdd = pendingAddDate;
    pendingAddDate = null;
    document.getElementById('leaveAddConfirmModal').classList.remove('open');

    const res = await fetch(`/api/teachers/leave?teacherId=${currentTeacherId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateToAdd }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      if (data.code === 'leaveHasBookings') {
        showHasBookingsModal(data.params.count);
      } else {
        showInfoModal(apiErrorMessage(data, 'hours.error.addFailed'));
      }
      return;
    }
    const created = await res.json();
    leaveDays.push(created);
    document.querySelectorAll('.datepicker-grid button.selected').forEach((b) => b.classList.remove('selected'));
    resetDateLabel();
    refreshLeaveAddBtn();
    renderLeaveTable();
  });

  document.getElementById('leave-delete-confirm-btn').addEventListener('click', async () => {
    if (pendingDeleteId === null) return;
    const idToDelete = pendingDeleteId;
    pendingDeleteId = null;
    document.getElementById('leaveDeleteConfirmModal').classList.remove('open');

    const res = await fetch(`/api/teachers/leave?teacherId=${currentTeacherId}&id=${idToDelete}`, { method: 'DELETE' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showInfoModal(apiErrorMessage(data, 'hours.error.deleteFailed'));
      return;
    }
    leaveDays = leaveDays.filter((l) => l.id !== idToDelete);
    renderLeaveTable();
  });

  // ==========================================================================
  // 日期選擇彈出框
  // ==========================================================================
  const datePopover = document.getElementById('leave-date-popover');
  const dateTrigger = document.getElementById('leave-date-trigger');
  const dateLabel = document.getElementById('leave-date-label');

  dateTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    datePopover.classList.toggle('open');
  });

  // 休假只能請今天（含）以後的日期：日曆每次畫好（含切換月份）都把今天以前的日子標成停用，
  // 比照預約精靈 refreshDayDisabledStates() 的做法（.disabled 會讓按鈕點不到、變淡）。
  function disablePastDays() {
    const picker = document.querySelector('[data-datepicker]');
    if (!picker || picker.dataset.year === undefined) return;
    const today0 = new Date(); today0.setHours(0, 0, 0, 0);
    document.querySelectorAll('.datepicker-grid button:not(.muted)').forEach((btn) => {
      const d = new Date(Number(picker.dataset.year), Number(picker.dataset.month), Number(btn.textContent));
      btn.classList.toggle('disabled', d < today0);
    });
  }
  document.querySelector('[data-datepicker]').addEventListener('datepicker:rendered', disablePastDays);
  disablePastDays();

  // 這位老師還沒上、也沒取消的預約落在哪幾天（日曆每次畫好、含切換月份，都重新標一次）
  let bookedDates = new Set();
  function markBookedDays() {
    const picker = document.querySelector('[data-datepicker]');
    if (!picker || picker.dataset.year === undefined) return;
    const ym = `${picker.dataset.year}-${String(Number(picker.dataset.month) + 1).padStart(2, '0')}`;
    document.querySelectorAll('.datepicker-grid button:not(.muted)').forEach((btn) => {
      btn.classList.toggle('has-booking', bookedDates.has(`${ym}-${btn.textContent.padStart(2, '0')}`));
    });
  }
  document.querySelector('[data-datepicker]').addEventListener('datepicker:rendered', markBookedDays);
  fetch(`/api/bookings?teacherId=${currentTeacherId}`).then((res) => (res.ok ? res.json() : [])).then((bookings) => {
    bookedDates = new Set(bookings.filter((b) => b.status === 'upcoming' || b.status === 'pending').map((b) => b.date));
    markBookedDays();
  }).catch(() => {});

  document.querySelector('[data-datepicker]').addEventListener('datepicker:change', () => {
    const dateISO = getSelectedDateISO();
    if (dateISO) dateLabel.textContent = formatLeaveDate(dateISO);
    datePopover.classList.remove('open');
    refreshLeaveAddBtn();
  });

  document.addEventListener('click', (e) => {
    if (!datePopover.contains(e.target)) {
      datePopover.classList.remove('open');
    }
  });

  if (viewingAsAdmin) {
    document.getElementById('back-btn').innerHTML = '<i class="fa-solid fa-fw fa-arrow-left"></i>';
  }

  function goBack() {
    window.location.href = viewingAsAdmin ? `teacher-detail.html?id=${teacherIdParam}` : 'index.html';
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    if (getSelectedDateISO()) {
      document.getElementById('leaveConfirmModal').classList.add('open');
      return;
    }
    goBack();
  });

  document.getElementById('confirm-leave-btn').addEventListener('click', goBack);

  document.getElementById('leave-record-info-btn').addEventListener('click', () => {
    document.getElementById('leaveRecordInfoModal').classList.add('open');
  });
})();
</script>

</body>
</html>
