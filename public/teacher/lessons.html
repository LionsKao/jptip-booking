<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 我的課程</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.teacher-page .page {
    max-width: 1048px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  .back-header {
    position: absolute;
    top: var(--space-6);
    left: var(--space-6);
    z-index: 10;
  }

  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  .wizard-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    margin-top: var(--space-6);
  }
  .wizard-nav[hidden] {
    display: none;
  }
  .wizard-nav .btn { min-width: 160px; }

  #lessons-cards,
  #today-cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .confirm-highlight:hover {
    border-color: var(--color-blue);
  }

  .info-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--text-muted);
    opacity: .45;
    font-size: 18px;
    cursor: pointer;
    transition: color .2s ease, opacity .2s ease;
  }
  .info-btn:hover {
    color: var(--color-blue);
    opacity: 1;
  }

  #lesson-detail-view .section {
    position: relative;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  .booking-card.is-clickable {
    cursor: pointer;
  }
  .booking-card:hover {
    border-color: var(--color-blue);
  }

  .booking-card-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 122px;
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    font-weight: 700;
    font-size: 1.0625rem;
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .booking-card-empty:hover {
    border-color: var(--color-blue);
  }

  .modal-icon {
    width: 76px; height: 76px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    margin: 0 auto var(--space-4);
  }
  .modal-icon.success { background: rgba(180, 225, 151, .3); color: #558035; }
  .modal-icon.info    { background: rgba(111, 200, 232, .18); color: var(--color-blue); }

  @media (max-width: 640px) {
    .wizard-nav {
      width: 100%;
      flex-wrap: wrap;
    }
    .wizard-nav .btn { min-width: 0; flex: 1 1 0; }
  }

  @media (max-width: 1048px) {
    body.teacher-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    .back-header {
      top: var(--space-3);
      left: var(--space-3);
    }
    body.teacher-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #lessons-cards,
    #today-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="teacher-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house" id="back-btn-icon"></i></button>
</div>

<div class="page">

  <div id="lessons-list-view">

    <section class="section" id="today-group">
      <div class="section-title"><img class="title-icon" src="../assets/icons/flag.png" alt=""><h2>今天的課程</h2></div>
      <div class="booking-cards" id="today-cards"></div>
    </section>

    <section class="section">
      <div class="section-title"><img class="title-icon" src="../assets/icons/coming-soon.png" alt=""><h2>我的課程</h2><button type="button" class="info-btn" data-modal-open="lessonsRecordInfoModal" aria-label="說明"><i class="fa-solid fa-fw fa-circle-question"></i></button></div>
      <div class="booking-cards" id="lessons-cards"></div>
    </section>

    <div class="page-nav">
      <div class="pagination" id="lessons-pagination"></div>
    </div>

  </div>

  <div id="lesson-detail-view" hidden>
    <section class="section">
      <span class="ribbon-clip" id="detail-status-ribbon" hidden><span class="course-ribbon" id="detail-status-ribbon-text"></span></span>
      <div class="section-title"><img class="title-icon" src="../assets/icons/clipboard.png" alt=""><h2>課程詳情</h2></div>
      <div class="confirm-summary">
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/books.png" alt=""></span>
          <span><p>課程</p><h3 id="detail-course">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/student.png" alt=""></span>
          <span><p>學生</p><h3 id="detail-student">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/icon-calendar.png" alt=""></span>
          <span><p>日期</p><h3 id="detail-datetime">—</h3></span>
        </div>
      </div>
    </section>
    <div class="wizard-nav">
      <button type="button" class="btn blue" id="open-meeting-btn">開啟會議室</button>
      <button type="button" class="btn green" id="complete-lesson-btn">完成課程</button>
    </div>
  </div>

</div>

<div class="modal-overlay" id="notEndedModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-clock"></i></div>
    <h3>這堂課程還沒有結束</h3>
    <p class="text-small">請等課程時間結束後再標記為完成。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> 知道了</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="completeConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-check"></i></div>
    <h3>確定要完成課程嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> 取消</button>
      <button class="btn green" id="confirm-complete-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> 確定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="lessonsRecordInfoModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-clock-rotate-left"></i></div>
    <h3>課程只顯示 60 天內</h3>
    <p class="text-small">從今天往回算 60 天，超過的課程紀錄就不會再顯示囉。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> 知道了</button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
  // 未來資料庫對應（此階段僅前端 mock，尚未實作）：lessons(course, date, time, student_name, status)

  const lessons = [
    { id: 1, course: 'N5 綜合日本語 J2', date: '2026/09/03', time: '20:00', student: '李美芳', status: 'upcoming' },
    { id: 2, course: 'N5 綜合日本語 J2', date: '2026/09/02', time: '11:00', student: '王大明', status: 'upcoming' },
    { id: 3, course: 'N5 綜合日本語 J2', date: '2026/08/29', time: '16:00', student: '陳靜怡', status: 'cancelled' },
    { id: 4, course: 'N5 綜合日本語 J2', date: '2026/08/26', time: '11:00', student: '李美芳', status: 'attended' },
    { id: 5, course: 'N5 綜合日本語 J2', date: '2026/08/20', time: '20:00', student: '張凱文', status: 'attended' },
    { id: 6, course: '商用日文會話',     date: '2026/08/15', time: '16:00', student: '王大明', status: 'attended' },
    { id: 7, course: 'N5 綜合日本語 J2', date: '2026/08/10', time: '20:00', student: '陳靜怡', status: 'attended' },
  ];
  const LESSON_DURATION_MINUTES = 100;
  const STATUS_MAP = {
    upcoming:  { cls: 'pill info has-icon',      icon: 'icon-hourglass.png', label: '預約' },
    attended:  { cls: 'pill confirmed has-icon', icon: 'check.png',          label: '完成' },
    cancelled: { cls: 'pill cancelled has-icon', icon: 'close.png',          label: '取消' },
  };
  const RIBBON_TONE_MAP = {
    upcoming:  { tone: 'tone-blue',  label: '預約' },
    attended:  { tone: 'tone-green', label: '完成' },
    cancelled: { tone: 'tone-red',   label: '取消' },
  };

  // 只保留 60 天內的紀錄，上課日期超過 60 天的舊紀錄不再顯示
  const RECORD_WINDOW_DAYS = 60;
  const cutoffDate = new Date();
  cutoffDate.setHours(0, 0, 0, 0);
  cutoffDate.setDate(cutoffDate.getDate() - RECORD_WINDOW_DAYS);
  const visibleLessons = lessons.filter((l) => new Date(l.date.replace(/\//g, '-')) >= cutoffDate);

  function paginate(items, pageSize, renderItemFn, containerEl, paginationEl, pageState, emptyHtml, onRender) {
    const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
    pageState.page = Math.min(pageState.page, totalPages);
    const start = (pageState.page - 1) * pageSize;
    const pageItems = items.slice(start, start + pageSize);

    containerEl.innerHTML = pageItems.map(renderItemFn).join('') || emptyHtml;
    if (onRender) onRender(containerEl);

    paginationEl.innerHTML = '';

    const prevBtn = document.createElement('button');
    prevBtn.type = 'button';
    prevBtn.setAttribute('aria-label', '上一頁');
    prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
    prevBtn.disabled = pageState.page === 1;
    prevBtn.addEventListener('click', () => {
      pageState.page--;
      paginate(items, pageSize, renderItemFn, containerEl, paginationEl, pageState, emptyHtml, onRender);
    });
    paginationEl.appendChild(prevBtn);

    for (let p = 1; p <= totalPages; p++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = p;
      if (p === pageState.page) btn.classList.add('active');
      btn.addEventListener('click', () => {
        pageState.page = p;
        paginate(items, pageSize, renderItemFn, containerEl, paginationEl, pageState, emptyHtml, onRender);
      });
      paginationEl.appendChild(btn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.setAttribute('aria-label', '下一頁');
    nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
    nextBtn.disabled = pageState.page === totalPages;
    nextBtn.addEventListener('click', () => {
      pageState.page++;
      paginate(items, pageSize, renderItemFn, containerEl, paginationEl, pageState, emptyHtml, onRender);
    });
    paginationEl.appendChild(nextBtn);
  }

  function applyTiltEffect(card, intensity = 6) {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      const rotateX = (-y * intensity).toFixed(2);
      const rotateY = (x * intensity).toFixed(2);
      card.style.transform = `perspective(700px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      card.style.boxShadow = `${-x * 20}px ${20 - y * 10}px 30px rgba(45,74,107,0.18)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(700px) rotateX(0deg) rotateY(0deg)';
      card.style.boxShadow = '';
    });
  }
  document.querySelectorAll('#lesson-detail-view .confirm-highlight').forEach((card) => applyTiltEffect(card));

  const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
  function formatDateTime(dateStr, timeStr) {
    const d = new Date(dateStr.replace(/\//g, '-'));
    const weekday = WEEKDAY_NAMES[d.getDay()];
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    if (isMobile) return `${dateStr} ${weekday} ${timeStr}`;
    const [y, m, day] = dateStr.split('/');
    return `${y} 年 ${m} 月 ${day} 日 星期${weekday} ${timeStr}`;
  }

  const sortedLessonsAsc = [...visibleLessons].sort((a, b) =>
    `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)
  );
  const sortedLessonsDesc = [...visibleLessons].sort((a, b) =>
    `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)
  );

  const lessonsPageState = { page: 1 };

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  }

  function renderLessonCard(l) {
    const s = STATUS_MAP[l.status];
    return `<div class="booking-card is-clickable" data-id="${l.id}">
      <span class="${s.cls} booking-card-status"><img class="pill-icon" src="../assets/icons/${s.icon}" alt="">${s.label}</span>
      <div class="booking-card-info">
        <p class="booking-card-course">${l.course}</p>
        <h4>${l.student}</h4>
        <p class="booking-card-datetime">${formatDateTime(l.date, l.time)}</p>
      </div>
    </div>`;
  }

  function bindCardClicks(containerEl) {
    containerEl.querySelectorAll('.booking-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => showLessonDetail(Number(card.dataset.id)));
    });
  }

  function renderTodayGroup() {
    const today = todayStr();
    const todayLessons = sortedLessonsAsc.filter((l) => l.date === today && l.status !== 'cancelled');
    const cardsEl = document.getElementById('today-cards');
    cardsEl.innerHTML = todayLessons.length
      ? todayLessons.map(renderLessonCard).join('')
      : '<div class="booking-card-empty">今天沒有課程</div>';
    bindCardClicks(cardsEl);
    cardsEl.querySelectorAll('.booking-card-empty').forEach((card) => applyTiltEffect(card));
  }

  function renderLessonsCards() {
    const cardsEl = document.getElementById('lessons-cards');
    paginate(sortedLessonsDesc, 10, renderLessonCard,
      cardsEl, document.getElementById('lessons-pagination'), lessonsPageState,
      `<p style="text-align:center;color:var(--text-muted);">尚無課程</p>`,
      bindCardClicks);
  }

  renderTodayGroup();
  renderLessonsCards();

  document.getElementById('back-btn').addEventListener('click', () => {
    if (!document.getElementById('lesson-detail-view').hidden) {
      hideLessonDetail();
      return;
    }
    window.location.href = 'index.html';
  });

  // ==========================================================================
  // 課程詳情：查看 / 完成課程
  // ==========================================================================
  let activeLessonId = null;

  function showLessonDetail(id) {
    const lesson = lessons.find((l) => l.id === id);
    if (!lesson) return;
    activeLessonId = id;
    document.getElementById('detail-course').textContent = lesson.course;
    document.getElementById('detail-student').textContent = lesson.student;
    document.getElementById('detail-datetime').textContent = formatDateTime(lesson.date, lesson.time);
    document.getElementById('lessons-list-view').hidden = true;
    document.getElementById('lesson-detail-view').hidden = false;
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-arrow-left';

    const ribbon = RIBBON_TONE_MAP[lesson.status];
    document.getElementById('detail-status-ribbon').hidden = !ribbon;
    if (ribbon) {
      const ribbonText = document.getElementById('detail-status-ribbon-text');
      ribbonText.textContent = ribbon.label;
      ribbonText.className = `course-ribbon ${ribbon.tone}`;
    }
    document.querySelector('#lesson-detail-view .wizard-nav').hidden = lesson.status !== 'upcoming';

    window.scrollTo(0, 0);
  }

  function hideLessonDetail() {
    activeLessonId = null;
    document.getElementById('lesson-detail-view').hidden = true;
    document.getElementById('lessons-list-view').hidden = false;
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-house';
  }

  function lessonEndTime(lesson) {
    const start = new Date(`${lesson.date.replace(/\//g, '-')}T${lesson.time}:00`);
    return new Date(start.getTime() + LESSON_DURATION_MINUTES * 60 * 1000);
  }

  // TODO: 之後老師設定專屬會議室連結後，改成開啟該連結
  document.getElementById('open-meeting-btn').addEventListener('click', () => {
    window.open('https://www.google.com', '_blank');
  });

  document.getElementById('complete-lesson-btn').addEventListener('click', () => {
    const lesson = lessons.find((l) => l.id === activeLessonId);
    if (!lesson) return;
    if (new Date() < lessonEndTime(lesson)) {
      document.getElementById('notEndedModal').classList.add('open');
      return;
    }
    document.getElementById('completeConfirmModal').classList.add('open');
  });

  document.getElementById('confirm-complete-btn').addEventListener('click', () => {
    const lesson = lessons.find((l) => l.id === activeLessonId);
    if (lesson) lesson.status = 'attended';
    document.getElementById('completeConfirmModal').classList.remove('open');
    hideLessonDetail();
    renderTodayGroup();
    renderLessonsCards();
  });
</script>

</body>
</html>
