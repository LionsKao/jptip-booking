<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 我的課程</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.teacher-page .page {
    max-width: 1048px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  .wizard-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    margin-top: var(--space-6);
  }
  .wizard-nav .btn { min-width: 160px; }

  #lessons-cards,
  #today-cards {
    grid-template-columns: repeat(2, 1fr);
  }
  .booking-card-info {
    gap: 3px;
  }
  .booking-card-code {
    margin: 0;
    color: var(--text-muted);
    font-size: 1.125rem;
    font-variant-numeric: tabular-nums;
  }
  .booking-card-info h4,
  .booking-card-info .booking-card-course {
    margin: 0;
    line-height: 1.6;
  }
  .booking-card-info .booking-card-datetime {
    margin: 0;
    font-size: 1.125rem;
  }

  #today-group,
  #lessons-group {
    max-width: 1000px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  .booking-card.is-clickable {
    cursor: pointer;
  }
  .booking-card:hover {
    border-color: var(--color-blue);
  }

  .booking-card-empty { min-height: 160px; }

  @media (max-width: 640px) {
    .wizard-nav {
      width: 100%;
      flex-wrap: wrap;
    }
    .wizard-nav .btn { min-width: 0; flex: 1 1 0; }
  }

  @media (max-width: 1048px) {
    body.teacher-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.teacher-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #lessons-cards,
    #today-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="teacher-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house" id="back-btn-icon"></i></button>
</div>

<div class="page">

  <div id="lessons-list-view">

    <section class="section" id="today-group">
      <div class="section-title"><img class="title-icon" src="../assets/icons/flag.png" alt=""><h2 data-i18n="history.today">今天的課程</h2></div>
      <div class="booking-cards" id="today-cards"></div>
    </section>

    <section class="section" id="lessons-group">
      <div class="section-title"><img class="title-icon" src="../assets/icons/coming-soon.png" alt=""><h2 data-i18n="history.myCourses">我的課程</h2><button type="button" class="info-btn" data-modal-open="lessonsRecordInfoModal" data-i18n-aria-label="common.info" aria-label="說明"><i class="fa-solid fa-fw fa-circle-question"></i></button><button type="button" class="info-btn" data-modal-open="lessonsTimezoneModal" data-i18n-aria-label="history.tzInfo" aria-label="時區說明"><i class="fa-solid fa-fw fa-globe"></i></button></div>
      <div class="booking-cards" id="lessons-cards"></div>
    </section>

    <div class="page-nav">
      <div class="pagination" id="lessons-pagination"></div>
    </div>

  </div>

  <div id="lesson-detail-view" hidden>
    <section class="section">
      <span class="ribbon-clip" id="detail-status-ribbon" hidden><span class="course-ribbon" id="detail-status-ribbon-text"></span></span>
      <div class="section-title"><img class="title-icon" src="../assets/icons/clipboard.png" alt=""><h2 data-i18n="history.detail.title">課程詳情</h2></div>
      <div class="confirm-summary">
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/invoice.png" alt=""></span>
          <span><p data-i18n="history.detail.code">預約編號</p><h3 id="detail-booking-code">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/books.png" alt=""></span>
          <span><p data-i18n="booking.confirm.course">課程</p><h3 id="detail-course">—</h3></span>
        </div>
        <div class="confirm-highlight-row">
          <div class="confirm-highlight">
            <span class="confirm-highlight-icon"><img src="../assets/icons/student.png" alt=""></span>
            <span><p data-i18n="history.detail.student">學生</p><h3 id="detail-student">—</h3></span>
          </div>
          <div class="confirm-highlight">
            <span class="confirm-highlight-icon"><img src="../assets/icons/woman.png" alt=""></span>
            <span><p data-i18n="booking.confirm.teacher">老師</p><h3 id="detail-teacher">—</h3></span>
          </div>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/icon-calendar.png" alt=""></span>
          <span><p data-i18n="booking.confirm.date">日期</p><h3 id="detail-datetime">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/clock.png" alt=""></span>
          <span><p data-i18n="history.detail.time">時間</p><h3 id="detail-time">—</h3></span>
        </div>
      </div>
    </section>
    <div class="wizard-nav">
      <button type="button" class="btn blue" id="open-meeting-btn" data-i18n="lessons.openMeeting">開啟會議室</button>
      <button type="button" class="btn green" id="complete-lesson-btn" data-i18n="lessons.completeLesson">完成課程</button>
    </div>
  </div>

</div>

<div class="modal-overlay" id="notEndedModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-clock"></i></div>
    <h3 data-i18n="lessons.notEnded.title">這堂課程還沒有結束</h3>
    <p class="text-small" data-i18n="lessons.notEnded.desc">請等課程時間結束後再標記為完成。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="completeConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-check"></i></div>
    <h3 data-i18n="lessons.completeConfirm.title">確定要完成課程嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn green" id="confirm-complete-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="leave.addConfirm.confirm">確定</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="lessonsAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="lessonsAlertText"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="lessonsRecordInfoModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-clock-rotate-left"></i></div>
    <h3 data-i18n="lessons.recordInfo.title">課程只顯示 60 天內</h3>
    <p class="text-small" data-i18n="lessons.recordInfo.desc">從今天往回算 60 天，超過的課程紀錄就不會再顯示囉。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="lessonsTimezoneModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon timezone"><i class="fa-solid fa-globe"></i></div>
    <h3 data-i18n="history.tzModal.title">課程時間顯示時區</h3>
    <p class="text-small" id="lessons-timezone-note"></p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 資料庫對應：bookings(booking_code, student_id, course_id, teacher_id, date, time, status)，經 /api/bookings 讀寫
  // 課程時間統一存成 UTC+8（台灣時間）為基準；顯示給老師看時，依老師基本資料設定的時區（+8／+9）換算顯示
  // 這個頁面本身已經由後端依 session cookie 擋過（只有本人老師或管理者能進來）。
  // teacherId query string 只信任管理者：老師本人一律以登入身分反查自己的資料，
  // 忽略網址上可能被竄改的 teacherId，避免老師改網址去看到別的老師的課程。
  const teacherIdParam = new URLSearchParams(window.location.search).get('teacherId');
  const session = await fetch('/api/session').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  const viewingAsAdmin = !!(session && session.role === 'admin' && teacherIdParam);
  const teachersCache = await fetch('/api/teachers').then((res) => (res.ok ? res.json() : []));
  function loadTeachers() { return teachersCache; }
  const selfTeacher = !viewingAsAdmin && session ? loadTeachers().find((t) => t.email === session.email) : null;
  const currentTeacherId = viewingAsAdmin ? Number(teacherIdParam) : (selfTeacher ? selfTeacher.id : undefined);
  const currentTeacher = loadTeachers().find((t) => t.id === currentTeacherId);

  // 這頁沒有語言切換鈕（已在老師主頁），純粹套用該老師帳號目前的語言。
  await initI18n((currentTeacher && currentTeacher.language) || getCurrentLang());

  const TEACHER_TIMEZONE_LABEL = (currentTeacher && currentTeacher.receipt && currentTeacher.receipt.timezone) || '(UTC+08:00) 台北';
  const TEACHER_TZ_OFFSET = parseUtcOffset(TEACHER_TIMEZONE_LABEL);
  const TEACHER_TZ_DELTA_HOURS = TEACHER_TZ_OFFSET - 8;
  document.getElementById('lessons-timezone-note').textContent = t('history.allTimesIn', { tz: TEACHER_TIMEZONE_LABEL });

  function shiftToTeacherTz(dateStr, timeStr) {
    if (!TEACHER_TZ_DELTA_HOURS) return { date: dateStr, time: timeStr };
    const dt = new Date(`${dateStr.replace(/\//g, '-')}T${timeStr}:00`);
    // setHours() 會把非整數小時直接截斷，緬甸 +6:30 這種半小時時區要改用分鐘計算。
    dt.setMinutes(dt.getMinutes() + TEACHER_TZ_DELTA_HOURS * 60);
    const y = dt.getFullYear(), m = String(dt.getMonth() + 1).padStart(2, '0'), day = String(dt.getDate()).padStart(2, '0');
    const hh = String(dt.getHours()).padStart(2, '0'), mm = String(dt.getMinutes()).padStart(2, '0');
    return { date: `${y}/${m}/${day}`, time: `${hh}:${mm}` };
  }

  function showLessonsAlert(message) {
    document.getElementById('lessonsAlertText').textContent = message;
    document.getElementById('lessonsAlertModal').classList.add('open');
  }

  function bookingToLesson(b) {
    return {
      id: b.id,
      course: b.course,
      courseId: b.courseId,
      date: b.date.replace(/-/g, '/'),
      time: b.time,
      student: b.studentName,
      status: b.status,
      bookingCode: b.bookingCode,
    };
  }

  let lessons = [];
  try {
    // 老師本人不用帶 teacherId，後端會依登入身分自動只回傳自己的預約；
    // 管理者代管老師時才需要明確帶 teacherId，查看該老師的預約。
    const bookingsQs = viewingAsAdmin ? `?teacherId=${currentTeacherId}` : '';
    const res = await fetch(`/api/bookings${bookingsQs}`);
    if (!res.ok) throw new Error('load failed');
    const rows = await res.json();
    lessons = rows.map(bookingToLesson);
  } catch {
    showLessonsAlert(t('history.loadFailed'));
  }
  const LESSON_DURATION_MINUTES = 100;
  const STATUS_MAP = {
    upcoming:  { cls: 'pill info has-icon',      icon: 'icon-hourglass.png', get label() { return t('status.upcoming'); } },
    attended:  { cls: 'pill confirmed has-icon', icon: 'check.png',          get label() { return t('status.attended'); } },
    cancelled: { cls: 'pill cancelled has-icon', icon: 'close.png',          get label() { return t('status.cancelled'); } },
    absent:    { cls: 'pill tone-navy has-icon', icon: 'question.png',       get label() { return t('status.absent'); } },
    pending:   { cls: 'pill pending has-icon',   icon: 'icon-alert.png',     get label() { return t('status.pending'); } },
  };
  const RIBBON_TONE_MAP = {
    upcoming:  { tone: 'tone-blue',   get label() { return t('status.upcoming'); } },
    attended:  { tone: 'tone-green',  get label() { return t('status.attended'); } },
    cancelled: { tone: 'tone-red',    get label() { return t('status.cancelled'); } },
    absent:    { tone: 'tone-navy',   get label() { return t('status.absent'); } },
    pending:   { tone: 'tone-orange', get label() { return t('status.pending'); } },
  };

  // 只保留 60 天內的紀錄，上課日期超過 60 天的舊紀錄不再顯示
  const RECORD_WINDOW_DAYS = 60;
  const cutoffDate = new Date();
  cutoffDate.setHours(0, 0, 0, 0);
  cutoffDate.setDate(cutoffDate.getDate() - RECORD_WINDOW_DAYS);
  const visibleLessons = lessons.filter((l) => new Date(l.date.replace(/\//g, '-')) >= cutoffDate);

  document.querySelectorAll('#lesson-detail-view .confirm-highlight').forEach((card) => applyTiltEffect(card));

  const coursesCache = await fetch('/api/courses').then((res) => (res.ok ? res.json() : []));
  function loadCourses() { return coursesCache; }

  function endTimeStr(timeStr, durationMinutes) {
    const [h, m] = timeStr.split(':').map(Number);
    const totalMinutes = h * 60 + m + durationMinutes;
    const endH = Math.floor(totalMinutes / 60) % 24;
    const endM = totalMinutes % 60;
    return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
  }

  function durationLabelStr(durationMinutes) {
    const h = Math.floor(durationMinutes / 60);
    const m = durationMinutes % 60;
    if (h && m) return t('common.durationBoth', { h, m });
    if (h) return t('common.durationHourOnly', { h });
    return t('common.durationMinuteOnly', { m });
  }

  function computeDisplayParts(l) {
    const shifted = shiftToTeacherTz(l.date, l.time);
    const course = loadCourses().find((c) => (l.courseId != null && c.id === l.courseId) || c.name === l.course);
    const durationMinutes = (course && course.durationMinutes) || LESSON_DURATION_MINUTES;
    const timeLabel = `${shifted.time} - ${endTimeStr(shifted.time, durationMinutes)}`;
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    const dateLabel = isMobile ? formatDateShort(shifted.date) : formatDateLong(shifted.date);
    const durationLabel = durationLabelStr(durationMinutes);
    return { dateLabel, timeLabel, startTimeLabel: shifted.time, durationLabel };
  }

  const sortedLessonsAsc = [...visibleLessons].sort((a, b) =>
    `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)
  );
  const sortedLessonsDesc = [...visibleLessons].sort((a, b) =>
    `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)
  );

  const lessonsPageState = { page: 1 };

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  }

  function renderLessonCard(l) {
    const s = STATUS_MAP[l.status];
    const parts = computeDisplayParts(l);
    return `<div class="booking-card is-clickable" data-id="${l.id}">
      <span class="${s.cls} booking-card-status"><img class="pill-icon" src="../assets/icons/${s.icon}" alt="">${s.label}</span>
      <div class="booking-card-info">
        ${l.bookingCode ? `<p class="booking-card-code">${l.bookingCode}</p>` : ''}
        <p class="booking-card-course">${l.course}</p>
        <h4>${l.student} ／ ${currentTeacher.name}</h4>
        <p class="booking-card-datetime">${parts.dateLabel} ${parts.startTimeLabel}</p>
      </div>
    </div>`;
  }

  function bindCardClicks(containerEl) {
    containerEl.querySelectorAll('.booking-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => showLessonDetail(Number(card.dataset.id)));
    });
    containerEl.querySelectorAll('.booking-card-empty').forEach((card) => applyTiltEffect(card));
  }

  function renderTodayGroup() {
    const today = todayStr();
    const todayLessons = sortedLessonsAsc.filter((l) => l.date === today && l.status !== 'cancelled');
    const cardsEl = document.getElementById('today-cards');
    cardsEl.innerHTML = todayLessons.length
      ? todayLessons.map(renderLessonCard).join('')
      : `<div class="booking-card-empty">${t('history.noToday')}</div>`;
    bindCardClicks(cardsEl);
    cardsEl.querySelectorAll('.booking-card-empty').forEach((card) => applyTiltEffect(card));
  }

  function renderLessonsCards() {
    const cardsEl = document.getElementById('lessons-cards');
    paginate(sortedLessonsDesc, 10, renderLessonCard,
      cardsEl, document.getElementById('lessons-pagination'), lessonsPageState,
      `<div class="booking-card-empty">${t('history.noRecords')}</div>`,
      bindCardClicks);
  }

  renderTodayGroup();
  renderLessonsCards();

  if (viewingAsAdmin) {
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-arrow-left';
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    if (!document.getElementById('lesson-detail-view').hidden) {
      hideLessonDetail();
      return;
    }
    window.location.href = viewingAsAdmin ? `../admin/teacher-detail.html?id=${teacherIdParam}` : 'index.html';
  });

  // ==========================================================================
  // 課程詳情：查看 / 完成課程
  // ==========================================================================
  let activeLessonId = null;

  function showLessonDetail(id) {
    const lesson = lessons.find((l) => l.id === id);
    if (!lesson) return;
    activeLessonId = id;
    document.getElementById('detail-course').textContent = lesson.course;
    document.getElementById('detail-student').textContent = lesson.student;
    document.getElementById('detail-teacher').textContent = currentTeacher.name;
    const parts = computeDisplayParts(lesson);
    document.getElementById('detail-datetime').textContent = parts.dateLabel;
    document.getElementById('detail-time').textContent = `${parts.timeLabel}・${parts.durationLabel}・UTC${formatUtcOffset(TEACHER_TZ_OFFSET)}`;
    document.getElementById('detail-booking-code').textContent = lesson.bookingCode || '—';
    document.getElementById('lessons-list-view').hidden = true;
    document.getElementById('lesson-detail-view').hidden = false;
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-arrow-left';

    const ribbon = RIBBON_TONE_MAP[lesson.status];
    document.getElementById('detail-status-ribbon').hidden = !ribbon;
    if (ribbon) {
      const ribbonText = document.getElementById('detail-status-ribbon-text');
      ribbonText.textContent = ribbon.label;
      ribbonText.className = `course-ribbon ${ribbon.tone}`;
    }
    document.querySelector('#lesson-detail-view .wizard-nav').hidden = lesson.status !== 'upcoming';

    window.scrollTo(0, 0);
  }

  function hideLessonDetail() {
    activeLessonId = null;
    document.getElementById('lesson-detail-view').hidden = true;
    document.getElementById('lessons-list-view').hidden = false;
    document.getElementById('back-btn-icon').className = viewingAsAdmin ? 'fa-solid fa-fw fa-arrow-left' : 'fa-solid fa-fw fa-house';
  }

  function lessonEndTime(lesson) {
    const start = new Date(`${lesson.date.replace(/\//g, '-')}T${lesson.time}:00`);
    return new Date(start.getTime() + LESSON_DURATION_MINUTES * 60 * 1000);
  }

  // TODO: 之後老師設定專屬會議室連結後，改成開啟該連結
  document.getElementById('open-meeting-btn').addEventListener('click', () => {
    window.open('https://www.google.com', '_blank');
  });

  document.getElementById('complete-lesson-btn').addEventListener('click', () => {
    const lesson = lessons.find((l) => l.id === activeLessonId);
    if (!lesson) return;
    if (new Date() < lessonEndTime(lesson)) {
      document.getElementById('notEndedModal').classList.add('open');
      return;
    }
    document.getElementById('completeConfirmModal').classList.add('open');
  });

  document.getElementById('confirm-complete-btn').addEventListener('click', async () => {
    const lesson = lessons.find((l) => l.id === activeLessonId);
    document.getElementById('completeConfirmModal').classList.remove('open');
    if (!lesson) return;

    const res = await fetch(`/api/bookings?id=${lesson.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'attended' }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showLessonsAlert(data.error || t('lessons.error.updateFailed'));
      return;
    }
    lesson.status = 'attended';
    hideLessonDetail();
    renderTodayGroup();
    renderLessonsCards();
  });
})();
</script>

</body>
</html>
