<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 新增課程</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 1000px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  .section {
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
  }

  .wizard-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    margin-top: var(--space-6);
  }
  .wizard-nav .btn { min-width: 160px; }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    .wizard-nav {
      width: 100%;
      flex-wrap: wrap;
    }
    .wizard-nav .btn { min-width: 0; flex: 1 1 0; }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-arrow-left"></i></button>
</div>

<div class="page">

  <section class="section">
    <div class="section-title"><img class="title-icon" src="../assets/icons/books.png" alt=""><h2 data-i18n="admin.courses.addNew">新增課程</h2></div>

    <div class="avatar-picker">
      <span class="avatar-picker-preview is-inactive" id="add-course-image-wrap"><img id="add-course-image-preview" src="" alt=""></span>
      <button type="button" class="btn outline sm" id="add-course-image-random-btn"><i class="fa-solid fa-fw fa-shuffle"></i> <span data-i18n="admin.common.random">隨機</span></button>
      <div class="status-toggle-wrap">
        <span class="status-toggle-text" id="status-toggle-text" data-i18n="admin.common.disabled">停用</span>
        <label class="status-toggle">
          <input type="checkbox" id="add-status-toggle">
          <span class="status-toggle-track"><span class="status-toggle-thumb"></span></span>
        </label>
      </div>
    </div>

    <div class="field-row">
      <div class="form-field">
        <label for="add-course-name"><i class="fa-solid fa-fw fa-book"></i> <span data-i18n="admin.courses.field.name">課程名稱</span></label>
        <input type="text" id="add-course-name" class="text-input" data-i18n-placeholder="admin.courses.field.namePlaceholder" placeholder="請輸入課程名稱" maxlength="25">
      </div>
      <div class="form-field">
        <label for="add-course-description"><i class="fa-solid fa-fw fa-align-left"></i> <span data-i18n="admin.courses.field.description">描述</span></label>
        <input type="text" id="add-course-description" class="text-input" data-i18n-placeholder="admin.courses.field.descriptionPlaceholder" placeholder="選課時會顯示在課程下方的說明文字" maxlength="100">
      </div>
    </div>
  </section>

  <div class="wizard-nav">
    <button type="button" class="btn blue" id="add-submit-btn"><i class="fa-solid fa-fw fa-plus"></i> <span data-i18n="admin.common.add">新增</span></button>
  </div>

</div>

<div class="modal-overlay" id="courseAddAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="courseAddAlertText"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="courseAddSuccessModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-check"></i></div>
    <h3 data-i18n="admin.courses.addSuccess">已新增課程</h3>
    <div class="modal-actions">
      <button class="btn blue" id="course-add-success-ok-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="statusLockedModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 data-i18n="admin.courses.statusLock.title">還不能啟用</h3>
    <p class="text-small" data-i18n="admin.courses.statusLock.desc">新增課程後，請先設定完成時間參數與可以上這堂課的老師，再啟用課程，避免學生看到還沒設定好的課程。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3 data-i18n="booking.leaveConfirm.title">確定要離開嗎？</h3>
    <p class="text-small" data-i18n="admin.common.unsavedFormDesc">目前輸入的資料將不會保留。</p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="confirm-leave-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="booking.leaveConfirm.confirm">確定離開</span></button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());
})();

  let currentImage = randomAvatar(); // 新增課程時先隨機給一個動物頭像

  function setCourseImage(newImage) {
    currentImage = newImage;
    const img = document.getElementById('add-course-image-preview');
    img.src = courseImageSrc(currentImage);
    img.classList.remove('avatar-swap');
    void img.offsetWidth;
    img.classList.add('avatar-swap');
  }
  document.getElementById('add-course-image-preview').src = courseImageSrc(currentImage);

  function setStatusToggle(isActive) {
    document.getElementById('add-status-toggle').checked = isActive;
    document.getElementById('add-course-image-wrap').classList.toggle('is-inactive', !isActive);
  }
  setStatusToggle(false); // 新課程還有很多東西要設定，預設先停用，這階段不能啟用
  // 狀態文字一律停用（點擊會被下面攔截，不會真的切到啟用），維持 HTML 原本
  // data-i18n 套用好的文字即可，不用在這裡搶在語言字典載入完成前先蓋一次。
  document.getElementById('add-status-toggle').addEventListener('click', (e) => {
    if (e.target.checked) {
      e.preventDefault();
      document.getElementById('statusLockedModal').classList.add('open');
    }
  });

  document.getElementById('add-course-image-random-btn').addEventListener('click', () => {
    setCourseImage(randomAvatar());
  });

  function showAddAlert(message) {
    document.getElementById('courseAddAlertText').textContent = message;
    document.getElementById('courseAddAlertModal').classList.add('open');
  }

  document.getElementById('add-submit-btn').addEventListener('click', async () => {
    const name = document.getElementById('add-course-name').value.trim();

    if (!name) {
      showAddAlert(t('admin.courses.fillNameRequired'));
      return;
    }

    const res = await fetch('/api/courses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        description: document.getElementById('add-course-description').value.trim(),
        image: currentImage,
        status: document.getElementById('add-status-toggle').checked ? 'active' : 'inactive',
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showAddAlert(data.error || t('hours.error.addFailed'));
      return;
    }
    document.getElementById('courseAddSuccessModal').classList.add('open');
  });

  document.getElementById('course-add-success-ok-btn').addEventListener('click', () => {
    window.location.href = 'courses.html';
  });

  const initialImage = currentImage;

  function hasUnsavedInput() {
    return document.getElementById('add-course-name').value.trim() !== ''
      || document.getElementById('add-course-description').value.trim() !== ''
      || currentImage !== initialImage
      || document.getElementById('add-status-toggle').checked;
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    if (hasUnsavedInput()) {
      document.getElementById('leaveConfirmModal').classList.add('open');
      return;
    }
    window.location.href = 'courses.html';
  });

  document.getElementById('confirm-leave-btn').addEventListener('click', () => {
    window.location.href = 'courses.html';
  });
</script>

</body>
</html>
