<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 管理者主頁</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.placeholder-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.placeholder-page .page {
    width: 100%;
    padding-top: 0;
    padding-bottom: 0;
  }
  .placeholder-card {
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: var(--space-7) var(--space-6);
    box-shadow: var(--shadow-sm);
  }
  .placeholder-card img { width: 72px; height: 72px; margin: 0 auto var(--space-4); display: block; }
  .placeholder-card h1 { margin: 0 0 var(--space-2); font-size: 1.5rem; }
  .placeholder-card p { margin: 0 0 var(--space-6); color: var(--text-muted); }
  .placeholder-card .back-link { display: inline-block; color: var(--color-primary); font-weight: 600; text-decoration: none; }
  .placeholder-card .back-link:hover { text-decoration: underline; }
</style>
</head>
<body class="placeholder-page">

<div class="page">
  <div class="placeholder-card">
    <img src="../assets/icons/admin.png" alt="">
    <h1>管理者主頁</h1>
    <p>登入成功，歡迎回來！這裡之後會是老師、課程與系統設定的管理畫面。</p>
    <a class="back-link" href="../">‹ 回首頁</a>
  </div>
</div>

</body>
</html>
