<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 管理者主頁</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.dashboard {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.dashboard .page {
    width: 100%;
    max-width: 548px;
    margin: 0 auto;
    padding-top: var(--space-6);
    padding-bottom: var(--space-6);
  }

  @media (max-width: 640px) {
    body.dashboard {
      align-items: flex-start;
    }
    body.dashboard .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
  }

  .dash-cards {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }
  .dash-card {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    width: 500px;
    max-width: 100%;
    margin: 0 auto;
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    padding: var(--space-5) 40px;
    will-change: transform;
    transform-style: preserve-3d;
    transition: border-color .2s ease, box-shadow .2s ease, transform .35s ease;
  }
  .dash-card:hover {
    border-color: var(--color-blue);
    box-shadow: var(--shadow-md);
  }
  .dash-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 64px;
    height: 64px;
  }
  .dash-card-icon img { width: 100%; height: 100%; object-fit: contain; }
  .dash-card h3 { margin: 0 0 4px; font-size: 1.375rem; }
  .dash-card p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); }

  @media (max-width: 640px) {
    .dash-card {
      padding: var(--space-4) var(--space-4);
      gap: var(--space-3);
    }
  }
</style>
</head>
<body class="dashboard">

<div class="back-header">
  <button type="button" class="back-btn" id="logout-btn" data-modal-open="logoutConfirmModal"><i class="fa-solid fa-fw fa-arrow-right-from-bracket"></i></button>
</div>

<div id="lang-switch"></div>

<div class="modal-overlay" id="logoutConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3>確定要登出嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> 取消</button>
      <button class="btn red" id="logout-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> 登出</button>
    </div>
  </div>
</div>

<div class="page">

  <div class="dash-cards">
    <button type="button" class="dash-card" data-action="bookings">
      <span class="dash-card-icon"><img src="../assets/icons/icon-calendar.png" alt=""></span>
      <span>
        <h3>預約紀錄</h3>
        <p>查看所有學生的預約總覽</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="students">
      <span class="dash-card-icon"><img src="../assets/icons/write-student.png" alt=""></span>
      <span>
        <h3>學生管理</h3>
        <p>查看與管理學生帳號資料</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="teachers">
      <span class="dash-card-icon"><img src="../assets/icons/write-teacher.png" alt=""></span>
      <span>
        <h3>老師管理</h3>
        <p>查看與管理老師帳號資料</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="courses">
      <span class="dash-card-icon"><img src="../assets/icons/blackboard.png" alt=""></span>
      <span>
        <h3>課程管理</h3>
        <p>設定課程項目與預約規則</p>
      </span>
    </button>
  </div>

</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 管理者帳號（admins 資料表）目前沒有 language 欄位——管理端頁面的翻譯
  // 還沒做，這裡先跟登入頁一樣只存 localStorage，等管理端頁面開始翻譯時
  // 再補資料庫欄位讓它跨裝置同步。
  const lang = getCurrentLang();
  await initI18n(lang);
  renderLangSwitch(document.getElementById('lang-switch'), lang);
})();

  document.querySelector('[data-action="students"]').addEventListener('click', () => {
    window.location.href = 'students.html';
  });
  document.querySelector('[data-action="teachers"]').addEventListener('click', () => {
    window.location.href = 'teachers.html';
  });
  document.querySelector('[data-action="bookings"]').addEventListener('click', () => {
    window.location.href = 'bookings.html';
  });
  document.querySelector('[data-action="courses"]').addEventListener('click', () => {
    window.location.href = 'courses.html';
  });

  document.querySelectorAll('.dash-card').forEach((card) => applyTiltEffect(card));

  document.getElementById('logout-confirm-btn').addEventListener('click', () => {
    fetch('/api/logout', { method: 'POST' }).finally(() => { window.location.href = '../'; });
  });
</script>

</body>
</html>
