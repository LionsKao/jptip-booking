<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 管理者主頁</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.dashboard {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.dashboard .page {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding-top: var(--space-6);
    padding-bottom: var(--space-6);
  }

  @media (max-width: 640px) {
    body.dashboard {
      align-items: flex-start;
    }
    body.dashboard .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
  }

  /* 項目變多了，桌機排成兩欄（手機一欄，見下方 media query） */
  .dash-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-5);
    padding: 0 var(--space-4);
  }
  .dash-card {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    width: 100%;
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    padding: var(--space-5) 40px;
    will-change: transform;
    transform-style: preserve-3d;
    transition: border-color .2s ease, box-shadow .2s ease, transform .35s ease;
  }
  .dash-card:hover {
    border-color: var(--color-blue);
    box-shadow: var(--shadow-md);
  }
  .dash-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 64px;
    height: 64px;
  }
  .dash-card-icon img { width: 100%; height: 100%; object-fit: contain; }
  .dash-card h3 { margin: 0 0 4px; font-size: 1.375rem; }
  .dash-card p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); }

  @media (max-width: 640px) {
    .dash-cards {
      grid-template-columns: 1fr;
    }
    .dash-card {
      padding: var(--space-4) var(--space-4);
      gap: var(--space-3);
    }
  }
</style>
</head>
<body class="dashboard">

<div class="back-header">
  <button type="button" class="back-btn" id="logout-btn" data-modal-open="logoutConfirmModal"><i class="fa-solid fa-fw fa-arrow-right-from-bracket"></i></button>
</div>

<div id="lang-switch"></div>

<div class="modal-overlay" id="logoutConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3 data-i18n="dashboard.logoutConfirm.title">確定要登出嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="logout-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="dashboard.logout">登出</span></button>
    </div>
  </div>
</div>

<div class="page">

  <div class="dash-cards">
    <button type="button" class="dash-card" data-action="bookings">
      <span class="dash-card-icon"><img src="../assets/icons/icon-calendar.png" alt=""></span>
      <span>
        <h3 data-i18n="admin.dash.bookings.title">預約紀錄</h3>
        <p data-i18n="admin.dash.bookings.desc">查看所有學生的預約總覽</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="students">
      <span class="dash-card-icon"><img src="../assets/icons/write-student.png" alt=""></span>
      <span>
        <h3 data-i18n="admin.dash.students.title">學生管理</h3>
        <p data-i18n="admin.dash.students.desc">查看與管理學生帳號資料</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="teachers">
      <span class="dash-card-icon"><img src="../assets/icons/write-teacher.png" alt=""></span>
      <span>
        <h3 data-i18n="admin.dash.teachers.title">老師管理</h3>
        <p data-i18n="admin.dash.teachers.desc">查看與管理老師帳號資料</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="courses">
      <span class="dash-card-icon"><img src="../assets/icons/blackboard.png" alt=""></span>
      <span>
        <h3 data-i18n="admin.dash.courses.title">課程管理</h3>
        <p data-i18n="admin.dash.courses.desc">設定課程項目與預約規則</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="invoices">
      <span class="dash-card-icon"><img src="../assets/icons/invoice.png" alt=""></span>
      <span>
        <h3 data-i18n="admin.dash.invoices.title">請求書</h3>
        <p data-i18n="admin.dash.invoices.desc">每月老師的請求書與實績通知書</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="emails">
      <span class="dash-card-icon"><img src="../assets/icons/email.png" alt=""></span>
      <span>
        <h3 data-i18n="admin.dash.emails.title">系統信件</h3>
        <p data-i18n="admin.dash.emails.desc">管理系統自動寄出的信件內容</p>
      </span>
    </button>
  </div>

</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 帳號的 language 欄位才是真相；登入後這裡負責把它同步進 localStorage，
  // 也讓管理者隨時能在這頁換語言（換的當下也存回帳號，換裝置登入才會一致）。
  const me = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  const lang = (me && me.language) || getCurrentLang();
  setCurrentLang(lang);
  await initI18n(lang);
  renderLangSwitch(document.getElementById('lang-switch'), lang, (newLang) => {
    fetch('/api/me/language', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ language: newLang }),
    });
  });
})();

  document.querySelector('[data-action="students"]').addEventListener('click', () => {
    window.location.href = 'students.html';
  });
  document.querySelector('[data-action="teachers"]').addEventListener('click', () => {
    window.location.href = 'teachers.html';
  });
  document.querySelector('[data-action="bookings"]').addEventListener('click', () => {
    window.location.href = 'bookings.html';
  });
  document.querySelector('[data-action="courses"]').addEventListener('click', () => {
    window.location.href = 'courses.html';
  });
  document.querySelector('[data-action="invoices"]').addEventListener('click', () => {
    window.location.href = 'invoices.html';
  });
  document.querySelector('[data-action="emails"]').addEventListener('click', () => {
    window.location.href = 'email-templates.html';
  });

  document.querySelectorAll('.dash-card').forEach((card) => applyTiltEffect(card));

  document.getElementById('logout-confirm-btn').addEventListener('click', () => {
    fetch('/api/logout', { method: 'POST' }).finally(() => { window.location.href = '../'; });
  });
</script>

</body>
</html>
