<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 新增學生</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 1000px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  .section {
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  #add-timezone-dropdown { width: 100%; }
  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
  }

  .wizard-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    margin-top: var(--space-6);
  }
  .wizard-nav .btn { min-width: 160px; }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    .wizard-nav {
      width: 100%;
      flex-wrap: wrap;
    }
    .wizard-nav .btn { min-width: 0; flex: 1 1 0; }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-arrow-left"></i></button>
</div>

<div class="page">

  <section class="section">
    <div class="section-title"><img class="title-icon" src="../assets/icons/write-student.png" alt=""><h2 data-i18n="admin.students.addNew">新增學生</h2></div>

    <div class="avatar-picker">
      <span class="avatar-picker-preview"><img id="add-avatar-preview" src="" alt=""></span>
      <button type="button" class="btn outline sm" id="add-avatar-random-btn"><i class="fa-solid fa-fw fa-shuffle"></i> <span data-i18n="admin.common.random">隨機</span></button>
      <div class="status-toggle-wrap">
        <span class="status-toggle-text" id="status-toggle-text" data-i18n="admin.common.disabled">停用</span>
        <label class="status-toggle">
          <input type="checkbox" id="add-status-toggle">
          <span class="status-toggle-track"><span class="status-toggle-thumb"></span></span>
        </label>
      </div>
    </div>

    <div class="field-row">
      <div class="form-field">
        <label for="add-name"><i class="fa-solid fa-fw fa-user"></i> <span data-i18n="admin.field.name">姓名</span></label>
        <input type="text" id="add-name" class="text-input" data-i18n-placeholder="admin.field.namePlaceholder" placeholder="請輸入姓名" maxlength="50">
      </div>
      <div class="form-field">
        <label for="add-phone"><i class="fa-solid fa-fw fa-phone"></i> <span data-i18n="admin.field.phone">手機</span></label>
        <input type="tel" id="add-phone" class="text-input" data-i18n-placeholder="admin.field.phonePlaceholder" placeholder="請輸入手機號碼" maxlength="15">
      </div>
    </div>
    <div class="field-row">
      <div class="form-field">
        <label for="add-email"><i class="fa-solid fa-fw fa-envelope"></i> Email</label>
        <input type="email" id="add-email" class="text-input" data-i18n-placeholder="admin.field.emailPlaceholder" placeholder="請輸入 Email" maxlength="100">
      </div>
      <div class="form-field">
        <label><i class="fa-solid fa-fw fa-earth-asia"></i> <span data-i18n="admin.field.timezone">時區</span></label>
        <div class="dropdown" id="add-timezone-dropdown" data-placeholder="選擇時區">
          <button type="button" class="dropdown-trigger"><span class="label" data-i18n="admin.field.selectTimezone">選擇時區</span><i class="fa-solid fa-fw fa-chevron-down"></i></button>
          <ul class="dropdown-menu">
            <li data-value="UTC+08:00 台北">UTC+08:00 台北<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="UTC+09:00 大阪、札幌、東京">UTC+09:00 大阪、札幌、東京<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="UTC+07:00 河內、胡志明市">UTC+07:00 河內、胡志明市<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="UTC+06:30 仰光">UTC+06:30 仰光<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="form-field" style="grid-column: span 2;">
        <label for="add-teams-link"><i class="fa-solid fa-fw fa-video"></i> <span data-i18n="admin.field.teamsLink">Teams 會議室連結</span></label>
        <input type="url" id="add-teams-link" class="text-input" data-i18n-placeholder="admin.field.teamsLinkPlaceholder" placeholder="請輸入 Teams 會議室連結" maxlength="200">
      </div>
    </div>
  </section>

  <div class="wizard-nav">
    <button type="button" class="btn blue" id="add-submit-btn" disabled><i class="fa-solid fa-fw fa-plus"></i> <span data-i18n="admin.common.add">新增</span></button>
  </div>

</div>

<div class="modal-overlay" id="studentAddAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="studentAddAlertText"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="statusLockModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-fw fa-circle-info"></i></div>
    <h3 data-i18n="admin.students.statusLock.title">尚無法啟用</h3>
    <p class="text-small" data-i18n="admin.students.statusLock.desc">請先新增這位學生，並在學生詳情頁面設定已購買的課程，再啟用帳號。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="studentAddSuccessModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-check"></i></div>
    <h3 data-i18n="admin.students.addSuccess">已新增學生</h3>
    <div class="modal-actions">
      <button class="btn blue" id="student-add-success-ok-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3 data-i18n="booking.leaveConfirm.title">確定要離開嗎？</h3>
    <p class="text-small" data-i18n="admin.common.unsavedFormDesc">目前輸入的資料將不會保留。</p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="confirm-leave-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="booking.leaveConfirm.confirm">確定離開</span></button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());
})();

  let currentAvatar = randomAvatar();
  document.getElementById('add-avatar-preview').src = `../assets/avatars/${currentAvatar}`;
  document.getElementById('add-avatar-random-btn').addEventListener('click', () => {
    currentAvatar = randomAvatar();
    const avatarImg = document.getElementById('add-avatar-preview');
    avatarImg.src = `../assets/avatars/${currentAvatar}`;
    avatarImg.classList.remove('avatar-swap');
    void avatarImg.offsetWidth;
    avatarImg.classList.add('avatar-swap');
  });

  setDropdownValue('add-timezone-dropdown', 'UTC+08:00 台北');
  document.querySelector('.avatar-picker-preview').classList.add('is-inactive');

  document.getElementById('add-status-toggle').addEventListener('change', (e) => {
    if (e.target.checked) {
      e.target.checked = false;
      document.getElementById('statusLockModal').classList.add('open');
      return;
    }
    document.getElementById('status-toggle-text').textContent = t('admin.common.disabled');
    document.querySelector('.avatar-picker-preview').classList.add('is-inactive');
  });

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function showAddAlert(message) {
    document.getElementById('studentAddAlertText').textContent = message;
    document.getElementById('studentAddAlertModal').classList.add('open');
  }

  ['add-name', 'add-phone', 'add-email', 'add-teams-link'].forEach((id) => {
    document.getElementById(id).addEventListener('input', (e) => {
      e.target.classList.remove('input-error');
    });
  });

  // 必填欄位都有填「新增」才能按（從停用變成可按時跳一下）；Email 格式這類要比對的錯誤還是按下去才檢查
  watchForm(document.querySelector('.page'), document.getElementById('add-submit-btn'),
    () => ['add-name', 'add-phone', 'add-email'].every((id) => document.getElementById(id).value.trim()));

  document.getElementById('add-submit-btn').addEventListener('click', async () => {
    const nameEl = document.getElementById('add-name');
    const phoneEl = document.getElementById('add-phone');
    const emailEl = document.getElementById('add-email');
    const teamsLinkEl = document.getElementById('add-teams-link');
    const name = nameEl.value.trim();
    const phone = phoneEl.value.trim();
    const email = emailEl.value.trim();
    const teamsLink = teamsLinkEl.value.trim();

    nameEl.classList.toggle('input-error', !name);
    phoneEl.classList.toggle('input-error', !phone);
    emailEl.classList.toggle('input-error', !email || !EMAIL_RE.test(email));

    // Teams 會議室連結目前還沒有實際會用到它的功能（保留欄位給未來使用），
    // 所以跟舊版 mock 不同，新增學生時不再強制要求填寫。
    if (!name || !phone || !email) {
      showAddAlert(t('admin.common.fillRequired'));
      return;
    }
    if (!EMAIL_RE.test(email)) {
      showAddAlert(t('admin.common.invalidEmail'));
      return;
    }

    const res = await fetch('/api/students', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        phone: phone.replace(/\D/g, ''),
        email,
        teamsLink,
        avatar: currentAvatar,
        status: document.getElementById('add-status-toggle').checked ? 'active' : 'inactive',
        timezone: getDropdownValue('add-timezone-dropdown'),
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showAddAlert(data.error || t('hours.error.addFailed'));
      return;
    }
    document.getElementById('studentAddSuccessModal').classList.add('open');
  });

  document.getElementById('student-add-success-ok-btn').addEventListener('click', () => {
    window.location.href = 'students.html';
  });

  function hasUnsavedInput() {
    return ['add-name', 'add-phone', 'add-email', 'add-teams-link']
      .some((id) => document.getElementById(id).value.trim() !== '');
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    if (hasUnsavedInput()) {
      document.getElementById('leaveConfirmModal').classList.add('open');
      return;
    }
    window.location.href = 'students.html';
  });

  document.getElementById('confirm-leave-btn').addEventListener('click', () => {
    window.location.href = 'students.html';
  });
</script>

</body>
</html>
