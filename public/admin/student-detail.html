<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 學生詳細資料</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 548px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }

  .dash-card {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    width: 100%;
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    padding: var(--space-5);
    transition: border-color .2s ease, box-shadow .2s ease, transform .35s ease;
    will-change: transform;
    transform-style: preserve-3d;
  }
  .dash-card:hover {
    border-color: var(--color-blue);
    box-shadow: var(--shadow-md);
  }
  .dash-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 56px;
    height: 56px;
  }
  .dash-card-icon img { width: 100%; height: 100%; object-fit: contain; }
  .dash-card h3 { margin: 0 0 4px; font-size: 1.25rem; }
  .dash-card p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); }

  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-arrow-left"></i></button>
</div>

<div class="page">

  <div class="student-header">
    <span class="student-header-avatar"><img id="student-header-avatar-img" src="" alt=""></span>
    <div class="student-header-name">
      <h2 id="student-header-name"></h2>
      <span class="pill tone-muted" id="student-header-status" hidden data-i18n="admin.common.disabled">停用</span>
    </div>
  </div>

  <button type="button" class="dash-card" id="basic-entry-card">
    <span class="dash-card-icon"><img src="../assets/icons/clipboard.png" alt=""></span>
    <span>
      <h3 data-i18n="admin.detail.basic.title">基本資料</h3>
      <p data-i18n="admin.students.detail.basic.desc">查看與編輯姓名、聯絡方式、狀態與時區</p>
    </span>
  </button>

  <button type="button" class="dash-card" id="courses-entry-card">
    <span class="dash-card-icon"><img src="../assets/icons/invoice.png" alt=""></span>
    <span>
      <h3 data-i18n="admin.students.detail.courses.title">購買課程</h3>
      <p data-i18n="admin.students.detail.courses.desc">查看與新增學生購買的課程</p>
    </span>
  </button>

  <button type="button" class="dash-card" id="bookings-entry-card">
    <span class="dash-card-icon"><img src="../assets/icons/flash-card.png" alt=""></span>
    <span>
      <h3 data-i18n="admin.dash.bookings.title">預約紀錄</h3>
      <p data-i18n="admin.students.detail.bookings.desc">查看學生的課程預約與上課紀錄</p>
    </span>
  </button>

</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());

  const studentId = Number(new URLSearchParams(window.location.search).get('id'));
  const students = await fetch('/api/students').then((res) => (res.ok ? res.json() : []));
  const student = students.find((s) => s.id === studentId);

  if (!student) {
    window.location.href = 'students.html';
  } else {
    // 「最近點擊」要讓所有管理者共用，寫進 D1（失敗就算了，不影響本頁瀏覽）
    fetch(`/api/recently-viewed?type=student&id=${student.id}`, { method: 'PUT' }).catch(() => {});

    document.getElementById('student-header-avatar-img').src = avatarSrc(student.avatar);
    document.getElementById('student-header-name').textContent = student.name;
    document.getElementById('student-header-status').hidden = student.status !== 'inactive';

    document.getElementById('basic-entry-card').addEventListener('click', () => {
      window.location.href = `student-basic.html?id=${student.id}`;
    });
    document.getElementById('courses-entry-card').addEventListener('click', () => {
      window.location.href = `student-courses.html?id=${student.id}`;
    });
    document.getElementById('bookings-entry-card').addEventListener('click', () => {
      window.location.href = `student-bookings.html?id=${student.id}`;
    });

    document.querySelectorAll('.dash-card').forEach((card) => applyTiltEffect(card));
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'students.html';
  });
})();
</script>

</body>
</html>
