<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 請求書</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 1000px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  /* 月份切換：‹ 2025 年 06 月 › */
  .invoice-month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    margin-bottom: var(--space-5);
  }
  .invoice-month-label {
    min-width: 170px;
    text-align: center;
    font-size: 1.375rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  /* 分段切換：預設只顯示有堂數的老師，避免每個月一堆 0 堂的卡片（例如老師剛離職、還沒排課）；
     切到「全部」才會看到 0 堂的老師，方便檢查是不是漏排課。純前端篩選，不重打 API。 */
  .invoice-filter {
    display: flex;
    justify-content: center;
    margin-bottom: var(--space-4);
  }
  .invoice-filter-group {
    position: relative;
    display: inline-flex;
    gap: 4px;
    background: var(--bg-card-alt);
    padding: 4px;
    border-radius: var(--radius-pill);
  }
  /* 選中的那顆底色其實是這個會滑動的方塊，不是按鈕自己的背景——
     這樣切換的時候才會像開關一樣左右滑過去，而不是兩顆按鈕各自瞬間變色 */
  .invoice-filter-thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    height: calc(100% - 8px);
    width: calc(50% - 4px);
    background: var(--bg-card);
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-sm);
    transition: left .22s ease, width .22s ease;
  }
  .invoice-filter-btn {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: var(--fs-small);
    font-weight: 700;
    padding: 7px 18px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: color .2s ease;
  }
  .invoice-filter-btn.active {
    color: var(--text-main);
  }

  #invoice-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-3);
  }
  /* 切換「有堂數／全部」或換月份，卡片重新整批畫出來時淡入滑入一下，
     不要整批瞬間跳出來 */
  @keyframes invoiceCardIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .invoice-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
    animation: invoiceCardIn .22s ease both;
  }
  .invoice-card:hover { border-color: var(--color-blue); }
  /* 跟學生/老師/課程等列表的空狀態卡片同一種樣式：置中、粗體 */
  .invoice-card-empty { grid-column: 1 / -1; min-height: 88px; align-items: center; justify-content: center; font-weight: 700; font-size: 1.0625rem; }
  /* 同一行：頭像＋姓名（下面一行小字是算法）在左，堂數／金額靠右對齊，往下看容易比較；
     停用的老師右上角有緞帶，右邊多留一點空間 */
  .invoice-card-head { display: flex; align-items: center; gap: var(--space-3); }
  .invoice-card.has-ribbon .invoice-card-head { padding-right: 56px; }
  .invoice-card-name { flex: 1; min-width: 0; }
  .invoice-card-avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: var(--bg-card-alt); }
  .invoice-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .invoice-card-avatar.is-inactive img { filter: grayscale(1); }
  .invoice-card h4 { margin: 0; font-size: 1.125rem; overflow-wrap: anywhere; }
  /* 合計金額放大，單價 × 堂數、稅率縮成一行小字 */
  .invoice-card-total { flex: none; margin-left: auto; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
  /* 當月沒有完成的課（0 堂）：金額用淡色 */
  .invoice-card.is-idle .invoice-card-total { color: var(--text-muted); }
  .invoice-card-breakdown { margin: 2px 0 0; color: var(--text-muted); font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
  .invoice-card-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #invoice-cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house"></i></button>
</div>

<div class="page">
  <section class="section">
    <div class="section-title"><img class="title-icon" src="../assets/icons/invoice.png" alt=""><h2 data-i18n="admin.dash.invoices.title">請求書</h2></div>
    <div class="invoice-month-nav">
      <button type="button" class="btn outline sm" id="prev-month-btn" data-i18n-aria-label="admin.invoices.prevMonth" aria-label="上個月"><i class="fa-solid fa-fw fa-chevron-left"></i></button>
      <span class="invoice-month-label" id="month-label"></span>
      <button type="button" class="btn outline sm" id="next-month-btn" data-i18n-aria-label="admin.invoices.nextMonth" aria-label="下個月"><i class="fa-solid fa-fw fa-chevron-right"></i></button>
    </div>
    <div class="invoice-filter">
      <div class="invoice-filter-group">
        <span class="invoice-filter-thumb" aria-hidden="true"></span>
        <button type="button" class="invoice-filter-btn" data-filter="lessons" data-i18n="admin.invoices.filterLessons">有堂數</button>
        <button type="button" class="invoice-filter-btn" data-filter="all" data-i18n="admin.invoices.filterAll">全部</button>
      </div>
    </div>
    <div id="invoice-cards"></div>
  </section>
</div>

<div class="modal-overlay" id="invoiceAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="invoiceAlertText"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
// 月份（'YYYY-MM'）加減幾個月
function shiftMonth(month, delta) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
}

// 月份標題：繁中寫成「2025 年 06 月」，緬甸文查表，其他語言交給 Intl
function formatInvoiceMonth(month) {
  const [y, m] = month.split('-').map(Number);
  const lang = getCurrentLang();
  if (lang === 'zh-Hant') return `${y} 年 ${String(m).padStart(2, '0')} 月`;
  if (lang === 'my') return myMonthYearLabel(y, m - 1);
  return new Intl.DateTimeFormat(DATE_LOCALE_MAP[lang] || DATE_LOCALE_MAP['zh-Hant'], { year: 'numeric', month: 'long' }).format(new Date(y, m - 1, 1));
}

function formatYen(value) {
  return Number(value).toLocaleString('en-US', { maximumFractionDigits: 2 });
}

// 缺少的領收書欄位名稱，沿用老師資料頁的欄位名稱
const MISSING_FIELD_KEYS = {
  unitPrice: 'admin.teachers.receipt.wage',
  address: 'admin.teachers.receipt.address',
  companyName: 'admin.teachers.receipt.companyName',
  companyAddress: 'admin.teachers.receipt.companyAddress',
};

(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());

  // 月份記在網址（?month=YYYY-MM），重新整理或從明細頁返回都停在同一個月；沒指定就顯示上個月
  // （通常是月初請上個月的款）。「這個月」以 UTC+8 的日期為準，跟上課日期的基準一致。
  const params = new URLSearchParams(window.location.search);
  let month = /^\d{4}-(0[1-9]|1[0-2])$/.test(params.get('month') || '') ? params.get('month') : shiftMonth(utc8DateISO().slice(0, 7), -1);

  const cardsEl = document.getElementById('invoice-cards');

  function showAlert(message) {
    document.getElementById('invoiceAlertText').textContent = message;
    document.getElementById('invoiceAlertModal').classList.add('open');
  }

  function renderInvoiceCard(inv) {
    const inactive = inv.status === 'inactive';
    const ribbon = inactive ? `<span class="ribbon-clip"><span class="course-ribbon">${t('admin.common.disabled')}</span></span>` : '';
    // 當月 0 堂：沒有可請款的內容，也沒有課程明細，三個按鈕都停用
    const idle = inv.lessonCount === 0;
    // 有每堂單價：右邊是金額，姓名下面一行小字是算法；沒有單價：右邊只顯示堂數
    const total = inv.total === null
      ? escapeHtml(t('admin.invoices.lessonCount', { count: inv.lessonCount }))
      : `¥${formatYen(inv.total)}`;
    const breakdown = inv.total === null
      ? ''
      : `<p class="invoice-card-breakdown">${escapeHtml(t('admin.invoices.breakdown', { price: formatYen(inv.unitPrice), count: inv.lessonCount }))}</p>`;
    const actions = `
      <button type="button" class="btn sm outline" data-action="invoice"${idle ? ' disabled' : ''}><i class="fa-solid fa-fw fa-file-invoice-dollar"></i> ${t('admin.invoices.invoice')}</button>
      <button type="button" class="btn sm outline" data-action="notice"${idle ? ' disabled' : ''}><i class="fa-solid fa-fw fa-file-lines"></i> ${t('admin.invoices.notice')}</button>
      <button type="button" class="btn sm outline" data-action="detail"${idle ? ' disabled' : ''}><i class="fa-solid fa-fw fa-list"></i> ${t('admin.invoices.detail')}</button>`;
    return `<div class="invoice-card${idle ? ' is-idle' : ''}${inactive ? ' has-ribbon' : ''}" data-teacher-id="${inv.teacherId}">
      ${ribbon}
      <div class="invoice-card-head">
        <span class="invoice-card-avatar${inactive ? ' is-inactive' : ''}"><img src="${escapeHtml(avatarSrc(inv.avatar))}" alt=""></span>
        <div class="invoice-card-name">
          <h4>${escapeHtml(inv.name)}</h4>
          ${breakdown}
        </div>
        <div class="invoice-card-total">${total}</div>
      </div>
      <div class="invoice-card-actions">${actions}</div>
    </div>`;
  }

  // 篩選只影響畫面上顯示哪幾張卡片，資料本來就已經抓回來了，不用重打 API；
  // 記在 localStorage 是這台瀏覽器的個人習慣，換月份、重新整理都會記得。
  const FILTER_KEY = 'admin-invoice-filter';
  let filterMode = localStorage.getItem(FILTER_KEY) === 'all' ? 'all' : 'lessons';
  let currentInvoices = [];

  function renderCards() {
    const invoices = filterMode === 'all' ? currentInvoices : currentInvoices.filter((inv) => inv.lessonCount > 0);
    cardsEl.innerHTML = invoices.length
      ? invoices.map(renderInvoiceCard).join('')
      : `<div class="invoice-card invoice-card-empty">${t('admin.invoices.empty')}</div>`;

    cardsEl.querySelectorAll('.invoice-card').forEach((card) => applyTiltEffect(card));
    cardsEl.querySelectorAll('.invoice-card [data-action]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const teacherId = btn.closest('.invoice-card').dataset.teacherId;
        const action = btn.dataset.action;
        const inv = invoices.find((i) => String(i.teacherId) === teacherId);
        if ((action === 'invoice' || action === 'notice') && inv.missing.length) {
          // 老師的領收書資料沒填完整，文件上會缺東西：先告訴管理者缺哪些
          showAlert(t('admin.invoices.missing', {
            fields: inv.missing.map((f) => t(MISSING_FIELD_KEYS[f])).join(t('admin.invoices.separator')),
          }));
        } else if (action === 'invoice' || action === 'notice') {
          // 文件在新分頁開，管理者在那邊列印／存成 PDF
          window.open(`invoice-print.html?teacherId=${teacherId}&month=${month}&type=${action}`, '_blank', 'noopener');
        } else if (action === 'detail') {
          window.location.href = `invoice-detail.html?teacherId=${teacherId}&month=${month}`;
        }
      });
    });
  }

  let loadSeq = 0;
  async function loadMonth() {
    const seq = ++loadSeq;
    document.getElementById('month-label').textContent = formatInvoiceMonth(month);
    history.replaceState(null, '', `?month=${month}`);
    const res = await fetch(`/api/invoices?month=${month}`).catch(() => null);
    if (seq !== loadSeq) return; // 快速連點換月份時，只畫最後一次的結果
    if (!res || !res.ok) {
      cardsEl.innerHTML = '';
      showAlert(t('admin.invoices.loadFailed'));
      return;
    }
    currentInvoices = await res.json();
    if (seq !== loadSeq) return;
    renderCards();
  }

  // 滑動的方塊要跟著目前選中的按鈕的實際寬度和位置走（兩個字的「全部」比「有堂數」窄，
  // 換語言時文字長度也不一樣），量按鈕在 .invoice-filter-group 裡的位置來對齊。
  function moveFilterThumb() {
    const activeBtn = document.querySelector('.invoice-filter-btn.active');
    const thumb = document.querySelector('.invoice-filter-thumb');
    if (!activeBtn || !thumb) return;
    thumb.style.left = `${activeBtn.offsetLeft}px`;
    thumb.style.width = `${activeBtn.offsetWidth}px`;
  }

  document.querySelectorAll('.invoice-filter-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.filter === filterMode);
    btn.addEventListener('click', () => {
      if (btn.dataset.filter === filterMode) return;
      filterMode = btn.dataset.filter;
      localStorage.setItem(FILTER_KEY, filterMode);
      document.querySelectorAll('.invoice-filter-btn').forEach((b) => b.classList.toggle('active', b === btn));
      moveFilterThumb();
      renderCards();
    });
  });
  moveFilterThumb();

  document.getElementById('prev-month-btn').addEventListener('click', () => { month = shiftMonth(month, -1); loadMonth(); });
  document.getElementById('next-month-btn').addEventListener('click', () => { month = shiftMonth(month, 1); loadMonth(); });
  document.getElementById('back-btn').addEventListener('click', () => { window.location.href = 'index.html'; });

  loadMonth();
})();
</script>

</body>
</html>
