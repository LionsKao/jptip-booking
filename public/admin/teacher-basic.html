<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 老師基本資料</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 900px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }
  #card-basic { max-width: 800px; width: 100%; margin: 0 auto var(--space-5); }
  #card-receipt { max-width: 800px; width: 100%; margin: 0 auto; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
  }
  .text-input { font-variant-numeric: tabular-nums; }

  .wizard-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: var(--space-5);
  }
  .wizard-nav .btn { min-width: 160px; }

  .receipt-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0 var(--space-4);
  }
  .receipt-submit-row { display: flex; justify-content: center; margin-top: var(--space-2); }
  #receipt-submit-btn { min-width: 160px; }


  #receipt-tax-dropdown,
  #receipt-timezone-dropdown { width: 100%; }
  #receipt-tax-dropdown .dropdown-trigger,
  #receipt-timezone-dropdown .dropdown-trigger { border-radius: var(--radius-pill); }
  #receipt-tax-dropdown .select-badge,
  #receipt-timezone-dropdown .select-badge { display: none; }

  @media (max-width: 948px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    .receipt-grid .form-field { grid-column: span 12 !important; }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-arrow-left"></i></button>
</div>

<div class="page">

  <section class="section" id="card-basic">
    <div class="section-title"><img class="title-icon" src="../assets/icons/clipboard.png" alt=""><h2 data-i18n="admin.detail.basic.title">基本資料</h2></div>

    <div class="avatar-picker">
      <span class="avatar-picker-preview"><img id="edit-avatar-preview" src="" alt=""></span>
      <button type="button" class="btn outline sm" id="edit-avatar-random-btn"><i class="fa-solid fa-fw fa-shuffle"></i> <span data-i18n="admin.common.random">隨機</span></button>
      <button type="button" class="btn outline sm" id="edit-avatar-upload-btn"><i class="fa-solid fa-fw fa-upload"></i> <span data-i18n="admin.common.uploadImage">上傳圖片</span></button>
      <input type="file" id="edit-avatar-file-input" accept="image/*" hidden>
      <div class="status-toggle-wrap">
        <span class="status-toggle-text" id="status-toggle-text" data-i18n="admin.common.enabled">啟用</span>
        <label class="status-toggle">
          <input type="checkbox" id="edit-status-toggle">
          <span class="status-toggle-track"><span class="status-toggle-thumb"></span></span>
        </label>
      </div>
    </div>

    <div class="field-row">
      <div class="form-field">
        <label for="edit-name"><i class="fa-solid fa-fw fa-user"></i> <span data-i18n="admin.field.name">姓名</span></label>
        <input type="text" id="edit-name" class="text-input" maxlength="50">
      </div>
      <div class="form-field">
        <label for="edit-phone"><i class="fa-solid fa-fw fa-phone"></i> <span data-i18n="admin.field.phone">手機</span></label>
        <input type="tel" id="edit-phone" class="text-input" maxlength="15">
      </div>
    </div>
    <div class="field-row">
      <div class="form-field">
        <label for="edit-email"><i class="fa-solid fa-fw fa-envelope"></i> Email</label>
        <input type="email" id="edit-email" class="text-input" maxlength="100">
      </div>
      <div class="form-field">
        <label><i class="fa-solid fa-fw fa-earth-asia"></i> <span data-i18n="admin.field.timezone">時區</span></label>
        <div class="dropdown" id="receipt-timezone-dropdown" data-placeholder="選擇時區">
          <button type="button" class="dropdown-trigger"><span class="label" data-i18n="admin.field.selectTimezone">選擇時區</span><i class="fa-solid fa-fw fa-chevron-down"></i></button>
          <ul class="dropdown-menu">
            <li data-value="UTC+08:00 台北">UTC+08:00 台北<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="UTC+09:00 大阪、札幌、東京">UTC+09:00 大阪、札幌、東京<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="UTC+07:00 河內、胡志明市">UTC+07:00 河內、胡志明市<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="UTC+06:30 仰光">UTC+06:30 仰光<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="form-field">
        <label for="edit-specialty"><i class="fa-solid fa-fw fa-star"></i> <span data-i18n="admin.teachers.field.specialty">專長</span></label>
        <input type="text" id="edit-specialty" class="text-input" data-i18n-placeholder="admin.teachers.field.specialtyPlaceholder" placeholder="例：日文會話・5 年教學經驗" maxlength="100">
      </div>
      <div class="form-field">
        <label for="edit-motto"><i class="fa-solid fa-fw fa-quote-left"></i> <span data-i18n="admin.teachers.field.motto">座右銘</span></label>
        <input type="text" id="edit-motto" class="text-input" data-i18n-placeholder="admin.teachers.field.mottoPlaceholder" placeholder="例：一緒に学び、共に成長していきましょう。" maxlength="200">
      </div>
    </div>

    <div class="wizard-nav">
      <button type="button" class="btn blue" id="edit-submit-btn" disabled><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="admin.common.confirmEdit">確認編輯</span></button>
    </div>
  </section>

  <section class="section" id="card-receipt">
    <div class="section-title"><img class="title-icon" src="../assets/icons/invoice.png" alt=""><h2 data-i18n="admin.teachers.receipt.title">領收書資料</h2></div>

    <div class="receipt-grid">
      <div class="form-field">
        <label for="receipt-address"><i class="fa-solid fa-fw fa-house"></i> <span data-i18n="admin.teachers.receipt.address">老師地址</span></label>
        <input type="text" id="receipt-address" class="text-input" maxlength="200">
      </div>
      <div class="form-field">
        <label for="receipt-company-name"><i class="fa-solid fa-fw fa-building"></i> <span data-i18n="admin.teachers.receipt.companyName">公司名稱</span></label>
        <input type="text" id="receipt-company-name" class="text-input" maxlength="100">
      </div>
      <div class="form-field">
        <label for="receipt-company-address"><i class="fa-solid fa-fw fa-location-dot"></i> <span data-i18n="admin.teachers.receipt.companyAddress">公司地址</span></label>
        <input type="text" id="receipt-company-address" class="text-input" maxlength="200">
      </div>
      <div class="form-field">
        <label for="receipt-wage"><i class="fa-solid fa-fw fa-sack-dollar"></i> <span data-i18n="admin.teachers.receipt.wage">時薪</span></label>
        <input type="text" id="receipt-wage" class="text-input" inputmode="numeric" pattern="[0-9]*" maxlength="10">
      </div>
      <div class="form-field">
        <label><i class="fa-solid fa-fw fa-receipt"></i> <span data-i18n="admin.teachers.receipt.tax">消費稅</span></label>
        <div class="dropdown" id="receipt-tax-dropdown" data-placeholder="選擇稅率">
          <button type="button" class="dropdown-trigger"><span class="label" data-i18n="admin.teachers.receipt.selectTax">選擇稅率</span><i class="fa-solid fa-fw fa-chevron-down"></i></button>
          <ul class="dropdown-menu">
            <li data-value="0%">0%<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="5%">5%<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
            <li data-value="10%">10%<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>
          </ul>
        </div>
      </div>
      <div class="form-field">
        <label for="receipt-bank"><i class="fa-solid fa-fw fa-building-columns"></i> <span data-i18n="admin.teachers.receipt.bank">銀行</span></label>
        <input type="text" id="receipt-bank" class="text-input" maxlength="50">
      </div>
      <div class="form-field">
        <label for="receipt-bank-branch"><i class="fa-solid fa-fw fa-building"></i> <span data-i18n="admin.teachers.receipt.bankBranch">支店名</span></label>
        <input type="text" id="receipt-bank-branch" class="text-input" maxlength="50">
      </div>
      <div class="form-field">
        <label for="receipt-bank-branch-no"><i class="fa-solid fa-fw fa-hashtag"></i> <span data-i18n="admin.teachers.receipt.bankBranchNo">店番</span></label>
        <input type="text" id="receipt-bank-branch-no" class="text-input" maxlength="10">
      </div>
      <div class="form-field">
        <label for="receipt-bank-account-no"><i class="fa-solid fa-fw fa-credit-card"></i> <span data-i18n="admin.teachers.receipt.bankAccountNo">口座番号</span></label>
        <input type="text" id="receipt-bank-account-no" class="text-input" maxlength="20">
      </div>
    </div>

    <div class="receipt-submit-row">
      <button type="button" class="btn blue" id="receipt-submit-btn" disabled><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="admin.common.confirmEdit">確認編輯</span></button>
    </div>
  </section>

</div>

<div class="modal-overlay" id="basicInfoAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="basicInfoAlertText"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editSuccessModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-check"></i></div>
    <h3 data-i18n="admin.teachers.updateSuccess">已更新老師資料</h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="leaveConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3 data-i18n="booking.leaveConfirm.title">確定要離開嗎？</h3>
    <p class="text-small" data-i18n="admin.common.unsavedEditDesc">目前修改的資料將不會保留。</p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="confirm-leave-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="booking.leaveConfirm.confirm">確定離開</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="avatarCropModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" id="avatar-crop-close-btn"><i class="fa-solid fa-fw fa-xmark"></i></button>
    <h3 data-i18n="admin.common.cropAvatar.title">裁切頭像</h3>
    <p class="text-small" data-i18n="admin.common.cropAvatar.desc">拖曳移動、滾輪縮放，裁切範圍固定為正方形。</p>
    <div class="crop-container">
      <img id="avatar-crop-image" alt="">
    </div>
    <div class="modal-actions">
      <button class="btn outline" id="avatar-crop-cancel-btn" style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn blue" id="avatar-crop-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="admin.common.confirmCrop">確認裁切</span></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());

  const teacherId = Number(new URLSearchParams(window.location.search).get('id'));
  const teachers = await fetch('/api/teachers').then((res) => (res.ok ? res.json() : []));
  const teacher = teachers.find((t) => t.id === teacherId);

  if (!teacher) {
    window.location.href = 'teachers.html';
  } else {
    let currentAvatar = teacher.avatar;

    function formatPhoneDisplay(digits) {
      const clean = (digits || '').replace(/\D/g, '');
      return clean.length === 10 ? `${clean.slice(0, 4)}-${clean.slice(4, 7)}-${clean.slice(7)}` : digits;
    }

    document.getElementById('edit-name').value = teacher.name;
    document.getElementById('edit-phone').value = formatPhoneDisplay(teacher.phone);
    document.getElementById('edit-email').value = teacher.email;
    document.getElementById('edit-specialty').value = teacher.specialty || '';
    document.getElementById('edit-motto').value = teacher.motto || '';
    document.getElementById('edit-avatar-preview').src = avatarSrc(currentAvatar);
    function setStatusToggle(isActive) {
      document.getElementById('edit-status-toggle').checked = isActive;
      document.getElementById('status-toggle-text').textContent = isActive ? t('admin.common.enabled') : t('admin.common.disabled');
      document.querySelector('.avatar-picker-preview').classList.toggle('is-inactive', !isActive);
    }
    setStatusToggle(teacher.status !== 'inactive');
    document.getElementById('edit-status-toggle').addEventListener('change', (e) => {
      setStatusToggle(e.target.checked);
    });

    // 換頭像不是表單欄位的輸入事件，要自己通知基本資料的「確認編輯」重新比對（watchForm 設定好後會換成真的 refresh）
    let refreshBasicSubmit = () => {};

    function setAvatar(newAvatar) {
      currentAvatar = newAvatar;
      refreshBasicSubmit();
      const avatarImg = document.getElementById('edit-avatar-preview');
      avatarImg.src = avatarSrc(currentAvatar);
      avatarImg.classList.remove('avatar-swap');
      void avatarImg.offsetWidth;
      avatarImg.classList.add('avatar-swap');
    }

    // 上傳完成後把 currentAvatar 換成 R2 路徑，畫面上是同一張圖，不需要再播一次切換動畫
    function setAvatarQuiet(newAvatar) {
      currentAvatar = newAvatar;
      refreshBasicSubmit();
    }

    document.getElementById('edit-avatar-random-btn').addEventListener('click', () => {
      setAvatar(randomAvatar());
    });

    // ---- 上傳圖片並裁切成正方形頭像 ----
    const CROP_OUTPUT_SIZE = 400; // 輸出固定 400x400，避免存進 localStorage/未來 D1 的圖片太大
    let cropper = null;

    function closeCropModal() {
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById('avatarCropModal').classList.remove('open');
      document.getElementById('edit-avatar-file-input').value = '';
    }

    document.getElementById('edit-avatar-upload-btn').addEventListener('click', () => {
      document.getElementById('edit-avatar-file-input').click();
    });

    document.getElementById('edit-avatar-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = document.getElementById('avatar-crop-image');
        img.src = reader.result;
        document.getElementById('avatarCropModal').classList.add('open');
        img.onload = () => {
          if (cropper) cropper.destroy();
          cropper = new Cropper(img, {
            aspectRatio: 1,
            viewMode: 1,
            dragMode: 'move',
            guides: true,
            autoCropArea: 1,
            background: false,
          });
        };
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('avatar-crop-confirm-btn').addEventListener('click', () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ width: CROP_OUTPUT_SIZE, height: CROP_OUTPUT_SIZE });
      setAvatar(canvas.toDataURL('image/jpeg', 0.8)); // 先本地預覽，上傳完成後再換成 R2 的相對路徑
      canvas.toBlob((blob) => {
        if (!blob) return;
        fetch(`/api/avatar/upload?role=teacher&id=${teacherId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'image/jpeg' },
          body: blob,
        })
          .then((res) => (res.ok ? res.json() : Promise.reject(res)))
          .then((data) => { setAvatarQuiet(data.path); teacher.avatar = data.path; })
          .catch((err) => console.warn('頭像上傳失敗，暫時沿用本地預覽', err));
      }, 'image/jpeg', 0.8);
      closeCropModal();
    });

    document.getElementById('avatar-crop-cancel-btn').addEventListener('click', closeCropModal);
    document.getElementById('avatar-crop-close-btn').addEventListener('click', closeCropModal);

    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function showBasicAlert(message) {
      document.getElementById('basicInfoAlertText').textContent = message;
      document.getElementById('basicInfoAlertModal').classList.add('open');
    }

    // PATCH /api/teachers 是部分更新，但 receipt 在後端是單一 JSON 欄位、整包覆蓋，
    // 不會像其他欄位一樣逐一合併——所以呼叫端如果只想改 receipt 裡的一個欄位，
    // 一定要連同其餘既有的 receipt 欄位一起送出，否則會把其他欄位洗掉。
    async function patchTeacher(fields) {
      const res = await fetch(`/api/teachers?id=${teacher.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fields),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        return { ok: false, error: data.error || t('admin.common.saveFailed') };
      }
      Object.assign(teacher, fields);
      return { ok: true };
    }

    document.getElementById('edit-submit-btn').addEventListener('click', async () => {
      const name = document.getElementById('edit-name').value.trim();
      const phone = document.getElementById('edit-phone').value.trim().replace(/\D/g, '');
      const email = document.getElementById('edit-email').value.trim();

      if (!name) {
        showBasicAlert(t('admin.teachers.fillNameRequired'));
        return;
      }
      if (email && !EMAIL_RE.test(email)) {
        showBasicAlert(t('admin.common.invalidEmail'));
        return;
      }

      const result = await patchTeacher({
        name,
        phone,
        email,
        specialty: document.getElementById('edit-specialty').value.trim(),
        motto: document.getElementById('edit-motto').value.trim(),
        avatar: currentAvatar,
        status: document.getElementById('edit-status-toggle').checked ? 'active' : 'inactive',
        receipt: { ...(teacher.receipt || {}), timezone: getDropdownValue('receipt-timezone-dropdown') },
      });
      if (!result.ok) {
        showBasicAlert(result.error);
        return;
      }
      document.getElementById('edit-phone').value = formatPhoneDisplay(phone);
      document.getElementById('editSuccessModal').classList.add('open');
      savedBasicSnapshot = getBasicSnapshot();
      refreshBasicSubmit();
    });

    teacher.receipt = teacher.receipt || {};
    document.getElementById('receipt-address').value = teacher.receipt.address || '';
    document.getElementById('receipt-company-name').value = teacher.receipt.companyName || '';
    document.getElementById('receipt-company-address').value = teacher.receipt.companyAddress || '';
    document.getElementById('receipt-wage').value = teacher.receipt.wage || '';
    document.getElementById('receipt-bank').value = teacher.receipt.bank || '';
    document.getElementById('receipt-bank-branch').value = teacher.receipt.bankBranch || '';
    document.getElementById('receipt-bank-branch-no').value = teacher.receipt.bankBranchNo || '';
    document.getElementById('receipt-bank-account-no').value = teacher.receipt.bankAccountNo || '';
    setDropdownValue('receipt-tax-dropdown', teacher.receipt.taxRate || '0%');
    setDropdownValue('receipt-timezone-dropdown', teacher.receipt.timezone || 'UTC+09:00 大阪、札幌、東京');

    document.getElementById('receipt-wage').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    document.getElementById('receipt-submit-btn').addEventListener('click', async () => {
      const result = await patchTeacher({
        receipt: {
          address: document.getElementById('receipt-address').value.trim(),
          companyName: document.getElementById('receipt-company-name').value.trim(),
          companyAddress: document.getElementById('receipt-company-address').value.trim(),
          wage: document.getElementById('receipt-wage').value.trim(),
          taxRate: getDropdownValue('receipt-tax-dropdown'),
          timezone: getDropdownValue('receipt-timezone-dropdown'),
          bank: document.getElementById('receipt-bank').value.trim(),
          bankBranch: document.getElementById('receipt-bank-branch').value.trim(),
          bankBranchNo: document.getElementById('receipt-bank-branch-no').value.trim(),
          bankAccountNo: document.getElementById('receipt-bank-account-no').value.trim(),
        },
      });
      if (!result.ok) {
        showBasicAlert(result.error);
        return;
      }
      document.getElementById('editSuccessModal').classList.add('open');
      savedReceiptSnapshot = getReceiptSnapshot();
      refreshReceiptSubmit();
    });

    // 基本資料、領收書資料兩個區塊各自有「確認編輯」、各自儲存，所以「有沒有改過」也要分開記：
    // 存了其中一塊，另一塊還沒存的修改不能被當成已儲存（離開頁面時也還要提醒）。
    function getBasicSnapshot() {
      return JSON.stringify({
        avatar: currentAvatar,
        name: document.getElementById('edit-name').value,
        phone: document.getElementById('edit-phone').value,
        email: document.getElementById('edit-email').value,
        specialty: document.getElementById('edit-specialty').value,
        motto: document.getElementById('edit-motto').value,
        status: document.getElementById('edit-status-toggle').checked,
        timezone: getDropdownValue('receipt-timezone-dropdown'),
      });
    }
    function getReceiptSnapshot() {
      return JSON.stringify({
        address: document.getElementById('receipt-address').value,
        companyName: document.getElementById('receipt-company-name').value,
        companyAddress: document.getElementById('receipt-company-address').value,
        wage: document.getElementById('receipt-wage').value,
        taxRate: getDropdownValue('receipt-tax-dropdown'),
        bank: document.getElementById('receipt-bank').value,
        bankBranch: document.getElementById('receipt-bank-branch').value,
        bankBranchNo: document.getElementById('receipt-bank-branch-no').value,
        bankAccountNo: document.getElementById('receipt-bank-account-no').value,
      });
    }

    let savedBasicSnapshot = getBasicSnapshot();
    let savedReceiptSnapshot = getReceiptSnapshot();
    const isBasicDirty = () => getBasicSnapshot() !== savedBasicSnapshot;
    const isReceiptDirty = () => getReceiptSnapshot() !== savedReceiptSnapshot;

    // 各區塊資料跟上次儲存的不一樣，那一塊的「確認編輯」才能按（改回原樣會再變回停用；從停用變成可按時跳一下）
    refreshBasicSubmit = watchForm(document.getElementById('card-basic'), document.getElementById('edit-submit-btn'), isBasicDirty);
    const refreshReceiptSubmit = watchForm(document.getElementById('card-receipt'), document.getElementById('receipt-submit-btn'), isReceiptDirty);

    document.getElementById('back-btn').addEventListener('click', () => {
      if (isBasicDirty() || isReceiptDirty()) {
        document.getElementById('leaveConfirmModal').classList.add('open');
        return;
      }
      window.location.href = `teacher-detail.html?id=${teacherId}`;
    });

    document.getElementById('confirm-leave-btn').addEventListener('click', () => {
      window.location.href = `teacher-detail.html?id=${teacherId}`;
    });
  }
})();
</script>

</body>
</html>
