<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 學生購買課程</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 848px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  #card-add-course,
  #card-courses {
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .course-row {
    position: relative;
    border: 3px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    padding: var(--space-4) var(--space-5);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .course-row:hover { border-color: var(--color-blue); }
  .course-row h4 { margin: 0 0 8px; line-height: 1.4; }
  .course-row.has-ribbon h4 { padding-right: 56px; }
  .course-count { margin: 0; color: var(--text-muted); font-size: var(--fs-small); line-height: 1.4; }
  .course-count-value { font-variant-numeric: tabular-nums; }

  #course-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-3);
  }

  #add-course-dropdown {
    width: 360px;
  }
  #add-course-dropdown .dropdown-trigger {
    width: 100%;
    border-radius: var(--radius-lg);
  }
  #add-course-dropdown .select-badge {
    display: none;
  }
  /* 選課程／堂數／新增按鈕直向排列成三行，欄位一多擠在同一行會太窄 */
  .course-add-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-3);
  }
  .course-add-sessions-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  /* 堂數：選了課程後帶入該課程的預設堂數，可以針對這位學生調整 */
  .course-sessions-input { display: flex; align-items: center; gap: var(--space-2); flex: none; }
  .course-sessions-input .text-input { width: 120px; text-align: center; font-variant-numeric: tabular-nums; }
  .course-sessions-input span { color: var(--text-muted); font-size: var(--fs-small); }
  @media (min-width: 641px) {
    #add-course-dropdown .dropdown-menu {
      right: auto;
      width: 480px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
    }
    #add-course-dropdown.open .dropdown-menu {
      max-height: 500px;
      overflow-y: hidden;
    }
  }

  .booking-card-empty { min-height: 138px; }

  /* 動作按鈕：跟請求書頁的卡片一樣，排在課程資訊下面自己一整排，按鈕多也不會擠 */
  .course-row-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }

  /* 修改總堂數視窗的輸入框置中 */
  .edit-sessions-input { justify-content: center; margin: var(--space-4) 0 var(--space-3); }

  /* 補償一堂的原因輸入框：跟其他 modal 的 text-input 同寬，但要能多打幾行字 */
  #compensate-session-reason { width: 100%; resize: vertical; margin: var(--space-3) 0; font-family: inherit; }

  /* 補償紀錄清單：一筆一筆列出來，跟其他資訊區塊隔開 */
  #adjustment-history-list { margin-top: var(--space-3); max-height: 320px; overflow-y: auto; }
  .adjustment-row { padding: var(--space-3) 0; border-bottom: 1px solid var(--border-color, #eee); }
  .adjustment-row:last-child { border-bottom: none; }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #course-list {
      grid-template-columns: 1fr;
    }
    .course-add-row {
      align-items: stretch;
    }
    .course-add-row .dropdown {
      width: 100%;
    }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-arrow-left"></i></button>
</div>

<div class="page">

  <section class="section" id="card-add-course">
    <div class="section-title"><img class="title-icon" src="../assets/icons/add-event.png" alt=""><h2 data-i18n="admin.courses.addNew">新增課程</h2></div>

    <div class="course-add-row">
      <div class="dropdown" id="add-course-dropdown" data-placeholder="選擇課程">
        <button type="button" class="dropdown-trigger"><span class="label" data-i18n="admin.teachers.courses.selectPlaceholder">選擇課程</span><span class="arrow"></span></button>
        <ul class="dropdown-menu" id="add-course-menu"></ul>
      </div>
      <div class="course-add-sessions-row">
        <div class="course-sessions-input">
          <input type="text" id="add-course-attended" class="text-input" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-i18n-placeholder="admin.students.courses.attendedPlaceholder" placeholder="已上課" data-i18n-aria-label="admin.students.courses.attendedSessions" aria-label="已上課堂數">
          <span data-i18n="admin.common.sessionUnit">堂</span>
        </div>
      </div>
      <button type="button" class="btn butter" id="add-course-btn" disabled><i class="fa-solid fa-fw fa-plus"></i> <span data-i18n="admin.courses.addNew">新增課程</span></button>
    </div>
  </section>

  <section class="section" id="card-courses">
    <div class="section-title"><img class="title-icon" src="../assets/icons/invoice.png" alt=""><h2 data-i18n="admin.students.courses.title">已購買課程</h2></div>
    <div id="course-list"></div>
  </section>

</div>

<div class="modal-overlay" id="basicInfoAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="basicInfoAlertText"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addCourseConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-graduation-cap"></i></div>
    <h3 data-i18n="admin.students.courses.addConfirm.title">確定新增這門課程嗎？</h3>
    <p class="text-small" id="addCourseConfirmName"></p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn green" id="add-course-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="admin.teachers.courses.addConfirm.confirm">確定新增</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteCourseConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-trash"></i></div>
    <h3 data-i18n="admin.students.courses.deleteConfirm.title">確定要刪除這門課程嗎？</h3>
    <p class="text-small" id="deleteCourseConfirmName"></p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="delete-course-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-trash"></i> <span data-i18n="admin.teachers.courses.deleteConfirm.confirm">確定刪除</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editSessionsModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-fw fa-pen-to-square"></i></div>
    <h3 data-i18n="admin.students.courses.editModal.title">修改總堂數</h3>
    <p class="text-small" id="editSessionsCourseName"></p>
    <div class="course-sessions-input edit-sessions-input">
      <input type="text" id="edit-sessions-input" class="text-input" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-i18n-aria-label="admin.students.courses.sessions" aria-label="堂數">
      <span data-i18n="admin.common.sessionUnit">堂</span>
    </div>
    <p class="text-small" id="editSessionsDesc"></p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn blue" id="edit-sessions-confirm-btn" style="flex:1;" disabled><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="admin.common.confirmEdit">確認編輯</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="compensateSessionModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-fw fa-gift"></i></div>
    <h3 data-i18n="admin.students.courses.compensateModal.title">補償一堂</h3>
    <p class="text-small" id="compensateSessionCourseName"></p>
    <p class="text-small" data-i18n="admin.students.courses.compensateModal.desc">請填寫原因（例如：上課中途停電、老師臨時身體不適），方便日後查詢</p>
    <textarea id="compensate-session-reason" class="text-input" rows="3" data-i18n-placeholder="admin.students.courses.compensateModal.placeholder" placeholder="補償原因"></textarea>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn green" id="compensate-session-confirm-btn" style="flex:1;" disabled><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="admin.students.courses.compensateModal.confirm">確認補償</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="adjustmentHistoryModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-fw fa-clock-rotate-left"></i></div>
    <h3 data-i18n="admin.students.courses.adjustmentHistory.title">補償紀錄</h3>
    <p class="text-small" id="adjustmentHistoryCourseName"></p>
    <div id="adjustment-history-list" style="text-align:left;"></div>
  </div>
</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());

  const studentId = Number(new URLSearchParams(window.location.search).get('id'));
  const [students, courses] = await Promise.all([
    fetch('/api/students').then((res) => (res.ok ? res.json() : [])),
    fetch('/api/courses').then((res) => (res.ok ? res.json() : [])),
  ]);
  const student = students.find((s) => s.id === studentId);

  if (!student) {
    window.location.href = 'students.html';
    return;
  }

  // 這個學生已購買的課程是真正的 D1 資料（見 /api/students/courses），這裡在
  // 載入時抓一次存進 student.courses，之後新增/刪除都直接改這份記憶體副本再重繪。
  student.courses = await fetch(`/api/students/courses?studentId=${studentId}`).then((res) => (res.ok ? res.json() : []));

  // 「選擇課程」下拉選單改抓真正的課程目錄（/api/courses），不再用寫死的清單。
  // 這裡手動插入 <li> 並自行綁定點擊事件，因為 script.js 裡的下拉選單綁定邏輯
  // 是在頁面一載入就跑過一次了，那時候這個清單都還是空的。
  const addCourseMenu = document.getElementById('add-course-menu');
  addCourseMenu.innerHTML = courses.map((c) => `<li data-value="${escapeHtml(c.name)}">${escapeHtml(c.name)}<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>`).join('');
  addCourseMenu.querySelectorAll('li').forEach((item) => {
    item.addEventListener('click', () => {
      addCourseMenu.querySelectorAll('li').forEach((li) => li.classList.remove('selected'));
      item.classList.add('selected');
      document.querySelector('#add-course-dropdown .dropdown-trigger .label').textContent = item.dataset.value;
      document.getElementById('add-course-dropdown').classList.remove('open');
      refreshAddCourseBtn();
    });
  });

  // 總堂數不在這裡填，直接用課程詳細資料裡設定的堂數（目前都是 16 堂）
  function getSelectedCourseTotal() {
    const name = getDropdownValue('add-course-dropdown');
    const course = courses.find((c) => c.name === name);
    return (course && course.defaultSessions) || 16;
  }

  // 已上課堂數：從別的系統（例如 M365 Bookings）轉過來、已經上過幾堂課的學生，新增課程時可以
  // 直接帶入已上過的堂數；留空就是全新的學生，從 0 堂開始。跟總堂數一樣的堂數就是已完成的課程。
  const attendedInput = document.getElementById('add-course-attended');
  function getAttendedValue() {
    if (attendedInput.value === '') return 0;
    const n = Number(attendedInput.value);
    const total = getSelectedCourseTotal();
    return Number.isInteger(n) && n >= 0 && n <= total ? n : null;
  }
  attendedInput.addEventListener('input', () => {
    attendedInput.value = attendedInput.value.replace(/[^0-9]/g, '');
    refreshAddCourseBtn();
  });

  // 選了課程、已上課堂數也有效，「新增課程」才能按（從停用變成可按時跳一下）
  function refreshAddCourseBtn() {
    setButtonEnabled(document.getElementById('add-course-btn'), !!getDropdownValue('add-course-dropdown') && getAttendedValue() !== null);
  }

  function resetCourseDropdown() {
    const dropdown = document.getElementById('add-course-dropdown');
    dropdown.querySelectorAll('.dropdown-menu li.selected').forEach((li) => li.classList.remove('selected'));
    dropdown.querySelector('.dropdown-trigger .label').textContent = t('admin.teachers.courses.selectPlaceholder');
    attendedInput.value = '';
    refreshAddCourseBtn();
  }

  function updateCourseDropdownOptions() {
    const purchasedNames = new Set(student.courses.map((c) => c.name));
    addCourseMenu.querySelectorAll('li').forEach((li) => {
      li.hidden = purchasedNames.has(li.dataset.value);
    });
  }

  function showAlert(message) {
    document.getElementById('basicInfoAlertText').textContent = message;
    document.getElementById('basicInfoAlertModal').classList.add('open');
  }

  // attended/booked 是伺服器算好的 "N/D" 字串，D 是這筆的總堂數
  function courseCounts(c) {
    const [booked, total] = (c.booked || '0/16').split('/').map(Number);
    const attended = parseInt((c.attended || '0/16').split('/')[0], 10);
    return { booked, attended, total };
  }

  function renderCourses() {
    const listEl = document.getElementById('course-list');
    listEl.innerHTML = student.courses.length
      ? student.courses.map((c) => {
          const { booked: bookedNum, attended: attendedNum, total: totalSessions } = courseCounts(c);
          const isComplete = bookedNum >= totalSessions && attendedNum >= totalSessions;
          const isEmpty = bookedNum === 0 && attendedNum === 0;
          const ribbon = isComplete
            ? `<span class="ribbon-clip"><span class="course-ribbon tone-green">${t('status.attended')}</span></span>`
            : (!isEmpty ? `<span class="ribbon-clip"><span class="course-ribbon tone-blue">${t('admin.students.courses.inProgress')}</span></span>` : '');
          // 還沒有任何預約／上課紀錄時，這門課等於還沒開始用，只能刪除；
          // 開始預約／上課之後才有東西可以改／補償／查看，這時候就不能再刪除了
          const editBtn = `<button type="button" class="btn sm blue course-edit-btn" data-id="${c.id}"${isEmpty ? ' disabled' : ''}><i class="fa-solid fa-fw fa-pen-to-square"></i> ${t('admin.students.courses.edit')}</button>`;
          const compensateBtn = `<button type="button" class="btn sm outline course-compensate-btn" data-id="${c.id}"${isEmpty ? ' disabled' : ''}><i class="fa-solid fa-fw fa-gift"></i> ${t('admin.students.courses.compensate')}</button>`;
          const historyBtn = `<button type="button" class="btn sm outline course-history-btn" data-id="${c.id}"${isEmpty ? ' disabled' : ''}><i class="fa-solid fa-fw fa-clock-rotate-left"></i> ${t('admin.students.courses.viewHistory')}</button>`;
          const deleteBtn = `<button type="button" class="btn sm red course-delete-btn" data-id="${c.id}"${isEmpty ? '' : ' disabled'}><i class="fa-solid fa-fw fa-trash"></i> ${t('hours.delete')}</button>`;
          const counts = `<p class="course-count">${t('booking.quota.booked')}<b class="course-count-value">${c.booked}</b></p><p class="course-count">${t('booking.quota.attended')}<b class="course-count-value">${c.attended}</b></p>`;
          return `<div class="course-row${ribbon ? ' has-ribbon' : ''}">
            ${ribbon}
            <h4>${escapeHtml(c.name)}</h4>
            ${counts}
            <div class="course-row-actions">${editBtn}${compensateBtn}${historyBtn}${deleteBtn}</div>
          </div>`;
        }).join('')
      : `<div class="booking-card-empty">${t('admin.students.courses.empty')}</div>`;
    listEl.querySelectorAll('.course-row, .booking-card-empty').forEach((card) => applyTiltEffect(card));
    listEl.querySelectorAll('.course-edit-btn').forEach((btn) => {
      btn.addEventListener('click', () => openEditSessions(Number(btn.dataset.id)));
    });
    listEl.querySelectorAll('.course-compensate-btn').forEach((btn) => {
      btn.addEventListener('click', () => openCompensateSession(Number(btn.dataset.id)));
    });
    listEl.querySelectorAll('.course-history-btn').forEach((btn) => {
      btn.addEventListener('click', () => openAdjustmentHistory(Number(btn.dataset.id)));
    });
    listEl.querySelectorAll('.course-delete-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        pendingDeleteCourseId = Number(btn.dataset.id);
        const course = student.courses.find((c) => c.id === pendingDeleteCourseId);
        document.getElementById('deleteCourseConfirmName').textContent = course ? course.name : '';
        document.getElementById('deleteCourseConfirmModal').classList.add('open');
      });
    });
    updateCourseDropdownOptions();
  }

  let pendingDeleteCourseId = null;
  document.getElementById('delete-course-confirm-btn').addEventListener('click', async () => {
    if (pendingDeleteCourseId == null) return;
    const id = pendingDeleteCourseId;
    const res = await fetch(`/api/students/courses?studentId=${studentId}&id=${id}`, { method: 'DELETE' });
    document.getElementById('deleteCourseConfirmModal').classList.remove('open');
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showAlert(apiErrorMessage(data, 'admin.common.deleteFailed'));
      return;
    }
    student.courses = student.courses.filter((c) => c.id !== id);
    pendingDeleteCourseId = null;
    renderCourses();
  });

  // 修改總堂數：不能少於已預約的堂數（後端也會擋），跟原本一樣就不用送出
  const editSessionsInput = document.getElementById('edit-sessions-input');
  const editSessionsConfirmBtn = document.getElementById('edit-sessions-confirm-btn');
  let pendingEditCourseId = null;

  function getEditSessionsValue() {
    const course = student.courses.find((c) => c.id === pendingEditCourseId);
    if (!course) return null;
    const { booked, total } = courseCounts(course);
    const n = Number(editSessionsInput.value);
    return Number.isInteger(n) && n >= Math.max(1, booked) && n <= 999 && n !== total ? n : null;
  }

  function openEditSessions(id) {
    const course = student.courses.find((c) => c.id === id);
    if (!course) return;
    pendingEditCourseId = id;
    const { booked, attended, total } = courseCounts(course);
    document.getElementById('editSessionsCourseName').textContent = course.name;
    document.getElementById('editSessionsDesc').textContent = t('admin.students.courses.editModal.desc', { booked, attended });
    editSessionsInput.value = total;
    setButtonEnabled(editSessionsConfirmBtn, false);
    document.getElementById('editSessionsModal').classList.add('open');
    // 視窗淡入（visibility 過場）剛開始的那一刻還算隱藏，這時 focus 會失敗，所以稍等一下
    setTimeout(() => {
      editSessionsInput.focus();
      editSessionsInput.select();
    }, 50);
  }

  editSessionsInput.addEventListener('input', () => {
    editSessionsInput.value = editSessionsInput.value.replace(/[^0-9]/g, '');
    setButtonEnabled(editSessionsConfirmBtn, getEditSessionsValue() !== null);
  });
  editSessionsInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !editSessionsConfirmBtn.disabled) editSessionsConfirmBtn.click();
  });

  editSessionsConfirmBtn.addEventListener('click', async () => {
    const totalSessions = getEditSessionsValue();
    if (pendingEditCourseId == null || totalSessions === null) return;
    const id = pendingEditCourseId;
    setButtonEnabled(editSessionsConfirmBtn, false);
    const res = await fetch(`/api/students/courses?studentId=${studentId}&id=${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ totalSessions }),
    });
    document.getElementById('editSessionsModal').classList.remove('open');
    pendingEditCourseId = null;
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showAlert(apiErrorMessage(data, 'admin.common.saveFailed'));
      // 例如開著視窗時學生又預約了幾堂：重新讀一次，畫面上的已預約堂數才會是最新的
      const fresh = await fetch(`/api/students/courses?studentId=${studentId}`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
      if (fresh) {
        student.courses = fresh;
        renderCourses();
      }
      return;
    }
    const updated = await res.json();
    student.courses = student.courses.map((c) => (c.id === id ? updated : c));
    renderCourses();
  });

  // 補償一堂：不是學生的問題中斷課堂時，總堂數 +1，原因一定要填，後端會存進
  // student_course_adjustments，之後在「查看紀錄」找得到
  const compensateReasonInput = document.getElementById('compensate-session-reason');
  const compensateConfirmBtn = document.getElementById('compensate-session-confirm-btn');
  let pendingCompensateCourseId = null;

  function openCompensateSession(id) {
    const course = student.courses.find((c) => c.id === id);
    if (!course) return;
    pendingCompensateCourseId = id;
    document.getElementById('compensateSessionCourseName').textContent = course.name;
    compensateReasonInput.value = '';
    setButtonEnabled(compensateConfirmBtn, false);
    document.getElementById('compensateSessionModal').classList.add('open');
    setTimeout(() => compensateReasonInput.focus(), 50);
  }

  compensateReasonInput.addEventListener('input', () => {
    setButtonEnabled(compensateConfirmBtn, compensateReasonInput.value.trim() !== '');
  });

  compensateConfirmBtn.addEventListener('click', async () => {
    const reason = compensateReasonInput.value.trim();
    if (pendingCompensateCourseId == null || !reason) return;
    const id = pendingCompensateCourseId;
    setButtonEnabled(compensateConfirmBtn, false);
    const res = await fetch(`/api/students/courses/compensate?studentId=${studentId}&id=${id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason }),
    });
    document.getElementById('compensateSessionModal').classList.remove('open');
    pendingCompensateCourseId = null;
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showAlert(apiErrorMessage(data, 'admin.common.saveFailed'));
      return;
    }
    const updated = await res.json();
    student.courses = student.courses.map((c) => (c.id === id ? updated : c));
    renderCourses();
  });

  // 查看紀錄：這門課過去所有補償堂數的原因、時間、操作的管理者
  function formatAdjustmentTime(iso) {
    const d = new Date(iso.replace(' ', 'T') + '+08:00');
    return new Intl.DateTimeFormat(DATE_LOCALE_MAP[i18nLang] || 'zh-TW', { dateStyle: 'medium', timeStyle: 'short' }).format(d);
  }

  async function openAdjustmentHistory(id) {
    const course = student.courses.find((c) => c.id === id);
    if (!course) return;
    document.getElementById('adjustmentHistoryCourseName').textContent = course.name;
    const listEl = document.getElementById('adjustment-history-list');
    listEl.innerHTML = `<p class="text-small">…</p>`;
    document.getElementById('adjustmentHistoryModal').classList.add('open');
    const res = await fetch(`/api/students/courses/adjustments?studentId=${studentId}&id=${id}`);
    const rows = res.ok ? await res.json() : [];
    listEl.innerHTML = rows.length
      ? rows.map((r) => `<div class="adjustment-row">
          <p class="text-small"><b>+${r.sessions_delta}</b> ${t('admin.common.sessionUnit')} · ${escapeHtml(formatAdjustmentTime(r.created_at))} · ${escapeHtml(r.created_by)}</p>
          <p class="text-small">${escapeHtml(r.reason)}</p>
        </div>`).join('')
      : `<p class="text-small">${t('admin.students.courses.adjustmentHistory.empty')}</p>`;
  }

  let pendingCourseName = null;
  let pendingSessions = null;
  let pendingAttended = null;

  document.getElementById('add-course-btn').addEventListener('click', () => {
    const value = getDropdownValue('add-course-dropdown');
    if (!value) {
      showAlert(t('admin.teachers.courses.selectFirst'));
      return;
    }
    const sessions = getSelectedCourseTotal();
    const attended = getAttendedValue();
    if (attended === null) {
      showAlert(t('admin.students.courses.invalidAttended', { n: sessions }));
      return;
    }
    pendingCourseName = value;
    pendingSessions = sessions;
    pendingAttended = attended;
    document.getElementById('addCourseConfirmName').textContent = attended > 0
      ? t('admin.students.courses.withSessionsAttended', { name: value, n: sessions, attended })
      : t('admin.students.courses.withSessions', { name: value, n: sessions });
    document.getElementById('addCourseConfirmModal').classList.add('open');
  });

  document.getElementById('add-course-confirm-btn').addEventListener('click', async () => {
    if (!pendingCourseName) return;
    const res = await fetch(`/api/students/courses?studentId=${studentId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ courseName: pendingCourseName, totalSessions: pendingSessions, attendedCount: pendingAttended }),
    });
    document.getElementById('addCourseConfirmModal').classList.remove('open');
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      pendingCourseName = null;
      showAlert(apiErrorMessage(data, 'hours.error.addFailed'));
      return;
    }
    const created = await res.json();
    student.courses.push(created);
    pendingCourseName = null;
    resetCourseDropdown();
    renderCourses();
  });

  renderCourses();

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = `student-detail.html?id=${studentId}`;
  });
})();
</script>

</body>
</html>
