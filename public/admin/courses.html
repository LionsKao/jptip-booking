<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 課程管理</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 1000px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  #course-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
  }
  @keyframes courseCardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #course-cards .course-list-card,
  #course-cards .course-list-card-empty,
  #course-cards .course-add-card {
    animation: courseCardIn .3s ease backwards;
  }
  #course-cards .course-list-card:nth-child(2n) {
    animation-delay: .04s;
  }

  .course-list-card {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .course-list-card:hover { border-color: var(--color-blue); }
  .course-list-card-empty { min-height: 88px; }
  .course-add-card {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-weight: 700;
    font-size: 1.0625rem;
    color: var(--color-blue);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .course-add-card:hover { border-color: var(--color-blue); }
  .course-add-card .add-icon {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: block;
  }
  .course-list-card-image {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg-card-alt);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .course-list-card-image img { width: 100%; height: 100%; object-fit: cover; }
  .course-list-card-badge {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 1.0625rem;
    font-family: var(--font-en);
    font-variant-numeric: tabular-nums;
  }
  .course-list-card h4 { margin: 0; font-size: 1.125rem; }

  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #course-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house"></i></button>
</div>

<div class="page">

  <section class="section">
    <div class="section-title"><img class="title-icon" src="../assets/icons/books.png" alt=""><h2 data-i18n="admin.dash.courses.title">課程管理</h2></div>
    <div class="search-box">
      <i class="fa-solid fa-fw fa-magnifying-glass"></i>
      <input type="text" id="course-search" data-i18n-placeholder="admin.courses.searchPlaceholder" placeholder="搜尋課程名稱">
      <button type="button" class="search-clear-btn" id="course-search-clear" hidden data-i18n-aria-label="admin.common.clearSearch" aria-label="清除搜尋"><i class="fa-solid fa-fw fa-xmark"></i></button>
    </div>
    <div id="course-cards"></div>
  </section>

  <div class="page-nav">
    <div class="pagination" id="course-pagination"></div>
  </div>

</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());

  const SEARCH_KEY = 'admin-course-search';

  // 課程是真正的 D1 資料（見 /api/courses），這裡整頁只在載入時抓一次，
  // 之後搜尋/分頁都是在這份記憶體內的副本上做，不用每次都重打 API。
  const courses = await fetch('/api/courses').then((res) => (res.ok ? res.json() : []));

  // 沒有上傳自訂圖片時，用課程名稱裡的級數（J1、J2...）自動配色，顏色跟 student/booking.html 選課步驟的 course-tag 彩虹配色一致；
  // 商務日文系列沒有 J 級數，固定用鐵灰色＋「商」字
  function courseBadge(name) {
    const match = name.match(/J(\d+)/);
    if (match) return { label: `J${match[1]}`, color: `var(--level-j${match[1]})` };
    return { label: '商', color: 'var(--color-steel)' };
  }

  const coursePageState = { page: 1 };

  function renderCourseCard(c) {
    let badge;
    if (c.image) {
      badge = `<img src="${escapeHtml(courseImageSrc(c.image))}" alt="">`;
    } else {
      const b = courseBadge(c.name);
      badge = `<span class="course-list-card-badge" style="background:${b.color};">${escapeHtml(b.label)}</span>`;
    }
    return `<div class="course-list-card" data-id="${c.id}">
      <span class="course-list-card-image">${badge}</span>
      <h4>${escapeHtml(c.name)}</h4>
    </div>`;
  }

  function bindCourseCardClicks(containerEl) {
    containerEl.querySelectorAll('.course-list-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => {
        window.location.href = `course-detail.html?id=${card.dataset.id}`;
      });
    });
    containerEl.querySelectorAll('.course-list-card-empty, .course-add-card').forEach((card) => applyTiltEffect(card));
  }

  function renderCourses() {
    const query = searchInput.value.trim().toLowerCase();
    const filtered = query
      ? courses.filter((c) => c.name.toLowerCase().includes(query))
      : courses;
    const sorted = filtered.slice().sort((a, b) => (b.lastViewedAt || b.id) - (a.lastViewedAt || a.id));

    paginate(sorted, 10, renderCourseCard,
      document.getElementById('course-cards'),
      document.getElementById('course-pagination'),
      coursePageState,
      `<div class="course-list-card-empty">${t('admin.courses.noMatch')}</div>`,
      (containerEl) => {
        if (query) {
          containerEl.insertAdjacentHTML('beforeend', `<div class="course-add-card" id="course-add-card"><img class="add-icon" src="/assets/icons/plus.png" alt="">${t('admin.courses.addNew')}</div>`);
          document.getElementById('course-add-card').addEventListener('click', () => {
            window.location.href = 'course-add.html';
          });
        }
        bindCourseCardClicks(containerEl);
      });
  }

  // 「最近點擊」是所有管理者共用的排序依據，存在 D1；背景同步完再重繪一次即可，
  // 不用讓使用者等，也不影響第一次渲染的速度。這裡只是把時間戳記合併進記憶體
  // 內的 courses 副本，不用寫回任何地方——D1 的 recently_viewed 本身就是真相來源。
  fetch('/api/recently-viewed?type=course').then((res) => (res.ok ? res.json() : {})).then((sharedMap) => {
    let changed = false;
    courses.forEach((c) => {
      const shared = sharedMap[c.id];
      if (shared != null && shared > (c.lastViewedAt || 0)) { c.lastViewedAt = shared; changed = true; }
    });
    if (changed) renderCourses();
  }).catch(() => {});

  const searchInput = document.getElementById('course-search');
  const searchClearBtn = document.getElementById('course-search-clear');
  searchInput.value = localStorage.getItem(SEARCH_KEY) || '';
  searchClearBtn.hidden = searchInput.value === '';
  let courseSearchDebounce = null;
  searchInput.addEventListener('input', () => {
    searchClearBtn.hidden = searchInput.value === '';
    localStorage.setItem(SEARCH_KEY, searchInput.value); // 只記住這台瀏覽器上次搜尋的字，不需要存到後端
    clearTimeout(courseSearchDebounce);
    courseSearchDebounce = setTimeout(() => {
      coursePageState.page = 1;
      renderCourses();
    }, 500);
  });

  searchClearBtn.addEventListener('click', () => {
    clearTimeout(courseSearchDebounce);
    searchInput.value = '';
    searchClearBtn.hidden = true;
    localStorage.setItem(SEARCH_KEY, '');
    searchInput.focus();
    coursePageState.page = 1;
    renderCourses();
  });

  renderCourses();

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
})();
</script>

</body>
</html>
