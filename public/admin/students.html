<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 學生管理</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 1000px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  #student-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
  }
  @keyframes studentCardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #student-cards .student-card,
  #student-cards .student-card-empty,
  #student-cards .student-add-card {
    animation: studentCardIn .3s ease backwards;
  }
  #student-cards .student-card:nth-child(2n) {
    animation-delay: .04s;
  }

  .student-card {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .student-card:hover { border-color: var(--color-blue); }
  .student-card-empty { min-height: 122px; }
  .student-add-card {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-weight: 700;
    font-size: 1.0625rem;
    color: var(--color-blue);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .student-add-card:hover { border-color: var(--color-blue); }
  .student-add-card .add-icon {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: block;
  }
  .student-card-avatar {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg-card-alt);
  }
  .student-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .student-card-avatar.is-inactive img { filter: grayscale(1); }
  .student-card-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .student-card-info h4 { margin: 0; font-size: 1.125rem; }
  .student-card-info p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); }


  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #student-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house"></i></button>
</div>

<div class="page">

  <section class="section">
    <div class="section-title"><img class="title-icon" src="../assets/icons/write-student.png" alt=""><h2>學生管理</h2></div>
    <div class="search-box">
      <i class="fa-solid fa-fw fa-magnifying-glass"></i>
      <input type="text" id="student-search" placeholder="搜尋姓名／手機／Email">
      <button type="button" class="search-clear-btn" id="student-search-clear" hidden aria-label="清除搜尋"><i class="fa-solid fa-fw fa-xmark"></i></button>
    </div>
    <div id="student-cards"></div>
  </section>

  <div class="page-nav">
    <div class="pagination" id="student-pagination"></div>
  </div>

</div>

<script src="../script.js"></script>
<script>
  // 未來資料庫對應（此階段僅前端 mock，尚未實作）：students(id, name, phone, email, teams_link), student_courses, student_bookings
  const SEARCH_KEY = 'admin-student-search';

  const studentPageState = { page: 1 };

  function formatPhoneDisplay(digits) {
    const clean = (digits || '').replace(/\D/g, '');
    return clean.length === 10 ? `${clean.slice(0, 4)}-${clean.slice(4, 7)}-${clean.slice(7)}` : digits;
  }

  function renderStudentCard(s) {
    const ribbon = s.status === 'inactive'
      ? '<span class="ribbon-clip"><span class="course-ribbon">停用</span></span>'
      : '';
    return `<div class="student-card" data-id="${s.id}">
      ${ribbon}
      <span class="student-card-avatar${s.status === 'inactive' ? ' is-inactive' : ''}"><img src="${avatarSrc(s.avatar)}" alt=""></span>
      <span class="student-card-info">
        <h4>${s.name}</h4>
        <p>${formatPhoneDisplay(s.phone)}</p>
        <p>${s.email}</p>
      </span>
    </div>`;
  }

  function bindStudentCardClicks(containerEl) {
    containerEl.querySelectorAll('.student-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => {
        window.location.href = `student-detail.html?id=${card.dataset.id}`;
      });
    });
    containerEl.querySelectorAll('.student-card-empty, .student-add-card').forEach((card) => applyTiltEffect(card));
  }

  function renderStudents() {
    const query = searchInput.value.trim().toLowerCase();
    const queryDigits = query.replace(/-/g, '');
    const all = loadStudents();
    const filtered = query
      ? all.filter((s) => [s.name, s.email].some((f) => f.toLowerCase().includes(query))
          || (queryDigits && s.phone.includes(queryDigits)))
      : all;
    const sorted = filtered.slice().sort((a, b) => {
      const aInactive = a.status === 'inactive' ? 1 : 0;
      const bInactive = b.status === 'inactive' ? 1 : 0;
      if (aInactive !== bInactive) return aInactive - bInactive;
      return (b.lastViewedAt || 0) - (a.lastViewedAt || 0);
    });

    paginate(sorted, 10, renderStudentCard,
      document.getElementById('student-cards'),
      document.getElementById('student-pagination'),
      studentPageState,
      '<div class="student-card-empty">找不到符合的學生</div>',
      (containerEl) => {
        if (query) {
          containerEl.insertAdjacentHTML('beforeend', '<div class="student-add-card" id="student-add-card"><img class="add-icon" src="/assets/icons/plus.png" alt="">新增學生</div>');
          document.getElementById('student-add-card').addEventListener('click', () => {
            window.location.href = 'student-add.html';
          });
        }
        bindStudentCardClicks(containerEl);
      });
  }

  // 「最近點擊」是所有管理者共用的排序依據，存在 D1；背景同步完再重繪一次即可，
  // 不用讓使用者等，也不影響第一次渲染的速度。
  fetch('/api/recently-viewed?type=student').then((res) => (res.ok ? res.json() : {})).then((sharedMap) => {
    const all = loadStudents();
    let changed = false;
    all.forEach((s) => {
      const shared = sharedMap[s.id];
      if (shared != null && shared > (s.lastViewedAt || 0)) { s.lastViewedAt = shared; changed = true; }
    });
    if (changed) { saveStudents(all); renderStudents(); }
  }).catch(() => {});

  const searchInput = document.getElementById('student-search');
  const searchClearBtn = document.getElementById('student-search-clear');
  searchInput.value = localStorage.getItem(SEARCH_KEY) || '';
  searchClearBtn.hidden = searchInput.value === '';
  let studentSearchDebounce = null;
  searchInput.addEventListener('input', () => {
    searchClearBtn.hidden = searchInput.value === '';
    localStorage.setItem(SEARCH_KEY, searchInput.value); // TODO: 之後改接真正的 D1/API（此欄位僅為前端搜尋狀態）
    clearTimeout(studentSearchDebounce);
    studentSearchDebounce = setTimeout(() => {
      studentPageState.page = 1;
      renderStudents();
    }, 500);
  });

  searchClearBtn.addEventListener('click', () => {
    clearTimeout(studentSearchDebounce);
    searchInput.value = '';
    searchClearBtn.hidden = true;
    localStorage.setItem(SEARCH_KEY, '');
    searchInput.focus();
    studentPageState.page = 1;
    renderStudents();
  });

  renderStudents();

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
