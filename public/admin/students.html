<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 學生管理</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 1000px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  .back-header {
    position: absolute;
    top: var(--space-6);
    left: var(--space-6);
    z-index: 10;
  }

  .section-title { margin-bottom: var(--space-5); }

  .search-box {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    margin-bottom: var(--space-3);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .search-box:focus-within {
    border-color: var(--color-blue);
    box-shadow: 0 0 0 4px rgba(111, 200, 232, .14);
  }
  .search-box i { color: var(--text-muted); }
  .search-clear-btn {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: content-box;
    width: 24px;
    height: 24px;
    padding: 6px;
    margin: -6px;
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 50%;
    transition: background-color .15s ease, color .15s ease;
  }
  .search-clear-btn:hover {
    background: var(--bg-card-alt);
    color: var(--text-main);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: var(--font-cn);
    font-size: var(--fs-body);
    color: var(--text-main);
  }

  #student-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
  }
  @keyframes studentCardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #student-cards .student-card,
  #student-cards .student-card-empty,
  #student-cards .student-add-card {
    animation: studentCardIn .3s ease backwards;
  }
  #student-cards .student-card:nth-child(2n) {
    animation-delay: .04s;
  }

  .student-card {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .student-card:hover { border-color: var(--color-blue); }
  .student-card-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 122px;
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    font-weight: 700;
    font-size: 1.0625rem;
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .student-card-empty:hover { border-color: var(--color-blue); }
  .student-add-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 122px;
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-weight: 700;
    font-size: 1.0625rem;
    color: var(--color-blue);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .student-add-card:hover { border-color: var(--color-blue); }
  .student-add-card .add-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--color-green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
  }
  .student-card-avatar {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg-card-alt);
  }
  .student-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .student-card-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .student-card-info h4 { margin: 0; font-size: 1.125rem; }
  .student-card-info p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); }


  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    .back-header {
      top: var(--space-3);
      left: var(--space-3);
    }
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #student-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house"></i></button>
</div>

<div class="page">

  <section class="section">
    <div class="section-title"><img class="title-icon" src="../assets/icons/write-student.png" alt=""><h2>學生管理</h2></div>
    <div class="search-box">
      <i class="fa-solid fa-fw fa-magnifying-glass"></i>
      <input type="text" id="student-search" placeholder="搜尋姓名／手機／Email">
      <button type="button" class="search-clear-btn" id="student-search-clear" hidden aria-label="清除搜尋"><i class="fa-solid fa-fw fa-xmark"></i></button>
    </div>
    <div id="student-cards"></div>
  </section>

  <div class="page-nav">
    <div class="pagination" id="student-pagination"></div>
  </div>

</div>

<script src="../script.js"></script>
<script>
  // 未來資料庫對應（此階段僅前端 mock，尚未實作）：students(id, name, phone, email, teams_link), student_courses, student_bookings
  const STUDENTS_KEY = 'admin-students';
  const SEARCH_KEY = 'admin-student-search';

  const AVATAR_LIST = [
    '001-bear.png', '002-rabbit.png', '003-cow.png', '004-puffer-fish.png', '005-owl.png',
    '006-panda.png', '007-hen.png', '008-llama.png', '009-elephant.png', '010-cat.png',
    '011-penguin.png', '012-chicken.png', '013-frog.png', '014-hedgehog.png', '015-mouse.png',
    '016-duck.png', '017-dog.png', '018-sloth.png', '019-ferret.png', '020-beaver.png',
    '021-wild-boar.png', '022-chameleons.png', '023-koala.png', '024-squirrel.png', '025-turkey.png',
    '026-deer.png', '027-fox.png', '028-bat.png', '029-lion.png', '030-parrot.png',
    '031-ostrich.png', '032-snake.png', '033-camel.png', '034-horse.png', '035-skunk.png',
    '036-hippopotamus.png', '037-crab.png', '038-rhino.png', '039-giraffe.png', '040-gorilla.png',
    '041-zebra.png', '042-wolf.png', '043-goat.png', '044-turtle.png', '045-pig.png',
    '046-walrus.png', '047-bee.png', '048-sheep.png', '049-monkey.png', '050-octopus.png',
    '051-bear-1.png', '052-sea-lion.png', '053-polar-bear.png',
  ];
  function randomAvatar() { return AVATAR_LIST[Math.floor(Math.random() * AVATAR_LIST.length)]; }

  const COURSE_NAME_FIX = { 'N4 綜合日本語 J1': 'N4 綜合日本語 J4', 'N4 綜合日本語 J2': 'N4 綜合日本語 J5' };

  function loadStudents() { // TODO: 之後改接真正的 D1/API
    const raw = localStorage.getItem(STUDENTS_KEY);
    if (raw) {
      const list = JSON.parse(raw);
      let patched = false;
      list.forEach((s) => {
        if (!s.avatar) { s.avatar = randomAvatar(); patched = true; }
        (s.courses || []).forEach((c) => {
          if (COURSE_NAME_FIX[c.name]) { c.name = COURSE_NAME_FIX[c.name]; patched = true; }
        });
        (s.bookings || []).forEach((b) => {
          if (COURSE_NAME_FIX[b.course]) { b.course = COURSE_NAME_FIX[b.course]; patched = true; }
        });
      });
      if (patched) saveStudents(list);
      return list;
    }

    const now = Date.now();
    const DAY = 86400000;
    const NAMES = ['陳靜怡', '王大明', '李美芳', '張凱文', '林佳穎', '黃俊傑', '吳雅婷', '劉建宏', '蔡欣怡', '楊子軒', '鄭雅雯', '許志明', '謝佩珊'];
    const VIEW_OFFSETS = [5, 12, 1, 9, 3, 11, 0, 7, 4, 10, 2, 8, 6];
    const TEACHERS = ['田中老師', '佐藤老師', '山本老師', '鈴木老師', '渡辺老師'];
    const COURSES = ['N5 綜合日本語 J1', 'N5 綜合日本語 J2', 'N5 綜合日本語 J3', 'N4 綜合日本語 J4', 'N4 綜合日本語 J5', 'N4 綜合日本語 J6', 'N3 綜合日本語 J7', 'N3 綜合日本語 J8', 'N3 綜合日本語 J9', 'N2 綜合日本語 J10', 'N2 綜合日本語 J11', 'N2 綜合日本語 J12', 'N2 綜合日本語 J13', '商務日文 基礎會話篇', '商務日文 應用會話篇'];

    const seed = NAMES.map((name, i) => {
      const id = i + 1;
      const hasCourse = i % 3 !== 2;
      const courses = [];
      if (hasCourse) {
        courses.push({ id: id * 100 + 1, name: COURSES[i % COURSES.length], status: 'ongoing', attended: `${i % 10}/16`, booked: `${(i % 10) + 1}/16` });
      }
      if (i % 4 === 0) {
        courses.push({ id: id * 100 + 2, name: COURSES[(i + 2) % COURSES.length], status: 'completed', attended: '16/16', booked: '16/16' });
      }
      const bookings = [];
      if (hasCourse) {
        const bookingCount = 1 + (i % 3);
        for (let b = 0; b < bookingCount; b++) {
          const day = 1 + ((i * 3 + b * 5) % 27);
          bookings.push({
            id: id * 1000 + b,
            course: courses[0].name,
            teacher: TEACHERS[(i + b) % TEACHERS.length],
            date: `2026-09-${String(day).padStart(2, '0')}`,
            time: `${10 + ((i + b) % 8)}:00`,
            status: b === 0 ? 'upcoming' : (b % 2 === 0 ? 'attended' : 'cancelled'),
          });
        }
      }
      return {
        id, name,
        phone: `09${String(10 + i).padStart(2, '0')}${String(100 + i * 7).padStart(3, '0')}${String(200 + i * 3).padStart(3, '0')}`,
        email: id <= 4 ? `student${id}@jptip.co.jp` : `student${id}@example.com`, // 前 4 位對齊 D1 種子登入帳號，讓登入快選按鈕能找到對應的學生資料
        teamsLink: '',
        avatar: AVATAR_LIST[i % AVATAR_LIST.length],
        lastViewedAt: now - VIEW_OFFSETS[i] * DAY,
        courses, bookings,
      };
    });

    localStorage.setItem(STUDENTS_KEY, JSON.stringify(seed));
    return seed;
  }

  function saveStudents(list) { localStorage.setItem(STUDENTS_KEY, JSON.stringify(list)); } // TODO: 之後改接真正的 D1/API
  function avatarSrc(avatar) { return avatar && avatar.startsWith('data:') ? avatar : `../assets/avatars/${avatar}`; }

  function paginate(items, pageSize, renderRowFn, containerEl, paginationEl, pageState, emptyHtml, onRender) {
    const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
    pageState.page = Math.min(pageState.page, totalPages);
    const start = (pageState.page - 1) * pageSize;
    const pageItems = items.slice(start, start + pageSize);

    containerEl.innerHTML = pageItems.map(renderRowFn).join('') || emptyHtml;
    if (onRender) onRender(containerEl);

    paginationEl.innerHTML = '';

    const prevBtn = document.createElement('button');
    prevBtn.type = 'button';
    prevBtn.setAttribute('aria-label', '上一頁');
    prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
    prevBtn.disabled = pageState.page === 1;
    prevBtn.addEventListener('click', () => {
      pageState.page--;
      paginate(items, pageSize, renderRowFn, containerEl, paginationEl, pageState, emptyHtml, onRender);
    });
    paginationEl.appendChild(prevBtn);

    for (let p = 1; p <= totalPages; p++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = p;
      if (p === pageState.page) btn.classList.add('active');
      btn.addEventListener('click', () => {
        pageState.page = p;
        paginate(items, pageSize, renderRowFn, containerEl, paginationEl, pageState, emptyHtml, onRender);
      });
      paginationEl.appendChild(btn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.type = 'button';
    nextBtn.setAttribute('aria-label', '下一頁');
    nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
    nextBtn.disabled = pageState.page === totalPages;
    nextBtn.addEventListener('click', () => {
      pageState.page++;
      paginate(items, pageSize, renderRowFn, containerEl, paginationEl, pageState, emptyHtml, onRender);
    });
    paginationEl.appendChild(nextBtn);
  }

  const studentPageState = { page: 1 };

  function formatPhoneDisplay(digits) {
    const clean = (digits || '').replace(/\D/g, '');
    return clean.length === 10 ? `${clean.slice(0, 4)}-${clean.slice(4, 7)}-${clean.slice(7)}` : digits;
  }

  function renderStudentCard(s) {
    return `<div class="student-card" data-id="${s.id}">
      <span class="student-card-avatar"><img src="${avatarSrc(s.avatar)}" alt=""></span>
      <span class="student-card-info">
        <h4>${s.name}</h4>
        <p>${formatPhoneDisplay(s.phone)}</p>
        <p>${s.email}</p>
      </span>
    </div>`;
  }

  function bindStudentCardClicks(containerEl) {
    containerEl.querySelectorAll('.student-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => {
        window.location.href = `student-detail.html?id=${card.dataset.id}`;
      });
    });
    containerEl.querySelectorAll('.student-card-empty, .student-add-card').forEach((card) => applyTiltEffect(card));
  }

  function renderStudents() {
    const query = searchInput.value.trim().toLowerCase();
    const queryDigits = query.replace(/-/g, '');
    const all = loadStudents();
    const filtered = query
      ? all.filter((s) => [s.name, s.email].some((f) => f.toLowerCase().includes(query))
          || (queryDigits && s.phone.includes(queryDigits)))
      : all;
    const sorted = filtered.slice().sort((a, b) => (b.lastViewedAt || 0) - (a.lastViewedAt || 0));

    paginate(sorted, 10, renderStudentCard,
      document.getElementById('student-cards'),
      document.getElementById('student-pagination'),
      studentPageState,
      '<div class="student-card-empty">找不到符合的學生</div>',
      (containerEl) => {
        if (query) {
          containerEl.insertAdjacentHTML('beforeend', '<div class="student-add-card" id="student-add-card"><span class="add-icon"><i class="fa-solid fa-fw fa-plus"></i></span>新增學生</div>');
          document.getElementById('student-add-card').addEventListener('click', () => {
            window.location.href = 'student-add.html';
          });
        }
        bindStudentCardClicks(containerEl);
      });
  }

  const searchInput = document.getElementById('student-search');
  const searchClearBtn = document.getElementById('student-search-clear');
  searchInput.value = localStorage.getItem(SEARCH_KEY) || '';
  searchClearBtn.hidden = searchInput.value === '';
  let studentSearchDebounce = null;
  searchInput.addEventListener('input', () => {
    searchClearBtn.hidden = searchInput.value === '';
    localStorage.setItem(SEARCH_KEY, searchInput.value); // TODO: 之後改接真正的 D1/API（此欄位僅為前端搜尋狀態）
    clearTimeout(studentSearchDebounce);
    studentSearchDebounce = setTimeout(() => {
      studentPageState.page = 1;
      renderStudents();
    }, 500);
  });

  searchClearBtn.addEventListener('click', () => {
    clearTimeout(studentSearchDebounce);
    searchInput.value = '';
    searchClearBtn.hidden = true;
    localStorage.setItem(SEARCH_KEY, '');
    searchInput.focus();
    studentPageState.page = 1;
    renderStudents();
  });

  renderStudents();

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
