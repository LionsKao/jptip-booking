<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 老師可教課程</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 900px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }
  #card-course-add, #card-courses { max-width: 800px; width: 100%; margin: 0 auto var(--space-6); }
  #card-courses { margin-bottom: 0; }

  #add-course-dropdown {
    width: 360px;
  }
  #add-course-dropdown .dropdown-trigger {
    width: 100%;
    border-radius: var(--radius-lg);
  }
  #add-course-dropdown .select-badge {
    display: none;
  }
  @media (min-width: 641px) {
    #add-course-dropdown .dropdown-menu {
      right: auto;
      width: 480px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
    }
    #add-course-dropdown.open .dropdown-menu {
      max-height: 500px;
      overflow-y: hidden;
    }
  }
  .course-add-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .course-cap-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .course-cap-row:hover { border-color: var(--color-blue); }
  .course-cap-row h4 {
    margin: 0;
    font-size: 1.0625rem;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .course-cap-row button { flex-shrink: 0; }
  #course-cap-list { display: grid; grid-template-columns: 1fr; gap: var(--space-3); }

  .booking-card-empty { min-height: 80px; }

  @media (max-width: 948px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #course-cap-list {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-arrow-left"></i></button>
</div>

<div class="page">

  <section class="section" id="card-course-add">
    <div class="section-title"><img class="title-icon" src="../assets/icons/books.png" alt=""><h2 data-i18n="admin.teachers.courses.addTitle">新增可教課程</h2></div>

    <div class="course-add-row">
      <div class="dropdown" id="add-course-dropdown" data-placeholder="選擇課程">
        <button type="button" class="dropdown-trigger"><span class="label" data-i18n="admin.teachers.courses.selectPlaceholder">選擇課程</span><i class="fa-solid fa-fw fa-chevron-down"></i></button>
        <ul class="dropdown-menu" id="add-course-menu"></ul>
      </div>
      <button type="button" class="btn butter" id="add-course-btn"><i class="fa-solid fa-fw fa-plus"></i> <span data-i18n="admin.teachers.courses.addTitle">新增可教課程</span></button>
    </div>
  </section>

  <section class="section" id="card-courses">
    <div class="section-title"><img class="title-icon" src="../assets/icons/books.png" alt=""><h2 data-i18n="admin.teachers.detail.courses.title">可教課程</h2></div>
    <div id="course-cap-list"></div>
  </section>

</div>

<div class="modal-overlay" id="basicInfoAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="basicInfoAlertText"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addCourseConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon success"><i class="fa-solid fa-graduation-cap"></i></div>
    <h3 data-i18n="admin.teachers.courses.addConfirm.title">確定新增這門可教課程嗎？</h3>
    <p class="text-small" id="addCourseConfirmName"></p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn green" id="add-course-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="admin.teachers.courses.addConfirm.confirm">確定新增</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteCourseConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-trash"></i></div>
    <h3 data-i18n="admin.teachers.courses.deleteConfirm.title">確定要刪除這門可教課程嗎？</h3>
    <p class="text-small" id="deleteCourseConfirmName"></p>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="delete-course-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-trash"></i> <span data-i18n="admin.teachers.courses.deleteConfirm.confirm">確定刪除</span></button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());

  const teacherId = Number(new URLSearchParams(window.location.search).get('id'));
  // 課程下拉選單原本是寫死的 15 門課程，現在改成抓真正的課程總表（/api/courses），
  // 這樣新課程開課後老師這邊也能立刻選到，不用再改這個頁面的程式碼。
  const [teachers, courses] = await Promise.all([
    fetch('/api/teachers').then((res) => (res.ok ? res.json() : [])),
    fetch('/api/courses').then((res) => (res.ok ? res.json() : [])),
  ]);
  const teacher = teachers.find((t) => t.id === teacherId);

  if (!teacher) {
    window.location.href = 'teachers.html';
  } else {
    function showBasicAlert(message) {
      document.getElementById('basicInfoAlertText').textContent = message;
      document.getElementById('basicInfoAlertModal').classList.add('open');
    }

    // 「新增可教課程」下拉選單的選項是動態長出來的（不是頁面載入時就固定在 HTML
    // 裡的 <li>），所以沒辦法靠 script.js 開場時對既有 .dropdown li 綁的那份點擊
    // 事件——這裡自己補一份一模一樣的單選邏輯（selected/label/收合選單）。
    const courseDropdown = document.getElementById('add-course-dropdown');
    const courseMenu = document.getElementById('add-course-menu');
    const courseDropdownLabel = courseDropdown.querySelector('.dropdown-trigger .label');
    courseMenu.innerHTML = courses.map((c) => `<li data-value="${c.name}">${c.name}<span class="select-badge"><i class="fa-solid fa-fw fa-check"></i></span></li>`).join('');
    courseMenu.querySelectorAll('li').forEach((li) => {
      li.addEventListener('click', () => {
        courseMenu.querySelectorAll('li').forEach((l) => l.classList.remove('selected'));
        li.classList.add('selected');
        courseDropdownLabel.textContent = li.dataset.value;
        courseDropdown.classList.remove('open');
      });
    });

    function resetCourseDropdown() {
      courseMenu.querySelectorAll('li.selected').forEach((li) => li.classList.remove('selected'));
      courseDropdownLabel.textContent = t('admin.teachers.courses.selectPlaceholder');
    }

    function updateCourseDropdownOptions() {
      const added = new Set(teacher.courses);
      courseMenu.querySelectorAll('li').forEach((li) => {
        li.hidden = added.has(li.dataset.value);
      });
    }

    // PATCH /api/teachers/courses 回傳的是老師目前完整的可教課程清單，直接拿來
    // 當作最新狀態即可，不用自己在本機 push/filter 陣列去猜結果。
    async function patchTeacherCourse(courseName, action) {
      const res = await fetch(`/api/teachers/courses?teacherId=${teacher.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ courseName, action }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        return { ok: false, error: data.error || t('admin.common.saveFailed') };
      }
      const data = await res.json();
      teacher.courses = data.courses;
      return { ok: true };
    }

    function renderCourseCaps() {
      const listEl = document.getElementById('course-cap-list');
      listEl.innerHTML = teacher.courses.length
        ? teacher.courses.map((name) => `<div class="course-cap-row">
            <h4>${name}</h4>
            <button type="button" class="btn sm red" data-name="${name}"><i class="fa-solid fa-fw fa-trash"></i> ${t('hours.delete')}</button>
          </div>`).join('')
        : `<div class="booking-card-empty">${t('admin.teachers.courses.empty')}</div>`;
      listEl.querySelectorAll('.course-cap-row, .booking-card-empty').forEach((card) => applyTiltEffect(card));
      listEl.querySelectorAll('.course-cap-row button[data-name]').forEach((btn) => {
        btn.addEventListener('click', () => {
          pendingDeleteCourseName = btn.dataset.name;
          document.getElementById('deleteCourseConfirmName').textContent = pendingDeleteCourseName;
          document.getElementById('deleteCourseConfirmModal').classList.add('open');
        });
      });
      updateCourseDropdownOptions();
    }

    let pendingCourseName = null;
    let pendingDeleteCourseName = null;

    document.getElementById('add-course-btn').addEventListener('click', () => {
      const value = getDropdownValue('add-course-dropdown');
      if (!value) {
        showBasicAlert(t('admin.teachers.courses.selectFirst'));
        return;
      }
      pendingCourseName = value;
      document.getElementById('addCourseConfirmName').textContent = value;
      document.getElementById('addCourseConfirmModal').classList.add('open');
    });

    document.getElementById('add-course-confirm-btn').addEventListener('click', async () => {
      if (!pendingCourseName) return;
      const result = await patchTeacherCourse(pendingCourseName, 'add');
      pendingCourseName = null;
      document.getElementById('addCourseConfirmModal').classList.remove('open');
      if (!result.ok) {
        showBasicAlert(result.error);
        return;
      }
      resetCourseDropdown();
      renderCourseCaps();
    });

    document.getElementById('delete-course-confirm-btn').addEventListener('click', async () => {
      if (!pendingDeleteCourseName) return;
      const result = await patchTeacherCourse(pendingDeleteCourseName, 'remove');
      pendingDeleteCourseName = null;
      document.getElementById('deleteCourseConfirmModal').classList.remove('open');
      if (!result.ok) {
        showBasicAlert(result.error);
        return;
      }
      renderCourseCaps();
    });

    renderCourseCaps();
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = `teacher-detail.html?id=${teacherId}`;
  });
})();
</script>

</body>
</html>
