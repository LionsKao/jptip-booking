<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 老師管理</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.admin-page .page {
    max-width: 1000px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }

  #teacher-list-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
  }
  @keyframes teacherCardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #teacher-list-cards .teacher-list-card,
  #teacher-list-cards .teacher-list-card-empty,
  #teacher-list-cards .teacher-add-card {
    animation: teacherCardIn .3s ease backwards;
  }
  #teacher-list-cards .teacher-list-card:nth-child(2n) {
    animation-delay: .04s;
  }

  .teacher-list-card {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .teacher-list-card:hover { border-color: var(--color-blue); }
  .teacher-list-card-empty { min-height: 88px; }
  .teacher-add-card {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-weight: 700;
    font-size: 1.0625rem;
    color: var(--color-blue);
    will-change: transform;
    transform-style: preserve-3d;
    transition: transform .35s ease, box-shadow .35s ease, border-color .2s ease;
  }
  .teacher-add-card:hover { border-color: var(--color-blue); }
  .teacher-add-card .add-icon {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: block;
  }
  .teacher-list-card-avatar {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg-card-alt);
  }
  .teacher-list-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .teacher-list-card-avatar.is-inactive img { filter: grayscale(1); }
  .teacher-list-card h4 { margin: 0; font-size: 1.125rem; }


  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  @media (max-width: 1048px) {
    body.admin-page .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.admin-page .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #teacher-list-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body class="admin-page">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house"></i></button>
</div>

<div class="page">

  <section class="section">
    <div class="section-title"><img class="title-icon" src="../assets/icons/write-teacher.png" alt=""><h2 data-i18n="admin.dash.teachers.title">老師管理</h2></div>
    <div class="search-box">
      <i class="fa-solid fa-fw fa-magnifying-glass"></i>
      <input type="text" id="teacher-search" data-i18n-placeholder="admin.students.searchPlaceholder" placeholder="搜尋姓名／手機／Email">
      <button type="button" class="search-clear-btn" id="teacher-search-clear" hidden data-i18n-aria-label="admin.common.clearSearch" aria-label="清除搜尋"><i class="fa-solid fa-fw fa-xmark"></i></button>
    </div>
    <div id="teacher-list-cards"></div>
  </section>

  <div class="page-nav">
    <div class="pagination" id="teacher-pagination"></div>
  </div>

</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 這頁沒有語言切換鈕（已在管理者主頁），純粹套用該管理者帳號目前的語言。
  const adminMe = await fetch('/api/admins/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  await initI18n((adminMe && adminMe.language) || getCurrentLang());

  const SEARCH_KEY = 'admin-teacher-search';

  // 老師是真正的 D1 資料（見 /api/teachers），這裡整頁只在載入時抓一次，
  // 之後搜尋/分頁都是在這份記憶體內的副本上做，不用每次都重打 API。
  const teachers = await fetch('/api/teachers').then((res) => (res.ok ? res.json() : []));

  const teacherPageState = { page: 1 };

  // 這裡刻意不叫參數 t——會蓋掉全域的 t() 翻譯函式。
  function renderTeacherCard(teacher) {
    const ribbon = teacher.status === 'inactive'
      ? `<span class="ribbon-clip"><span class="course-ribbon">${t('admin.common.disabled')}</span></span>`
      : '';
    return `<div class="teacher-list-card" data-id="${teacher.id}">
      ${ribbon}
      <span class="teacher-list-card-avatar${teacher.status === 'inactive' ? ' is-inactive' : ''}"><img src="${escapeHtml(avatarSrc(teacher.avatar))}" alt=""></span>
      <h4>${escapeHtml(teacher.name)}</h4>
    </div>`;
  }

  function bindTeacherCardClicks(containerEl) {
    containerEl.querySelectorAll('.teacher-list-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => {
        window.location.href = `teacher-detail.html?id=${card.dataset.id}`;
      });
    });
    containerEl.querySelectorAll('.teacher-list-card-empty, .teacher-add-card').forEach((card) => applyTiltEffect(card));
  }

  function renderTeachers() {
    const query = searchInput.value.trim().toLowerCase();
    const queryDigits = query.replace(/-/g, '');
    const filtered = query
      ? teachers.filter((t) => [t.name, t.email].some((f) => f.toLowerCase().includes(query))
          || (queryDigits && t.phone && t.phone.includes(queryDigits)))
      : teachers;
    const sorted = filtered.slice().sort((a, b) => {
      const aInactive = a.status === 'inactive' ? 1 : 0;
      const bInactive = b.status === 'inactive' ? 1 : 0;
      if (aInactive !== bInactive) return aInactive - bInactive;
      return (b.lastViewedAt || 0) - (a.lastViewedAt || 0);
    });

    paginate(sorted, 10, renderTeacherCard,
      document.getElementById('teacher-list-cards'),
      document.getElementById('teacher-pagination'),
      teacherPageState,
      `<div class="teacher-list-card-empty">${t('admin.teachers.noMatch')}</div>`,
      (containerEl) => {
        if (query) {
          containerEl.insertAdjacentHTML('beforeend', `<div class="teacher-add-card" id="teacher-add-card"><img class="add-icon" src="/assets/icons/plus.png" alt="">${t('admin.teachers.addNew')}</div>`);
          document.getElementById('teacher-add-card').addEventListener('click', () => {
            window.location.href = 'teacher-add.html';
          });
        }
        bindTeacherCardClicks(containerEl);
      });
  }

  // 「最近點擊」是所有管理者共用的排序依據，存在 D1；背景同步完再重繪一次即可，
  // 不用讓使用者等，也不影響第一次渲染的速度。這裡只是把時間戳記合併進記憶體
  // 內的 teachers 副本，不用寫回任何地方——D1 的 recently_viewed 本身就是真相來源。
  fetch('/api/recently-viewed?type=teacher').then((res) => (res.ok ? res.json() : {})).then((sharedMap) => {
    let changed = false;
    teachers.forEach((t) => {
      const shared = sharedMap[t.id];
      if (shared != null && shared > (t.lastViewedAt || 0)) { t.lastViewedAt = shared; changed = true; }
    });
    if (changed) renderTeachers();
  }).catch(() => {});

  const searchInput = document.getElementById('teacher-search');
  const searchClearBtn = document.getElementById('teacher-search-clear');
  searchInput.value = localStorage.getItem(SEARCH_KEY) || '';
  searchClearBtn.hidden = searchInput.value === '';
  let teacherSearchDebounce = null;
  searchInput.addEventListener('input', () => {
    searchClearBtn.hidden = searchInput.value === '';
    localStorage.setItem(SEARCH_KEY, searchInput.value); // TODO: 之後改接真正的 D1/API（此欄位僅為前端搜尋狀態）
    clearTimeout(teacherSearchDebounce);
    teacherSearchDebounce = setTimeout(() => {
      teacherPageState.page = 1;
      renderTeachers();
    }, 500);
  });

  searchClearBtn.addEventListener('click', () => {
    clearTimeout(teacherSearchDebounce);
    searchInput.value = '';
    searchClearBtn.hidden = true;
    localStorage.setItem(SEARCH_KEY, '');
    searchInput.focus();
    teacherPageState.page = 1;
    renderTeachers();
  });

  renderTeachers();

  document.getElementById('back-btn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
})();
</script>

</body>
</html>
