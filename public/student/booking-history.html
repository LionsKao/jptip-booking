<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 我的課程</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.booking-history .page {
    max-width: 1048px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }
  #history-group {
    max-width: 1000px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  #history-cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .booking-card.is-clickable { cursor: pointer; }
  .booking-card:hover { border-color: var(--color-blue); }

  .booking-card-empty { min-height: 160px; }

  .booking-card-info {
    gap: 3px;
  }
  .booking-card-code {
    margin: 0;
    color: var(--text-muted);
    font-size: 1.125rem;
    font-variant-numeric: tabular-nums;
  }
  .booking-card-info h4,
  .booking-card-info .booking-card-course {
    margin: 0;
    line-height: 1.6;
  }
  .booking-card-info .booking-card-datetime {
    margin: 0;
    font-size: 1.125rem;
  }
  /* 「今天」徽章：疊在卡片左上角、坐在卡片框線上，沒有底色，就是圖示本身
     （.booking-card 本身已經是 position:relative）。用 <img> 而非圖示字型，
     之後要換成別的圖案只要換 flag.png 這個檔案即可。 */
  .booking-card-today-badge {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 32px;
    height: 32px;
    z-index: 1;
  }
  .booking-card-today-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .wizard-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    margin-top: var(--space-6);
  }
  .wizard-nav .btn { min-width: 160px; }

  @media (max-width: 1048px) {
    body.booking-history .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.booking-history .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #history-cards {
      grid-template-columns: 1fr;
    }
    .wizard-nav {
      width: 100%;
      flex-wrap: wrap;
    }
    .wizard-nav .btn { min-width: 0; flex: 1 1 0; }
  }
</style>
</head>
<body class="booking-history">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house" id="back-btn-icon"></i></button>
</div>

<div class="page">

  <div id="history-list-view">

    <section class="section" id="history-group">
      <div class="section-title"><img class="title-icon" src="../assets/icons/flash-card.png" alt=""><h2 data-i18n="history.myCourses">我的課程</h2><button type="button" class="info-btn" data-modal-open="historyRecordInfoModal" data-i18n-aria-label="common.info" aria-label="說明"><i class="fa-solid fa-fw fa-circle-question"></i></button><button type="button" class="info-btn" data-modal-open="historyTimezoneModal" data-i18n-aria-label="history.tzInfo" aria-label="時區說明"><i class="fa-solid fa-fw fa-globe"></i></button></div>
      <div class="booking-cards" id="history-cards"></div>
    </section>

    <div class="page-nav">
      <div class="pagination" id="history-pagination"></div>
    </div>

  </div>

  <div id="history-detail-view" hidden>
    <section class="section">
      <span class="ribbon-clip" id="detail-status-ribbon" hidden><span class="course-ribbon" id="detail-status-ribbon-text"></span></span>
      <div class="section-title"><img class="title-icon" src="../assets/icons/clipboard.png" alt=""><h2 data-i18n="history.detail.title">課程詳情</h2><button type="button" class="info-btn" id="copy-detail-btn" data-i18n-aria-label="history.detail.copy" aria-label="複製課程資訊"><i class="fa-regular fa-copy"></i></button></div>
      <div class="confirm-summary">
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/invoice.png" alt=""></span>
          <span><p data-i18n="history.detail.code">預約編號</p><h3 id="detail-booking-code">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img id="detail-course-image" src="../assets/icons/books.png" alt=""></span>
          <span><p data-i18n="booking.confirm.course">課程</p><h3 id="detail-course">—</h3></span>
        </div>
        <div class="confirm-highlight-row">
          <div class="confirm-highlight">
            <span class="confirm-highlight-icon"><img src="../assets/icons/student.png" alt=""></span>
            <span><p data-i18n="history.detail.student">學生</p><h3 id="detail-student">—</h3></span>
          </div>
          <div class="confirm-highlight">
            <span class="confirm-highlight-icon"><img src="../assets/icons/woman.png" alt=""></span>
            <span><p data-i18n="booking.confirm.teacher">老師</p><h3 id="detail-teacher">—</h3></span>
          </div>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/icon-calendar.png" alt=""></span>
          <span><p data-i18n="booking.confirm.date">日期</p><h3 id="detail-datetime">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/clock.png" alt=""></span>
          <span><p data-i18n="history.detail.time">時間・課程長度・時區</p><h3 id="detail-time">—</h3></span>
        </div>
      </div>
    </section>
    <div class="wizard-nav">
      <button type="button" class="btn red" id="cancel-booking-btn"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="history.cancelBooking">取消預約</span></button>
    </div>
    <section class="section" id="rating-result-view" hidden>
      <div class="section-title"><img class="title-icon" src="../assets/icons/chat.png" alt=""><h2 data-i18n="history.feedback.title">課程回饋</h2></div>
      <div id="rating-result-entries"></div>
    </section>
    <section class="section" id="rating-input-view" hidden>
      <div class="section-title"><img class="title-icon" src="../assets/icons/chat.png" alt=""><h2 data-i18n="history.feedback.title">課程回饋</h2></div>
      <div class="star-rating-input" id="rating-stars-input"></div>
      <div class="field">
        <div class="field-float">
          <textarea id="rating-comment-input" placeholder=" " maxlength="500"></textarea>
          <label for="rating-comment-input"><i class="fa-solid fa-fw fa-pen"></i> <span data-i18n="history.feedback.commentLabel">課程狀況或問題反映</span></label>
        </div>
      </div>
      <div class="wizard-nav">
        <button type="button" class="btn green" id="submit-rating-btn" disabled>
          <i class="fa-solid fa-fw fa-star"></i> <span data-i18n="booking.rating.submit">送出回饋</span>
        </button>
      </div>
    </section>
  </div>

</div>

<div class="modal-overlay" id="ratingConfirmModal" data-modal-persistent>
  <div class="modal modal-wide" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon star"><i class="fa-solid fa-star"></i></div>
    <h3 data-i18n="booking.rating.confirmTitle">確定要送出回饋嗎？</h3>
    <div class="modal-preview">
      <div id="rating-confirm-stars"></div>
      <p class="text-small" id="rating-confirm-comment" hidden></p>
    </div>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn green" id="confirm-submit-rating-btn" style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="leave.addConfirm.confirm">確定</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cancelConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-xmark"></i></div>
    <h3 data-i18n="history.cancelConfirm.title">確定要取消預約嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="confirm-cancel-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="history.cancelConfirm.confirm">確定取消</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cancelTooLateModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-exclamation"></i></div>
    <h3 data-i18n="history.tooLate.title">已無法取消此預約</h3>
    <p class="text-small" id="cancel-too-late-note"></p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-exclamation"></i></div>
    <h3 id="history-alert-text"></h3>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyRecordInfoModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-fw fa-clock-rotate-left"></i></div>
    <h3 data-i18n="history.recordInfo.title">我的課程最多顯示 365 天內</h3>
    <p class="text-small" data-i18n="history.recordInfo.desc">從今天往回算 365 天，超過的課程紀錄就不會再顯示囉。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyTimezoneModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon timezone"><i class="fa-solid fa-globe"></i></div>
    <h3 data-i18n="history.tzModal.title">課程時間顯示時區</h3>
    <p class="text-small" id="history-timezone-note"></p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.gotIt">知道了</span></button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 語言設定的真相是帳號的 language 欄位；這裡不放語言切換鈕（已在學生主頁），
  // 純粹只是套用帳號目前的語言，讓下面動態組出來的文字一開始就是對的語言。
  const me = await fetch('/api/students/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  const lang = (me && me.language) || getCurrentLang();
  setCurrentLang(lang);
  await initI18n(lang);

  const STATUS_MAP = {
    pending:   { cls: 'pending',   icon: 'icon-alert.png',     get label() { return t('status.pending'); } },
    absent:    { cls: 'tone-navy', icon: 'question.png',       get label() { return t('status.absent'); } },
    upcoming:  { cls: 'info',      icon: 'icon-hourglass.png', get label() { return t('status.upcoming'); } },
    cancelled: { cls: 'cancelled', icon: 'close.png',          get label() { return t('status.cancelled'); } },
    attended:  { cls: 'confirmed', icon: 'check.png',          get label() { return t('status.attended'); } },
  };
  const RIBBON_TONE_MAP = {
    pending:   { tone: 'tone-orange', get label() { return t('status.pending'); } },
    absent:    { tone: 'tone-navy',   get label() { return t('status.absent'); } },
    upcoming:  { tone: 'tone-blue',   get label() { return t('status.upcoming'); } },
    cancelled: { tone: 'tone-red',    get label() { return t('status.cancelled'); } },
    attended:  { tone: 'tone-green',  get label() { return t('status.attended'); } },
  };

  function showHistoryAlert(message) {
    document.getElementById('history-alert-text').textContent = message;
    document.getElementById('historyAlertModal').classList.add('open');
  }

  // 這個頁面本身已經由後端依 session cookie 擋過（非登入學生連頁面都進不來），
  // 這裡另外打 /api/session 只是為了拿到「是哪一位學生」，取代舊版可被竄改的 sessionStorage。
  const session = await fetch('/api/session').then((res) => (res.ok ? res.json() : null)).catch(() => null);

  // 課程時間統一存成 UTC+8（台灣時間）為基準，依學生個人時區設定換算顯示。
  const STUDENT_TIMEZONE_LABEL = (me && me.timezone) || 'UTC+08:00 台北';
  const STUDENT_TZ_OFFSET = parseUtcOffset(STUDENT_TIMEZONE_LABEL);
  const STUDENT_TZ_DELTA_HOURS = STUDENT_TZ_OFFSET - 8;
  document.getElementById('history-timezone-note').textContent = t('history.allTimesIn', { tz: formatTimezoneForSentence(STUDENT_TIMEZONE_LABEL) });

  function shiftToStudentTz(dateStr, timeStr) {
    if (!STUDENT_TZ_DELTA_HOURS) return { date: dateStr, time: timeStr };
    const dt = new Date(`${dateStr.replace(/\//g, '-')}T${timeStr}:00`);
    // setHours() 會把非整數小時直接截斷，緬甸 +6:30 這種半小時時區要改用分鐘計算。
    dt.setMinutes(dt.getMinutes() + STUDENT_TZ_DELTA_HOURS * 60);
    const y = dt.getFullYear(), m = String(dt.getMonth() + 1).padStart(2, '0'), day = String(dt.getDate()).padStart(2, '0');
    const hh = String(dt.getHours()).padStart(2, '0'), mm = String(dt.getMinutes()).padStart(2, '0');
    return { date: `${y}/${m}/${day}`, time: `${hh}:${mm}` };
  }

  // 只顯示 365 天內的紀錄，上課日期超過 365 天的舊紀錄不再顯示
  const RECORD_WINDOW_DAYS = 365;
  const cutoffDate = new Date();
  cutoffDate.setHours(0, 0, 0, 0);
  cutoffDate.setDate(cutoffDate.getDate() - RECORD_WINDOW_DAYS);

  let bookings = [];
  if (session) {
    try {
      const res = await fetch('/api/bookings');
      if (!res.ok) throw new Error('load failed');
      bookings = await res.json();
    } catch {
      showHistoryAlert(t('history.loadFailed'));
    }
  }

  // 24 小時內就要開始上課的（取消的不算）排在最前面，依上課時間由早到晚；其餘紀錄
  // 維持原本「日期新的排前面」的排序，讓卡片列表不用再另外切一個「今天的課程」區塊。
  const records = bookings
    .map((b) => ({
      id: b.id,
      course: b.course,
      courseId: b.courseId,
      teacher: b.teacher,
      teacherId: b.teacherId,
      studentName: b.studentName,
      date: b.date.replace(/-/g, '/'),
      time: b.time,
      status: b.status,
      bookingCode: b.bookingCode,
      rating: b.rating,
      studentComment: b.studentComment,
    }))
    .filter((r) => new Date(r.date.replace(/\//g, '-')) >= cutoffDate)
    .sort((a, b) => {
      const aToday = isStartingSoon(a);
      const bToday = isStartingSoon(b);
      if (aToday !== bToday) return aToday ? -1 : 1;
      if (aToday) return `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`);
      return `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`);
    });

  const coursesCache = await fetch('/api/courses').then((res) => (res.ok ? res.json() : []));
  function loadCourses() { return coursesCache; }

  function endTimeStr(timeStr, durationMinutes) {
    const [h, m] = timeStr.split(':').map(Number);
    const totalMinutes = h * 60 + m + durationMinutes;
    const endH = Math.floor(totalMinutes / 60) % 24;
    const endM = totalMinutes % 60;
    return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
  }

  function durationLabelStr(durationMinutes) {
    const h = Math.floor(durationMinutes / 60);
    const m = durationMinutes % 60;
    if (h && m) return t('common.durationBoth', { h, m });
    if (h) return t('common.durationHourOnly', { h });
    return t('common.durationMinuteOnly', { m });
  }

  function computeDisplayParts(r) {
    const shifted = shiftToStudentTz(r.date, r.time);
    const course = loadCourses().find((c) => (r.courseId != null && c.id === r.courseId) || c.name === r.course);
    const durationMinutes = (course && course.durationMinutes) || 60;
    const timeLabel = `${shifted.time} - ${endTimeStr(shifted.time, durationMinutes)}`;
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    const dateLabel = isMobile ? formatDateShort(shifted.date) : formatDateLong(shifted.date);
    const durationLabel = durationLabelStr(durationMinutes);
    return { dateLabel, timeLabel, startTimeLabel: shifted.time, durationLabel };
  }

  function formatDateTime(r, showTz = true) {
    const { dateLabel, startTimeLabel } = computeDisplayParts(r);
    const tzTag = showTz ? `<span class="tz-tag">UTC${formatUtcOffset(STUDENT_TZ_OFFSET)}</span>` : '';
    return `${dateLabel} ${startTimeLabel}${tzTag}`;
  }

  function renderHistoryCard(r) {
    const s = STATUS_MAP[r.status];
    const isToday = isStartingSoon(r);
    return `<div class="booking-card is-clickable" data-id="${r.id}">
      ${isToday ? `<span class="booking-card-today-badge" aria-label="${t('history.today')}"><img src="../assets/icons/flag.png" alt=""></span>` : ''}
      <div class="booking-card-status-stack">
        <span class="pill ${s.cls} has-icon booking-card-status"><img class="pill-icon" src="../assets/icons/${s.icon}" alt="">${s.label}</span>
        ${r.status === 'attended' ? studentFeedbackPillHtml(r) : ''}
      </div>
      <div class="booking-card-info">
        <p class="booking-card-datetime">${formatDateTime(r, false)}</p>
        <p class="booking-card-course">${r.course}</p>
        <h4>${r.studentName} ／ ${r.teacher}</h4>
      </div>
    </div>`;
  }

  const historyPageState = { page: 1 };

  function bindCardClicks(containerEl) {
    containerEl.querySelectorAll('.booking-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => showHistoryDetail(Number(card.dataset.id)));
    });
    containerEl.querySelectorAll('.booking-card-empty').forEach((card) => applyTiltEffect(card));
  }

  function renderHistoryCards() {
    paginate(records, 10, renderHistoryCard,
      document.getElementById('history-cards'),
      document.getElementById('history-pagination'),
      historyPageState,
      `<div class="booking-card-empty">${t('history.noRecords')}</div>`,
      bindCardClicks);
  }

  renderHistoryCards();

  document.querySelectorAll('#history-detail-view .confirm-highlight').forEach((card) => applyTiltEffect(card, 6));

  // ==========================================================================
  // 課程詳情：查看 / 取消預約
  // ==========================================================================
  let activeRecordId = null;

  function showHistoryDetail(id) {
    const record = records.find((r) => r.id === id);
    if (!record) return;
    activeRecordId = id;
    document.getElementById('detail-course').textContent = record.course;
    setCourseHighlightIcon(document.getElementById('detail-course-image'), loadCourses().find((c) => (record.courseId != null && c.id === record.courseId) || c.name === record.course));
    document.getElementById('detail-student').textContent = record.studentName;
    document.getElementById('detail-teacher').textContent = record.teacher;
    const parts = computeDisplayParts(record);
    document.getElementById('detail-datetime').textContent = parts.dateLabel;
    document.getElementById('detail-time').textContent = `${parts.timeLabel}・${parts.durationLabel}・UTC${formatUtcOffset(STUDENT_TZ_OFFSET)}`;
    document.getElementById('detail-booking-code').textContent = record.bookingCode || '—';
    document.getElementById('history-list-view').hidden = true;
    document.getElementById('history-detail-view').hidden = false;
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-arrow-left';

    const ribbon = RIBBON_TONE_MAP[record.status];
    document.getElementById('detail-status-ribbon').hidden = !ribbon;
    if (ribbon) {
      const ribbonText = document.getElementById('detail-status-ribbon-text');
      ribbonText.textContent = ribbon.label;
      ribbonText.className = `course-ribbon ${ribbon.tone}`;
    }
    document.querySelector('#history-detail-view .wizard-nav').hidden = record.status !== 'upcoming';

    const isAttended = record.status === 'attended';
    const alreadyRated = isAttended && (record.rating != null || !!record.studentComment);

    // 送出評分之後，「為這堂課評分」換成「課程回饋」區塊（跟管理者看到的同一種樣式），但學生只看得到
    // 自己那段；老師的評分／課堂記錄只有老師本人跟管理者看得到（後端也不會回傳給學生）。
    document.getElementById('rating-result-view').hidden = !alreadyRated;
    if (alreadyRated) {
      renderFeedbackEntries(document.getElementById('rating-result-entries'), [
        { avatar: me && me.avatar, name: record.studentName, rating: record.rating, text: record.studentComment },
      ]);
    }

    document.getElementById('rating-input-view').hidden = !isAttended || alreadyRated;
    if (isAttended && !alreadyRated) {
      document.getElementById('rating-comment-input').value = '';
      resetStarInput();
    }

    window.scrollTo(0, 0);
  }

  function hideHistoryDetail() {
    activeRecordId = null;
    document.getElementById('history-detail-view').hidden = true;
    document.getElementById('history-list-view').hidden = false;
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-house';
  }

  bindCopyDetailButton(document.getElementById('copy-detail-btn'),
    () => { const r = records.find((x) => x.id === activeRecordId); return r ? STATUS_MAP[r.status].label : ''; },
    () => showHistoryAlert(t('history.detail.copyFailed')));

  document.getElementById('back-btn').addEventListener('click', () => {
    if (!document.getElementById('history-detail-view').hidden) {
      hideHistoryDetail();
      return;
    }
    window.location.href = 'index.html';
  });

  // 課程時間統一以 UTC+8 為基準儲存，取消時限也依此時間比對，不受管理者/瀏覽器所在時區影響
  function nowInUtc8() {
    const now = new Date();
    return new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 8 * 60 * 60000);
  }

  function hoursUntilStart(record) {
    const start = new Date(`${record.date.replace(/\//g, '-')}T${record.time}:00`);
    return (start.getTime() - nowInUtc8().getTime()) / 3600000;
  }

  // 「今天」徽章／排序置頂的規則：還沒開始、但 24 小時內就會開始上課（取消的不算）。
  function isStartingSoon(record) {
    if (record.status === 'cancelled') return false;
    const hrs = hoursUntilStart(record);
    return hrs >= 0 && hrs <= 24;
  }

  document.getElementById('cancel-booking-btn').addEventListener('click', () => {
    const record = records.find((r) => r.id === activeRecordId);
    if (!record) return;
    const course = loadCourses().find((c) => (record.courseId != null && c.id === record.courseId) || c.name === record.course);
    const minLeadHours = course?.minLeadHours ?? 48;
    if (hoursUntilStart(record) < minLeadHours) {
      document.getElementById('cancel-too-late-note').textContent = t('history.tooLate.note', { hours: minLeadHours });
      document.getElementById('cancelTooLateModal').classList.add('open');
      return;
    }
    document.getElementById('cancelConfirmModal').classList.add('open');
  });

  document.getElementById('confirm-cancel-btn').addEventListener('click', async () => {
    const record = records.find((r) => r.id === activeRecordId);
    document.getElementById('cancelConfirmModal').classList.remove('open');
    if (!record) return;

    const res = await fetch(`/api/bookings?id=${record.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'cancelled' }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showHistoryAlert(data.error || t('history.cancel.error'));
      return;
    }
    record.status = 'cancelled';
    hideHistoryDetail();
    renderHistoryCards();
  });

  // ==========================================================================
  // 已完成課程的評分——選星星（必填）＋給老師的留言（選填），按「送出評分」後跳出確認
  // modal，按確定才真的送出；點星星本身只是選取，不會送出。取消 modal 會保留目前的選取
  // 跟留言，讓學生可以回去修改。
  // ==========================================================================
  let pendingRating = null;

  function onStarPicked(n) {
    pendingRating = n;
    // 比照預約精靈的「下一步」：只在按鈕從停用變成可按的那一下跳一次（改選別的星星不會再跳）
    setButtonEnabled(document.getElementById('submit-rating-btn'), true);
  }

  function resetStarInput() {
    pendingRating = null;
    document.getElementById('submit-rating-btn').disabled = true;
    initStarRatingInput(document.getElementById('rating-stars-input'), onStarPicked);
  }

  document.getElementById('submit-rating-btn').addEventListener('click', () => {
    if (!pendingRating) return;
    const comment = document.getElementById('rating-comment-input').value.trim();
    document.getElementById('rating-confirm-stars').innerHTML = starsHtml(pendingRating);
    const commentEl = document.getElementById('rating-confirm-comment');
    commentEl.textContent = comment;
    commentEl.hidden = !comment;
    document.getElementById('ratingConfirmModal').classList.add('open');
  });

  document.getElementById('confirm-submit-rating-btn').addEventListener('click', () => {
    document.getElementById('ratingConfirmModal').classList.remove('open');
    submitRating(pendingRating, document.getElementById('rating-comment-input').value.trim());
  });

  async function submitRating(rating, comment) {
    const record = records.find((r) => r.id === activeRecordId);
    if (!record) return;
    const res = await fetch(`/api/bookings?id=${record.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rating, studentComment: comment || null }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showHistoryAlert(data.error || t('booking.rating.submitFailed'));
      return;
    }
    const updated = await res.json();
    record.rating = updated.rating;
    record.studentComment = updated.studentComment;
    showHistoryDetail(record.id);
    renderHistoryCards();
  }
})();
</script>

</body>
