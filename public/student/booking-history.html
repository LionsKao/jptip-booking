<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 我的課程</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.booking-history .page {
    max-width: 1048px;
    padding-top: calc(var(--space-6) + 64px + var(--space-5));
  }
  #today-group,
  #history-group {
    max-width: 1000px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  .page-nav {
    display: flex;
    justify-content: center;
    margin-top: var(--space-6);
  }

  #history-cards,
  #today-cards {
    grid-template-columns: repeat(2, 1fr);
  }

  .booking-card.is-clickable { cursor: pointer; }
  .booking-card:hover { border-color: var(--color-blue); }

  .booking-card-empty { min-height: 160px; }

  .booking-card-info {
    gap: 3px;
  }
  .booking-card-code {
    margin: 0;
    color: var(--text-muted);
    font-size: 1.125rem;
    font-variant-numeric: tabular-nums;
  }
  .booking-card-info h4,
  .booking-card-info .booking-card-course {
    margin: 0;
    line-height: 1.6;
  }
  .booking-card-info .booking-card-datetime {
    margin: 0;
    font-size: 1.125rem;
  }

  .wizard-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    margin-top: var(--space-6);
  }
  .wizard-nav .btn { min-width: 160px; }

  @media (max-width: 1048px) {
    body.booking-history .page {
      max-width: 100%;
      padding-left: var(--space-4);
      padding-right: var(--space-4);
    }
  }
  @media (max-width: 640px) {
    body.booking-history .page {
      padding-top: calc(var(--space-3) + 40px + var(--space-3));
    }
    #history-cards,
    #today-cards {
      grid-template-columns: 1fr;
    }
    .wizard-nav {
      width: 100%;
      flex-wrap: wrap;
    }
    .wizard-nav .btn { min-width: 0; flex: 1 1 0; }
  }
</style>
</head>
<body class="booking-history">

<div class="back-header">
  <button type="button" class="back-btn" id="back-btn"><i class="fa-solid fa-fw fa-house" id="back-btn-icon"></i></button>
</div>

<div class="page">

  <div id="history-list-view">

    <section class="section" id="today-group">
      <div class="section-title"><img class="title-icon" src="../assets/icons/flag.png" alt=""><h2>今天的課程</h2></div>
      <div class="booking-cards" id="today-cards"></div>
    </section>

    <section class="section" id="history-group">
      <div class="section-title"><img class="title-icon" src="../assets/icons/flash-card.png" alt=""><h2>我的課程</h2><button type="button" class="info-btn" data-modal-open="historyRecordInfoModal" aria-label="說明"><i class="fa-solid fa-fw fa-circle-question"></i></button><button type="button" class="info-btn" data-modal-open="historyTimezoneModal" aria-label="時區說明"><i class="fa-solid fa-fw fa-globe"></i></button></div>
      <div class="booking-cards" id="history-cards"></div>
    </section>

    <div class="page-nav">
      <div class="pagination" id="history-pagination"></div>
    </div>

  </div>

  <div id="history-detail-view" hidden>
    <section class="section">
      <span class="ribbon-clip" id="detail-status-ribbon" hidden><span class="course-ribbon" id="detail-status-ribbon-text"></span></span>
      <div class="section-title"><img class="title-icon" src="../assets/icons/clipboard.png" alt=""><h2>課程詳情</h2></div>
      <div class="confirm-summary">
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/invoice.png" alt=""></span>
          <span><p>預約編號</p><h3 id="detail-booking-code">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/books.png" alt=""></span>
          <span><p>課程</p><h3 id="detail-course">—</h3></span>
        </div>
        <div class="confirm-highlight-row">
          <div class="confirm-highlight">
            <span class="confirm-highlight-icon"><img src="../assets/icons/student.png" alt=""></span>
            <span><p>學生</p><h3 id="detail-student">—</h3></span>
          </div>
          <div class="confirm-highlight">
            <span class="confirm-highlight-icon"><img src="../assets/icons/woman.png" alt=""></span>
            <span><p>老師</p><h3 id="detail-teacher">—</h3></span>
          </div>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/icon-calendar.png" alt=""></span>
          <span><p>日期</p><h3 id="detail-datetime">—</h3></span>
        </div>
        <div class="confirm-highlight">
          <span class="confirm-highlight-icon"><img src="../assets/icons/clock.png" alt=""></span>
          <span><p>時間</p><h3 id="detail-time">—</h3></span>
        </div>
      </div>
    </section>
    <div class="wizard-nav">
      <button type="button" class="btn red" id="cancel-booking-btn"><i class="fa-solid fa-fw fa-xmark"></i> 取消預約</button>
    </div>
  </div>

</div>

<div class="modal-overlay" id="cancelConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-xmark"></i></div>
    <h3>確定要取消預約嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> 取消</button>
      <button class="btn red" id="confirm-cancel-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> 確定取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cancelTooLateModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-exclamation"></i></div>
    <h3>已無法取消此預約</h3>
    <p class="text-small" id="cancel-too-late-note"></p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> 知道了</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyRecordInfoModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon info"><i class="fa-solid fa-fw fa-clock-rotate-left"></i></div>
    <h3>我的課程最多顯示 365 天內</h3>
    <p class="text-small">從今天往回算 365 天，超過的課程紀錄就不會再顯示囉。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> 知道了</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="historyTimezoneModal">
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon timezone"><i class="fa-solid fa-globe"></i></div>
    <h3>課程時間顯示時區</h3>
    <p class="text-small" id="history-timezone-note"></p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> 知道了</button>
    </div>
  </div>
</div>

<script src="../script.js"></script>
<script>
  const STATUS_MAP = {
    pending:   { cls: 'pending',   icon: 'icon-alert.png',     label: '需處理' },
    absent:    { cls: 'tone-navy', icon: 'question.png',       label: '缺席' },
    upcoming:  { cls: 'info',      icon: 'icon-hourglass.png', label: '預約' },
    cancelled: { cls: 'cancelled', icon: 'close.png',          label: '取消' },
    attended:  { cls: 'confirmed', icon: 'check.png',          label: '完成' },
  };
  const RIBBON_TONE_MAP = {
    pending:   { tone: 'tone-orange', label: '需處理' },
    absent:    { tone: 'tone-navy',   label: '缺席' },
    upcoming:  { tone: 'tone-blue',   label: '預約' },
    cancelled: { tone: 'tone-red',    label: '取消' },
    attended:  { tone: 'tone-green',  label: '完成' },
  };

  // 課程時間統一存成 UTC+8（台灣時間）為基準；顯示給學生看時，依管理者在學生資料設定的時區（+8／+9）換算顯示
  function getSession() { try { return JSON.parse(sessionStorage.getItem('session')); } catch { return null; } }
  const session = getSession();
  const students = session ? loadStudents() : [];
  const currentStudent = session ? students.find((s) => s.email === session.email) : null;
  const STUDENT_TIMEZONE_LABEL = (currentStudent && currentStudent.timezone) || '(UTC+8) 台北';
  const STUDENT_TZ_OFFSET = STUDENT_TIMEZONE_LABEL.includes('+9') ? 9 : 8;
  const STUDENT_TZ_DELTA_HOURS = STUDENT_TZ_OFFSET - 8;
  document.getElementById('history-timezone-note').textContent = `所有課程時間皆為 ${STUDENT_TIMEZONE_LABEL} 時間`;

  function shiftToStudentTz(dateStr, timeStr) {
    if (!STUDENT_TZ_DELTA_HOURS) return { date: dateStr, time: timeStr };
    const dt = new Date(`${dateStr.replace(/\//g, '-')}T${timeStr}:00`);
    dt.setHours(dt.getHours() + STUDENT_TZ_DELTA_HOURS);
    const y = dt.getFullYear(), m = String(dt.getMonth() + 1).padStart(2, '0'), day = String(dt.getDate()).padStart(2, '0');
    const hh = String(dt.getHours()).padStart(2, '0'), mm = String(dt.getMinutes()).padStart(2, '0');
    return { date: `${y}/${m}/${day}`, time: `${hh}:${mm}` };
  }

  // 只顯示 365 天內的紀錄，上課日期超過 365 天的舊紀錄不再顯示
  const RECORD_WINDOW_DAYS = 365;
  const cutoffDate = new Date();
  cutoffDate.setHours(0, 0, 0, 0);
  cutoffDate.setDate(cutoffDate.getDate() - RECORD_WINDOW_DAYS);

  const records = ((currentStudent && currentStudent.bookings) || [])
    .map((b) => ({
      id: b.id,
      course: b.course,
      courseId: b.courseId,
      teacher: b.teacher,
      date: b.date.replace(/-/g, '/'),
      time: b.time,
      status: b.status,
      bookingCode: b.bookingCode,
    }))
    .filter((r) => new Date(r.date.replace(/\//g, '-')) >= cutoffDate)
    .sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`));

  function loadCourses() { return JSON.parse(localStorage.getItem('admin-courses') || '[]'); } // TODO: 之後改接真正的 D1/API

  function endTimeStr(timeStr, durationMinutes) {
    const [h, m] = timeStr.split(':').map(Number);
    const totalMinutes = h * 60 + m + durationMinutes;
    const endH = Math.floor(totalMinutes / 60) % 24;
    const endM = totalMinutes % 60;
    return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
  }

  function durationLabelStr(durationMinutes) {
    const h = Math.floor(durationMinutes / 60);
    const m = durationMinutes % 60;
    if (h && m) return `${h} 時 ${m} 分`;
    if (h) return `${h} 時`;
    return `${m} 分`;
  }

  const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

  function computeDisplayParts(r) {
    const shifted = shiftToStudentTz(r.date, r.time);
    const course = loadCourses().find((c) => (r.courseId != null && c.id === r.courseId) || c.name === r.course);
    const durationMinutes = (course && course.durationMinutes) || 60;
    const timeLabel = `${shifted.time} - ${endTimeStr(shifted.time, durationMinutes)}`;
    const d = new Date(shifted.date.replace(/\//g, '-'));
    const weekday = WEEKDAY_NAMES[d.getDay()];
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    const dateLabel = isMobile
      ? `${shifted.date} ${weekday}`
      : (() => { const [y, m, day] = shifted.date.split('/'); return `${y} 年 ${m} 月 ${day} 日 星期${weekday}`; })();
    const durationLabel = durationLabelStr(durationMinutes);
    return { dateLabel, timeLabel, startTimeLabel: shifted.time, durationLabel };
  }

  function formatDateTime(r, showTz = true) {
    const { dateLabel, startTimeLabel } = computeDisplayParts(r);
    const tzTag = showTz ? `<span class="tz-tag">(UTC+${STUDENT_TZ_OFFSET})</span>` : '';
    return `${dateLabel} ${startTimeLabel}${tzTag}`;
  }

  function renderHistoryCard(r) {
    const s = STATUS_MAP[r.status];
    return `<div class="booking-card is-clickable" data-id="${r.id}">
      <span class="pill ${s.cls} has-icon booking-card-status"><img class="pill-icon" src="../assets/icons/${s.icon}" alt="">${s.label}</span>
      <div class="booking-card-info">
        ${r.bookingCode ? `<p class="booking-card-code">${r.bookingCode}</p>` : ''}
        <p class="booking-card-course">${r.course}</p>
        <h4>${currentStudent.name} ／ ${r.teacher}</h4>
        <p class="booking-card-datetime">${formatDateTime(r, false)}</p>
      </div>
    </div>`;
  }

  const historyPageState = { page: 1 };

  function bindCardClicks(containerEl) {
    containerEl.querySelectorAll('.booking-card').forEach((card) => {
      applyTiltEffect(card);
      card.addEventListener('click', () => showHistoryDetail(Number(card.dataset.id)));
    });
    containerEl.querySelectorAll('.booking-card-empty').forEach((card) => applyTiltEffect(card));
  }

  function renderHistoryCards() {
    paginate(records, 10, renderHistoryCard,
      document.getElementById('history-cards'),
      document.getElementById('history-pagination'),
      historyPageState,
      '<div class="booking-card-empty">尚無課程紀錄</div>',
      bindCardClicks);
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  }

  function renderTodayGroup() {
    const today = todayStr();
    const todayRecords = records.filter((r) => r.date === today && r.status !== 'cancelled');
    const cardsEl = document.getElementById('today-cards');
    cardsEl.innerHTML = todayRecords.length
      ? todayRecords.map(renderHistoryCard).join('')
      : '<div class="booking-card-empty">今天沒有課程</div>';
    bindCardClicks(cardsEl);
    cardsEl.querySelectorAll('.booking-card-empty').forEach((card) => applyTiltEffect(card));
  }

  renderHistoryCards();
  renderTodayGroup();

  document.querySelectorAll('#history-detail-view .confirm-highlight').forEach((card) => applyTiltEffect(card, 6));

  // ==========================================================================
  // 課程詳情：查看 / 取消預約
  // ==========================================================================
  let activeRecordId = null;

  function showHistoryDetail(id) {
    const record = records.find((r) => r.id === id);
    if (!record) return;
    activeRecordId = id;
    document.getElementById('detail-course').textContent = record.course;
    document.getElementById('detail-student').textContent = currentStudent.name;
    document.getElementById('detail-teacher').textContent = record.teacher;
    const parts = computeDisplayParts(record);
    document.getElementById('detail-datetime').textContent = parts.dateLabel;
    document.getElementById('detail-time').textContent = `${parts.timeLabel}・${parts.durationLabel}・UTC+${STUDENT_TZ_OFFSET}`;
    document.getElementById('detail-booking-code').textContent = record.bookingCode || '—';
    document.getElementById('history-list-view').hidden = true;
    document.getElementById('history-detail-view').hidden = false;
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-arrow-left';

    const ribbon = RIBBON_TONE_MAP[record.status];
    document.getElementById('detail-status-ribbon').hidden = !ribbon;
    if (ribbon) {
      const ribbonText = document.getElementById('detail-status-ribbon-text');
      ribbonText.textContent = ribbon.label;
      ribbonText.className = `course-ribbon ${ribbon.tone}`;
    }
    document.querySelector('#history-detail-view .wizard-nav').hidden = record.status !== 'upcoming';

    window.scrollTo(0, 0);
  }

  function hideHistoryDetail() {
    activeRecordId = null;
    document.getElementById('history-detail-view').hidden = true;
    document.getElementById('history-list-view').hidden = false;
    document.getElementById('back-btn-icon').className = 'fa-solid fa-fw fa-house';
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    if (!document.getElementById('history-detail-view').hidden) {
      hideHistoryDetail();
      return;
    }
    window.location.href = 'index.html';
  });

  // 課程時間統一以 UTC+8 為基準儲存，取消時限也依此時間比對，不受管理者/瀏覽器所在時區影響
  function nowInUtc8() {
    const now = new Date();
    return new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 8 * 60 * 60000);
  }

  function hoursUntilStart(record) {
    const start = new Date(`${record.date.replace(/\//g, '-')}T${record.time}:00`);
    return (start.getTime() - nowInUtc8().getTime()) / 3600000;
  }

  document.getElementById('cancel-booking-btn').addEventListener('click', () => {
    const record = records.find((r) => r.id === activeRecordId);
    if (!record) return;
    const course = loadCourses().find((c) => (record.courseId != null && c.id === record.courseId) || c.name === record.course);
    const minLeadHours = course?.minLeadHours ?? 48;
    if (hoursUntilStart(record) < minLeadHours) {
      document.getElementById('cancel-too-late-note').textContent = `距離上課時間不足 ${minLeadHours} 小時，已無法取消預約，如有需要請聯絡管理者協助處理。`;
      document.getElementById('cancelTooLateModal').classList.add('open');
      return;
    }
    document.getElementById('cancelConfirmModal').classList.add('open');
  });

  document.getElementById('confirm-cancel-btn').addEventListener('click', () => {
    const record = records.find((r) => r.id === activeRecordId);
    if (record) record.status = 'cancelled';
    const booking = currentStudent && (currentStudent.bookings || []).find((b) => b.id === activeRecordId);
    if (booking) {
      booking.status = 'cancelled';
      saveStudents(students);
    }
    document.getElementById('cancelConfirmModal').classList.remove('open');
    hideHistoryDetail();
    renderHistoryCards();
    renderTodayGroup();
  });
</script>

</body>
</html>
