<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 學生主頁</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.dashboard {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.dashboard .page {
    width: 100%;
    max-width: 548px;
    margin: 0 auto;
    padding-top: var(--space-6);
    padding-bottom: var(--space-6);
  }

  .dash-cards {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }
  .dash-card {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    width: 500px;
    max-width: 100%;
    margin: 0 auto;
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    padding: var(--space-5) 40px;
    will-change: transform;
    transform-style: preserve-3d;
    transition: border-color .2s ease, box-shadow .2s ease, transform .35s ease;
  }
  .dash-card:hover {
    border-color: var(--color-blue);
    box-shadow: var(--shadow-md);
  }
  .dash-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 64px;
    height: 64px;
  }
  .dash-card-icon img { width: 100%; height: 100%; object-fit: contain; }
  .dash-card h3 { margin: 0 0 4px; font-size: 1.375rem; }
  .dash-card p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); }

  @media (max-width: 640px) {
    .dash-card {
      padding: var(--space-4) var(--space-4);
      gap: var(--space-3);
    }
  }
</style>
</head>
<body class="dashboard">

<div class="back-header">
  <button type="button" class="back-btn" id="logout-btn" data-modal-open="logoutConfirmModal"><i class="fa-solid fa-fw fa-arrow-right-from-bracket"></i></button>
</div>

<div class="modal-overlay" id="logoutConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3>確定要登出嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> 取消</button>
      <button class="btn red" id="logout-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> 登出</button>
    </div>
  </div>
</div>

<div class="page">

  <div class="dash-cards">
    <button type="button" class="dash-card" data-action="meeting-room">
      <span class="dash-card-icon"><img src="../assets/icons/online-training.png" alt=""></span>
      <span>
        <h3>會議室</h3>
        <p>進入線上課程的會議室</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="new-booking">
      <span class="dash-card-icon"><img src="../assets/icons/add-event.png" alt=""></span>
      <span>
        <h3>新增預約</h3>
        <p>預約新的課程時段</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="booking-history">
      <span class="dash-card-icon"><img src="../assets/icons/flash-card.png" alt=""></span>
      <span>
        <h3>我的課程</h3>
        <p>查看已預約的課程與紀錄</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="messages" hidden>
      <span class="dash-card-icon"><img src="../assets/icons/message.png" alt=""></span>
      <span>
        <h3>留言</h3>
        <p>查看與老師的留言</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="settings" hidden>
      <span class="dash-card-icon"><img src="../assets/icons/cogwheel.png" alt=""></span>
      <span>
        <h3>設定</h3>
        <p>管理個人資料與偏好設定</p>
      </span>
    </button>
  </div>

</div>

<script src="../script.js"></script>
<script>
  document.getElementById('logout-confirm-btn').addEventListener('click', () => {
    fetch('/api/logout', { method: 'POST' }).finally(() => { window.location.href = '../'; });
  });

  // TODO: 之後管理者為學生設定專屬會議室連結後,改成開啟該連結
  document.querySelector('[data-action="meeting-room"]').addEventListener('click', () => {
    window.open('https://www.google.com', '_blank');
  });

  document.querySelector('[data-action="new-booking"]').addEventListener('click', () => {
    window.location.href = 'booking.html';
  });

  document.querySelector('[data-action="booking-history"]').addEventListener('click', () => {
    window.location.href = 'booking-history.html';
  });

  document.querySelectorAll('.dash-card').forEach((card) => applyTiltEffect(card));
</script>

</body>
</html>
