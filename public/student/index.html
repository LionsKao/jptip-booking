<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LionBooking — 學生主頁</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../style.css">
<style>
  body.dashboard {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.dashboard .page {
    width: 100%;
    max-width: 548px;
    margin: 0 auto;
    padding-top: var(--space-6);
    padding-bottom: var(--space-6);
  }

  .dash-cards {
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }
  .dash-card {
    display: flex;
    align-items: center;
    gap: var(--space-5);
    width: 550px;
    max-width: 100%;
    margin: 0 auto;
    border-radius: var(--radius-lg);
    border: 3px solid var(--line);
    background: var(--bg-card);
    box-shadow: var(--shadow-sm);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    padding: var(--space-5) 40px;
    will-change: transform;
    transform-style: preserve-3d;
    transition: border-color .2s ease, box-shadow .2s ease, transform .35s ease;
  }
  .dash-card:hover {
    border-color: var(--color-blue);
    box-shadow: var(--shadow-md);
  }
  .dash-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 64px;
    height: 64px;
  }
  .dash-card-icon img { width: 100%; height: 100%; object-fit: contain; }
  .dash-card h3 { margin: 0 0 4px; font-size: 1.375rem; }
  /* 說明只顯示一行，太長（例如其他語言、畫面變窄時）就截斷成「…」；外層要能縮小才截得到 */
  .dash-card > span:last-child { flex: 1; min-width: 0; }
  .dash-card p { margin: 0; color: var(--text-muted); font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 640px) {
    .dash-card {
      padding: var(--space-4) var(--space-4);
      gap: var(--space-3);
    }
  }
</style>
</head>
<body class="dashboard">

<div class="back-header">
  <button type="button" class="back-btn" id="logout-btn" data-modal-open="logoutConfirmModal"><i class="fa-solid fa-fw fa-arrow-right-from-bracket"></i></button>
</div>

<div id="lang-switch"></div>

<div class="modal-overlay" id="meetingRoomAlertModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon warning"><i class="fa-solid fa-fw fa-exclamation"></i></div>
    <h3 data-i18n="dashboard.meetingRoomAlert.title">尚未設定會議室連結</h3>
    <p class="text-small" data-i18n="dashboard.meetingRoomAlert.desc">請聯繫管理者為你設定專屬的會議室連結。</p>
    <div class="modal-actions">
      <button class="btn blue" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-check"></i> <span data-i18n="common.ok">好</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="logoutConfirmModal" data-modal-persistent>
  <div class="modal" style="text-align:center;">
    <button class="modal-close" data-modal-close><i class="fa-solid fa-fw fa-xmark"></i></button>
    <div class="modal-icon danger"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
    <h3 data-i18n="dashboard.logoutConfirm.title">確定要登出嗎？</h3>
    <div class="modal-actions">
      <button class="btn outline" data-modal-close style="flex:1;"><i class="fa-solid fa-fw fa-arrow-left"></i> <span data-i18n="common.cancel">取消</span></button>
      <button class="btn red" id="logout-confirm-btn" style="flex:1;"><i class="fa-solid fa-fw fa-xmark"></i> <span data-i18n="dashboard.logout">登出</span></button>
    </div>
  </div>
</div>

<div class="page">

  <div class="dash-cards">
    <button type="button" class="dash-card" data-action="meeting-room">
      <span class="dash-card-icon"><img src="../assets/icons/online-training.png" alt=""></span>
      <span>
        <h3 data-i18n="dashboard.meetingRoom.title">會議室</h3>
        <p data-i18n="dashboard.meetingRoom.desc">進入線上課程的會議室</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="new-booking">
      <span class="dash-card-icon"><img src="../assets/icons/add-event.png" alt=""></span>
      <span>
        <h3 data-i18n="dashboard.newBooking.title">新增預約</h3>
        <p data-i18n="dashboard.newBooking.desc">預約新的課程時段</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="booking-history">
      <span class="dash-card-icon"><img src="../assets/icons/flash-card.png" alt=""></span>
      <span>
        <h3 data-i18n="history.myCourses">我的課程</h3>
        <p data-i18n="dashboard.myCourses.desc">查看已預約的課程與紀錄</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="messages" hidden>
      <span class="dash-card-icon"><img src="../assets/icons/message.png" alt=""></span>
      <span>
        <h3>留言</h3>
        <p>查看與老師的留言</p>
      </span>
    </button>
    <button type="button" class="dash-card" data-action="settings">
      <span class="dash-card-icon"><img src="../assets/icons/cogwheel.png" alt=""></span>
      <span>
        <h3 data-i18n="settings.title">設定</h3>
        <p data-i18n="settings.desc">管理個人資料與偏好設定</p>
      </span>
    </button>
  </div>

</div>

<script src="../script.js"></script>
<script>
(async () => {
  // 帳號的 language 欄位才是真相；登入後這裡負責把它同步進 localStorage，
  // 也讓學生隨時能在這頁換語言（換的當下也存回帳號，換裝置登入才會一致）。
  const me = await fetch('/api/students/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
  const lang = (me && me.language) || getCurrentLang();
  setCurrentLang(lang);
  await initI18n(lang);
  renderLangSwitch(document.getElementById('lang-switch'), lang, (newLang) => {
    fetch('/api/me/language', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ language: newLang }),
    });
  });
})();

  document.getElementById('logout-confirm-btn').addEventListener('click', () => {
    fetch('/api/logout', { method: 'POST' }).finally(() => { window.location.href = '../'; });
  });

  document.querySelector('[data-action="meeting-room"]').addEventListener('click', async () => {
    const me = await fetch('/api/students/me').then((res) => (res.ok ? res.json() : null)).catch(() => null);
    if (me && me.teamsLink) {
      window.open(me.teamsLink, '_blank');
    } else {
      document.getElementById('meetingRoomAlertModal').classList.add('open');
    }
  });

  document.querySelector('[data-action="new-booking"]').addEventListener('click', () => {
    window.location.href = 'booking.html';
  });

  document.querySelector('[data-action="booking-history"]').addEventListener('click', () => {
    window.location.href = 'booking-history.html';
  });

  document.querySelector('[data-action="settings"]').addEventListener('click', () => {
    window.location.href = 'settings.html';
  });

  document.querySelectorAll('.dash-card').forEach((card) => applyTiltEffect(card));
</script>

</body>
</html>
